    desert: '<g fill="var(--desert)"><circle cx="3" cy="4" r="1"/><circle cx="7" cy="4" r="1"/><circle cx="11" cy="4" r="1"/><circle cx="5" cy="8" r="1"/><circle cx="9" cy="8" r="1"/><circle cx="3" cy="12" r="1"/><circle cx="7" cy="12" r="1"/><circle cx="11" cy="12" r="1"/></g>',
    prov: '<path d="M1 7H13" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="3 2"/>',
    border: '<path d="M1 7H13" stroke="var(--ink-3)" stroke-width="1.2" stroke-dasharray="4 2 1 2"/>'
  };
  const legend = document.getElementById("legend");
  for (const L of LAYERS) {
    const li = document.createElement("li");
    li.innerHTML = `<button aria-pressed="${layerOn[L.id]}" data-l="${L.id}"><svg width="14" height="14" viewBox="0 0 14 14">${SYM[L.id]}</svg><span>${L.name}</span></button>`;
    legend.append(li);
  }
  function labelLayers() {
    for (const L of LAYERS) legend.querySelector(`[data-l="${L.id}"] span`).textContent = LZ(L.name, L.en);
    const symText = { people: ["族", "P"] };
    legend.querySelectorAll("svg text").forEach(n => { const id = n.closest("[data-l]").dataset.l; if (symText[id]) n.textContent = pick(symText[id]); });
  }
  legend.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const id = b.dataset.l; layerOn[id] = !layerOn[id];
    b.setAttribute("aria-pressed", layerOn[id] ? "true" : "false");
    if (id === "terr" || id === "region") buildTerr();
    render();
  });
  const legT = document.getElementById("legtoggle");
  function setLeg(open) { legBody.hidden = !open; legT.textContent = open ? LZ("收起", "Hide") : LZ("展开", "Show"); legT.setAttribute("aria-expanded", open); }
  legT.addEventListener("click", () => setLeg(legBody.hidden));
  if (matchMedia("(max-width: 900px)").matches) setLeg(false);

  /* ---------------- 索引 ---------------- */
  const index = document.getElementById("index");
  const closedGroups = new Set(["pref", "people", "other", "range"]);
  function rowEl(k, kcol, o, m, mt, n, chain, fut, sw, zh) {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "row"; b.dataset.k = k; b.dataset.sel = selected === k ? "1" : "0";
    b.style.setProperty("--k", kcol);
    if (fut) b.dataset.future = "1";
    b.innerHTML = `<span class="o">${sw || ""}<span>${esc(o)}${zhTag(zh !== o ? zh : "")}</span></span><span class="m">${esc(m || "")}</span>` + (mt ? `<span class="mt">${mt}</span>` : "") +
      (n ? `<span class="n">${esc(n).replace(/\n/g, "<br>")}</span>` : "") + (chain ? `<span class="chain">${chain}</span>` : "");
    b.addEventListener("click", () => { if (stage.dataset.view !== "map") setMode("map"); select(k, false); });
    b.addEventListener("mouseenter", () => { hovered = k; if (needsTerr(k)) buildTerr(); render(); });
    b.addEventListener("mouseleave", () => { hovered = null; if (needsTerr(k)) buildTerr(); render(); });
    li.append(b); return li;
  }
  function group(id, name, sub, kcol, rows) {
    if (!rows.length) return 0;
    const sec = document.createElement("section");
    sec.className = "grp"; sec.style.setProperty("--k", kcol);
    sec.dataset.closed = closedGroups.has(id) && !query ? "1" : "0";
    sec.innerHTML = `<h2><span class="chev">▼</span><span class="bar"></span>${name}<span class="sub">${rows.length}${sub ? " · " + sub : ""}</span></h2>`;
    sec.querySelector("h2").addEventListener("click", () => {
      const cl = sec.dataset.closed === "1"; sec.dataset.closed = cl ? "0" : "1";
      if (cl) closedGroups.delete(id); else closedGroups.add(id);
    });
    const ol = document.createElement("ol"); rows.forEach(r => ol.append(r)); sec.append(ol); index.append(sec);
    return rows.length;
  }
  function buildIndex() {
    index.replaceChildren();
    const sn = SNAPS[si], YY = sn.y;
    let total = 0;
    const urow = u => { const k = keyOf("u", u), f = info(k, "row"); const tribe = UNITS[u].kind === "tribe"; return rowEl(k, uVar(u), f.old, f.mod, f.meta, f.note, f.chain, false, `<span class="sq${tribe ? " tribe" : ""}" style="--k:${uVar(u)}"></span>`, f.zh); };
    const yl = LZ(`${YY} 年`, `${YY}`);
    // 政权
    total += group("pol", LZ("政权", "States"), yl, "var(--ink-2)", polOrder(sn).filter(p => match(keyOf("u", p))).map(urow));
    // 藩镇
    const zh = sn.units.filter(u => sn.pol[u] !== u && match(keyOf("u", u)));
    zh.sort((a, b) => sn.pol[a] - sn.pol[b] || unitSeeds(b, sn).length - unitSeeds(a, sn).length);
    total += group("zhen", LZ("藩镇", "Fanzhen (military circuits)"), yl, "var(--ink-2)", zh.map(urow));
    // 都城
    const regs = ITEMS.filter(it => it.c === "region" && match(keyOf("i", it.i)));
    total += group("region", LZ("重要地域", "Key regions"), "", "var(--c-yanyun)", regs.map(it => { const k = keyOf("i", it.i), f = info(k, "row"); return rowEl(k, K_OF.region, f.old, f.mod, f.meta, f.note, f.chain, YY < it.y0, null, f.zh); }));
    const caps = ITEMS.filter(it => it.c === "capital" && match(keyOf("i", it.i)));
    caps.sort((a, b) => (capActive(b, YY) - capActive(a, YY)) || a.yrs[0][0] - b.yrs[0][0]);
    const nCap = caps.filter(c => capActive(c, YY)).length;
    total += group("capital", LZ("都城 · 行在", "Capitals"), LZ(`本期 ${nCap}`, `${nCap} now`), "var(--c-capital)", caps.map(it => { const k = keyOf("i", it.i), f = info(k, "row"); return rowEl(k, uVar(it.st), f.old, f.mod, f.meta, f.note, null, !capActive(it, YY), null, f.zh); }));
    const simple = (c, id, name, sub, sortY) => {
      let list = ITEMS.filter(it => it.c === c && match(keyOf("i", it.i)));
      if (sortY) list.sort((a, b) => a.y - b.y);
      total += group(id, name, sub, K_OF[c], list.map(it => { const k = keyOf("i", it.i), f = info(k, "row"); return rowEl(k, K_OF[c], f.old, f.mod, f.meta, f.note, null, sortY && it.y > YY, null, f.zh); }));
    };
    const periodic = (c, id, name) => {
      const list = ITEMS.filter(it => it.c === c && match(keyOf("i", it.i))).sort((a, b) => a.y - b.y);
      const cur = list.filter(it => inPeriod(it, si)), rest = list.filter(it => !inPeriod(it, si));
      total += group(id, name, LZ(`本期 ${cur.length} · 共 ${list.length}`, `${cur.length} this period · ${list.length} total`), K_OF[c], [...cur, ...rest].map(it => { const k = keyOf("i", it.i), f = info(k, "row"); return rowEl(k, K_OF[c], f.old, f.mod, f.meta, f.note, null, !inPeriod(it, si), null, f.zh); }));
    };
    periodic("battle", "battle", LZ("战役", "Battles"));
    simple("pass", "pass", LZ("关隘", "Passes"), "");
    periodic("event", "event", LZ("事件 · 文化", "Events & culture"));
    // 州府
    const prefs = SEEDS.map((S, s) => s).filter(s => SEEDS[s].t !== "r" && match(keyOf("s", s)));
    total += group("pref", LZ("州府 · 城邑", "Prefectures & towns"), LZ("古名 → 今地", "historical → modern"), "var(--c-city)", prefs.map(s => { const k = keyOf("s", s), f = info(k, "row"); return rowEl(k, f.k, f.old, f.mod, f.meta, "", f.chain, false, null, f.zh); }));
    simple("range", "range", LZ("山脉", "Mountains"), "");
    let wl = ITEMS.filter(it => (it.c === "river" || it.c === "canal" || it.c === "desert") && match(keyOf("i", it.i)));
    total += group("river", LZ("水系 · 湖泽 · 运河 · 荒漠", "Rivers · lakes · canals · deserts"), LZ("古名 → 今名", "historical → modern"), "var(--water)", wl.map(it => { const k = keyOf("i", it.i), f = info(k, "row"); return rowEl(k, K_OF[it.c], f.old, f.mod, "", f.note, null, false, null, f.zh); }));
    simple("people", "people", LZ("周边诸族", "Peoples"), "");
    // 其他时期
    const here = new Set([...sn.units, ...sn.pols]);
    const others = UNITS.map((u, i) => i).filter(u => !here.has(u) && presentIn(u).length && match(keyOf("u", u)));
    total += group("other", LZ("其他时期的政权与藩镇", "States and fanzhen of other periods"), LZ("点击跳转", "click to jump"), "var(--ink-3)", others.map(urow));
    if (!total) { const d = document.createElement("div"); d.className = "empty"; d.textContent = LZ("没有匹配的条目。", "No matches."); index.append(d); }
  }

  /* ---------------- 对照表 ---------------- */
  const CATNAME = { region: ["地域", "Region"], capital: ["都城", "Capital"], battle: ["战役", "Battle"], pass: ["关隘", "Pass"], event: ["事件", "Event"], range: ["山脉", "Mountains"], river: ["水系", "Water"], canal: ["运河", "Canal"], desert: ["荒漠", "Desert"], people: ["诸族", "People"] };
  const DATE_NOTE_EN = "Dates give the Chinese lunar month (“11th month, 755”), not a converted Western date; the year is the Western year in which most of that lunar year falls, so a 12th month can reach into January of the next year.";
  function buildTable() {
    const wrap = document.getElementById("tablewrap");
    wrap.replaceChildren();
    const intro = document.createElement("div"); intro.className = "intro";
    intro.innerHTML = LZ(`<p>图中全部州府、城邑与地物，一名一行。州府的“归属沿革”取自地图上 ${SNAPS.length} 个时间节点，连续相同的归属合并显示。经纬度取今日遗址或所在城市，可在任意地图应用中定位；点击任一行回到地图并定位。</p>`,
      `<p>Every prefecture, town and feature on the map, one name per row. A prefecture’s allegiance is taken from the map’s ${SNAPS.length} snapshots, with consecutive identical entries merged. Coordinates are those of the modern site or city and work in any map app; click a row to return to the map.</p><p>${DATE_NOTE_EN}</p>`);
    wrap.append(intro);
    const sc = document.createElement("div"); sc.className = "tscroll";
    const t = document.createElement("table");
    t.innerHTML = LZ(`<thead><tr><th>古名</th><th>今地 / 今名</th><th>类别</th><th>年代 / 名称沿革</th><th>经纬度</th><th>归属沿革 / 按语</th></tr></thead>`,
      `<thead><tr><th>Historical name</th><th>Modern place / name</th><th>Type</th><th>Date / names</th><th>Coordinates</th><th>Allegiance / notes</th></tr></thead>`);
    const tb = document.createElement("tbody");
    const addRow = (k, o, m, cat, kcol, when, ll, note, html, zh) => {
      const tr = document.createElement("tr"); tr.className = "click";
      tr.innerHTML = `<td class="o">${esc(o)}${zhTag(zh !== o ? zh : "")}</td><td>${esc(m || "")}</td><td class="cat" style="--k:${kcol}"><span class="dot"></span>${esc(cat)}</td>` +
        `<td class="num">${when}</td><td class="num">${ll ? ll[0].toFixed(2) + "°E&nbsp; " + ll[1].toFixed(2) + "°N" : ""}</td><td class="note">${html || esc(note || "—")}</td>`;
      tr.addEventListener("click", () => { setMode("map"); requestAnimationFrame(() => select(k, false)); });
      tb.append(tr);
    };
    SEEDS.forEach((S, s) => {
      if (S.t === "r" || !match(keyOf("s", s))) return;
      addRow(keyOf("s", s), LZ(S.n, S.ne || S.n), sMod(S), S.t === "c" ? LZ("城邑", "Town") : LZ("州府", "Prefecture"), "var(--c-city)", S.nm ? namesHTML(S) : "", [S.lon, S.lat], "", `<span class="chain" style="display:block">${chainHTML(s)}</span>`, S.n);
    });
    for (const it of ITEMS) {
      if (!CATNAME[it.c] || !match(keyOf("i", it.i))) continue;
      const ll = it.lon != null ? [it.lon, it.lat] : it.anc;
      const when = it.c === "capital" ? yrsText(it.yrs) : it.c === "region" ? `${it.y0}${DASH()}` : it.yt ? esc(iF(it, "yt")) : it.c === "people" ? `${it.y0}${DASH()}${it.y1}` : "";
      addRow(keyOf("i", it.i), iF(it, "old"), iF(it, "mod"), pick(CATNAME[it.c]) + (it.c === "capital" ? LZ("·", " · ") + uShort(it.st) : ""), it.c === "capital" ? uVar(it.st) : K_OF[it.c], when, ll,
        it.c === "battle" ? `${iF(it, "sides")}${LZ("。", ". ")}${iF(it, "note")}` : iF(it, "note"), null, it.old);
    }
    t.append(tb); sc.append(t); wrap.append(sc);
  }

  /* ---------------- 年表 ---------------- */
  function buildChron() {
    const wrap = document.getElementById("chronwrap");
    wrap.replaceChildren();
    const intro = document.createElement("div"); intro.className = "intro";
    intro.innerHTML = LZ(`<p>把战役、事件、都城迁移与地图上的 ${SNAPS.length} 个时间节点排成一条线。灰底为地图节点；点击任一事件，地图会跳到该事件之后最近的节点并定位。</p>`,
      `<p>Battles, events, capital moves and the map’s ${SNAPS.length} snapshots on a single line. Shaded entries are map snapshots; click any entry to jump to the nearest snapshot after it and locate it on the map.</p><p>${DATE_NOTE_EN}</p>`);
    wrap.append(intro);
    const ev = [];
    for (const it of ITEMS) {
      const k = keyOf("i", it.i);
      if (!match(k)) continue;
      const yt = iF(it, "yt"), t0 = iF(it, "old"), note = iF(it, "note") || "";
      if (it.c === "battle") ev.push({ y: it.y, yt, t: t0, zh: it.old, kd: LZ("战役", "Battle"), p: `${iF(it, "sides")}${LZ("。", ". ")}${note}`, col: "var(--c-battle)", k });
      if (it.c === "event") ev.push({ y: it.y, yt, t: t0, zh: it.old, kd: LZ("事件 · 文化", "Event"), p: note, col: "var(--c-culture)", k });
      if (it.c === "capital") for (const [a] of it.yrs) if (a >= 750 && a <= 979) ev.push({ y: a, yt: String(a), t: LZ(`${UNITS[it.st].n}都${it.old}`, t0), zh: it.old, kd: LZ("都城", `Capital · ${uShort(it.st)}`), p: note, col: uVar(it.st), k });
    }
    if (!query) for (const s of SNAPS) ev.push({ y: s.y, yt: `${s.y}`, t: snT(s), kd: LZ(`地图节点 · ${s.era}`, `Map snapshot · ${snEra(s)}`), p: snD(s), col: "var(--ink)", snap: true });
    ev.sort((a, b) => a.y - b.y || (a.snap ? 1 : 0) - (b.snap ? 1 : 0));
    const box = document.createElement("div"); box.className = "chron";
    for (const e of ev) {
      const d = document.createElement("div");
      d.className = "ev" + (e.snap ? " snap" : ""); d.style.setProperty("--k", e.col);
      d.innerHTML = `<div class="yr">${esc(e.yt)}</div><div class="ln"><i></i></div><div class="evb"><b>${esc(e.t)}</b>${e.zh ? zhTag(e.zh) + (isEN() ? " " : "") : ""}<span class="k">${esc(e.kd)}</span><p>${esc(e.p)}</p></div>`;
      d.addEventListener("click", () => {
        let j = SNAPS.findIndex(s => s.y >= e.y); if (j < 0) j = SNAPS.length - 1;
        setMode("map"); setSnap(j);
        if (e.k) requestAnimationFrame(() => select(e.k, false));
      });
      box.append(d);
    }
    wrap.append(box);
  }

  /* ---------------- 控件 ---------------- */
  document.getElementById("fit").addEventListener("change", e => { activeFit = e.target.value; fitTo(activeFit, true); });
  document.getElementById("cmode").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    cmode = b.dataset.cm;
    document.querySelectorAll("#cmode button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    buildTerr(); render();
  });
  document.getElementById("zin").addEventListener("click", () => setView(view.cx, view.cy, view.k * 1.6, true));
  document.getElementById("zout").addEventListener("click", () => setView(view.cx, view.cy, view.k / 1.6, true));
  document.getElementById("zreset").addEventListener("click", () => { selected = null; buildTerr(); fitTo(activeFit, true); markRows(); });
  document.getElementById("q").addEventListener("input", e => { query = fold(e.target.value.trim()); render(); buildIndex(); buildTable(); buildChron(); });
  function setMode(m) {
    document.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", x.dataset.mode === m ? "true" : "false"));
    stage.dataset.view = m;
    document.querySelectorAll(".maponly").forEach(x => x.hidden = (m !== "map"));
    document.getElementById("timebar").hidden = m !== "map";
    if (m === "map") requestAnimationFrame(() => { const keep = { ...view }; resize(); if (keep.k !== 1) { Object.assign(view, keep); render(); } });
  }
  document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
    if (e.key === "ArrowRight" && si < SNAPS.length - 1) { stopPlay(); setSnap(si + 1); }
    if (e.key === "ArrowLeft" && si > 0) { stopPlay(); setSnap(si - 1); }
    if (e.key === "Escape") { selected = null; buildTerr(); render(); markRows(); tip.dataset.on = "0"; }
  });

  /* ---------------- 界面文字（中 / 英） ---------------- */
  const FOOT_ZH = document.getElementById("legfoot").textContent;
  const FOOT_EN = "Borders are reconstructed from the Old and New Tang Histories, the Zizhi tongjian and the New History of the Five Dynasties, following in outline vol. 5 of Tan Qixiang’s Historical Atlas of China. Territory is assigned prefecture by prefecture and bounded along mountains and rivers, so it is only indicative. Battles and events are shown only for the years covered by the current snapshot (after the previous snapshot, up to this one). The red dashed line marks the Sixteen Prefectures (from 938). Click any territory, city, battle, mountain or river for notes.";
  const FIT_EN = { cn: "China", all: "Whole map", zy: "Central Plains", gz: "Guanzhong & Hexi-Longyou", hb: "Hebei & Hedong", jh: "Huai & Jiangnan",
    bs: "Sichuan & Qianzhong", ln: "Lingnan & Annan", xy: "Western Regions", db: "Manchuria & Korea", nz: "Tibet & Nanzhao" };
  const FIT_ZH = Object.fromEntries([...document.querySelectorAll("#fit option")].map(o => [o.value, o.textContent]));
  function applyStatic() {
    const $ = id => document.getElementById(id);
    const txt = (id, zh, en) => { $(id).textContent = LZ(zh, en); };
    const at = (node, a, zh, en) => node.setAttribute(a, LZ(zh, en));
    document.documentElement.lang = LZ("zh-CN", "en");
    document.title = LZ("唐宋之际形势图", "Between Tang and Song, 755–979");
    txt("h1", "唐宋之际形势图", "Between Tang and Song");
    txt("h1src", "755 — 979 · 安史之乱至宋初 · 古今地名对照", "755–979 · from the An Lushan Rebellion to the early Song · historical and modern place names");
    at($("fit"), "aria-label", "视野", "View"); at($("fit").parentNode, "title", "视野", "View");
    for (const o of $("fit").options) o.textContent = LZ(FIT_ZH[o.value], FIT_EN[o.value]);
    at($("cmode"), "aria-label", "着色方式", "Coloring");
    const cz = document.querySelector('[data-cm="zhen"]'), cp = document.querySelector('[data-cm="pol"]');
    cz.textContent = LZ("藩镇", "Fanzhen"); at(cz, "title", "唐朝内部按藩镇分色", "Color the Tang by fanzhen (military circuits)");
    cp.textContent = LZ("政权", "States"); at(cp, "title", "按政权分色", "Color by state");
    at($("q"), "placeholder", "检索古名或今名", "Search old or modern names"); at($("q"), "aria-label", "检索古名或今名", "Search historical or modern names");
    at(document.querySelector('[data-mode]').parentNode, "aria-label", "显示方式", "View mode");
    const MODES = { map: ["地图", "Map"], chron: ["年表", "Timeline"], table: ["对照表", "Gazetteer"] };
    document.querySelectorAll("[data-mode]").forEach(b => { b.textContent = pick(MODES[b.dataset.mode]); });
    at($("play"), "aria-label", "播放时间轴", "Play timeline"); $("play").title = playT ? LZ("暂停", "Pause") : LZ("播放", "Play");
    at($("map"), "aria-label", "唐宋之际形势图", "Map of China between the Tang and the Song");
    for (const [id, zh, en] of [["zin", "放大", "Zoom in"], ["zout", "缩小", "Zoom out"], ["zreset", "复位", "Reset view"]]) { at($(id), "title", zh, en); at($(id), "aria-label", zh, en); }
    txt("zreset", "复位", "Reset");
    txt("legtitle", "图例", "Legend"); txt("legsub", "本时期政权", "States in this period");
    txt("key1", "政权疆界", "State border"); txt("key2", "割据藩镇", "Autonomous fanzhen");
    $("legfoot").textContent = LZ(FOOT_ZH, FOOT_EN);
    at($("inset"), "aria-label", "索引图", "Overview map"); txt("insetcap", "索引", "Overview");
    document.querySelectorAll("#langsw button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === LANG ? "true" : "false"));
  }
  function applyLang() { applyStatic(); readFonts(); labelTicks(); labelLayers(); setLeg(!legBody.hidden); }
  function setLang(l) {
    if (l === LANG) return;
    LANG = l;
    try { localStorage.setItem("tangsong-map:lang", l); } catch (e) {}
    try { history.replaceState(null, "", location.pathname + location.search + (l === "en" ? "#en" : "")); } catch (e) {}
    applyLang();
    tip.dataset.on = "0";
    setSnap(si, false);
    buildTerr(); render(); buildIndex(); buildTable(); buildChron();
  }
  document.getElementById("langsw").addEventListener("click", e => { const b = e.target.closest("[data-lang]"); if (b) setLang(b.dataset.lang); });
  addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h === "en" || h === "zh") setLang(h); });

  /* ---------------- 启动 ---------------- */
  applyLang();
  setSnap(Math.max(0, SNAPS.findIndex(s => s.y === GEO.first)), false);
  buildTerr();
  buildIndex(); buildTable(); buildChron();
  resize();
})();
</script>
