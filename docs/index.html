  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--ground-deep); color:var(--ink); font-family:var(--f-body); font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased; }
  button, input, select { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:2px; }

  .app { height:100%; display:grid; grid-template-rows:auto auto minmax(0,1fr); }

  /* 顶栏 */
  .masthead { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; padding-block:11px 10px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); background:var(--paper); border-bottom:1px solid var(--rule); }
  .brand { display:flex; align-items:baseline; gap:12px; }
  .brand h1 { margin:0; font-family:var(--f-display); font-weight:600; font-size:20px; letter-spacing:.14em; text-wrap:balance; }
  .brand .src { font-size:11px; letter-spacing:.18em; color:var(--ink-3); border-left:1px solid var(--rule); padding-left:12px; }
  .masthead .count { font-family:var(--f-mono); font-size:11px; color:var(--ink-3); letter-spacing:.04em; }
  .tools { margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .seg { display:flex; border:1px solid var(--rule); border-radius:3px; overflow:hidden; }
  .seg button { background:transparent; border:0; padding:5px 10px; cursor:pointer; font-size:12px; letter-spacing:.06em; color:var(--ink-2); border-right:1px solid var(--rule-soft); white-space:nowrap; }
  .seg button:last-child { border-right:0; }
  .seg button:hover { background:var(--paper-2); color:var(--ink); }
  .seg button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
  .maponly[hidden] { display:none; }
  .sel { position:relative; display:flex; align-items:center; }
  .sel select { appearance:none; -webkit-appearance:none; border:1px solid var(--rule); border-radius:3px; background:var(--ground); padding:5px 24px 5px 9px; font-size:12px; letter-spacing:.06em; color:var(--ink); cursor:pointer; }
  .sel::after { content:""; position:absolute; right:9px; top:50%; width:5px; height:5px; border-right:1.3px solid var(--ink-2); border-bottom:1.3px solid var(--ink-2); transform:translateY(-70%) rotate(45deg); pointer-events:none; }
  .search { position:relative; }
  .search input { width:170px; padding:5px 10px 5px 26px; border:1px solid var(--rule); border-radius:3px; background:var(--ground); font-size:12.5px; }
  .search input::placeholder { color:var(--ink-3); }
  .search svg { position:absolute; left:8px; top:50%; transform:translateY(-50%); opacity:.5; }

  /* 时间轴 */
  .timebar { display:grid; grid-template-columns:auto minmax(0,1fr); align-items:stretch; background:var(--paper); border-bottom:1px solid var(--rule); }
  .timebar[hidden] { display:none; }
  .play { width:44px; border:0; border-right:1px solid var(--rule-soft); background:none; cursor:pointer; color:var(--ink-2); display:grid; place-items:center; }
  .play:hover { background:var(--paper-2); color:var(--ink); }
  .tb-main { min-width:0; display:grid; grid-template-rows:auto auto; }
  .ticks { display:flex; overflow-x:auto; scrollbar-width:thin; padding:6px 10px 0; position:relative; }
  .ticks::before { content:""; position:absolute; left:10px; right:10px; top:26px; height:1px; background:var(--rule); }
  .tick { flex:1 0 62px; background:none; border:0; cursor:pointer; padding:0 2px 5px; display:flex; flex-direction:column; align-items:center; gap:2px; position:relative; color:var(--ink-3); }
  .tick .dot { width:9px; height:9px; border-radius:50%; background:var(--paper); border:1.5px solid var(--ink-3); z-index:1; }
  .tick .yr { font-family:var(--f-mono); font-size:10.5px; line-height:14px; letter-spacing:.02em; }
  .tick .tt { font-size:10.5px; white-space:nowrap; letter-spacing:.03em; }
  .tick:hover { color:var(--ink); }
  .tick[aria-pressed="true"] { color:var(--ink); }
  .tick[aria-pressed="true"] .dot { background:var(--ink); border-color:var(--ink); transform:scale(1.25); }
  .tick[aria-pressed="true"] .tt { font-weight:600; }
  .tick.era5 .dot { border-style:dashed; }
  .caption { padding:3px 16px 8px; font-size:12.5px; color:var(--ink-2); line-height:1.6; border-top:1px solid var(--rule-soft); max-height:7.6em; overflow-y:auto; }
  .caption b { font-family:var(--f-display); font-size:14px; color:var(--ink); letter-spacing:.08em; margin-right:8px; }
  .caption .pbs { display:flex; flex-wrap:wrap; align-items:center; gap:3px 6px; margin-top:3px; }
  .caption .pl { font-size:11px; color:var(--ink-3); letter-spacing:.06em; margin-right:2px; }
  .caption .pl .mono { margin:0; }
  .caption .chip { border:1px solid color-mix(in srgb, var(--c-battle) 38%, transparent); background:color-mix(in srgb, var(--c-battle) 7%, transparent); color:var(--ink); font-family:var(--f-display); font-size:12px; line-height:1.55; padding:0 7px; border-radius:2px; cursor:pointer; white-space:nowrap; }
  .caption .chip:hover, .caption .chip[aria-pressed="true"] { background:color-mix(in srgb, var(--c-battle) 18%, transparent); }
  .caption .chip i { font-style:normal; font-family:var(--f-mono); font-size:10px; color:var(--ink-3); margin-left:4px; }
  .caption .none { font-size:11.5px; color:var(--ink-3); }
  .caption .pl.gap { margin-left:10px; }
  .caption .chip.rg { border-color:color-mix(in srgb, var(--c-yanyun) 55%, transparent); background:color-mix(in srgb, var(--c-yanyun) 9%, transparent); font-weight:600; }
  .caption .chip.rg:hover, .caption .chip.rg[aria-pressed="true"] { background:color-mix(in srgb, var(--c-yanyun) 20%, transparent); }
  .caption .y { font-family:var(--f-mono); font-size:11px; color:var(--ink-3); margin-right:8px; }

  /* 主区 */
  .stage { display:grid; grid-template-columns:minmax(0,1fr) 352px; min-height:0; }
  .stage[data-view="table"], .stage[data-view="chron"] { grid-template-columns:minmax(0,1fr); }
  .stage[data-view="table"] .mapwrap, .stage[data-view="table"] .index,
  .stage[data-view="chron"] .mapwrap, .stage[data-view="chron"] .index { display:none; }

or at Bianzhou in 784 with the dynastic name Great Chu. In 783 the Jingyuan troops mutinied and set up Zhu Ci, who held Chang'an and proclaimed himself emperor (as Qin, later renamed Han), and Dezong fled to Fengtian; in 784 Li Huaiguang of Shuofang also rebelled and held Hezhong, and Dezong fled again to Liangzhou, which he raised to Xingyuan Fu. In the same year he issued an edict of self-reproach; Wang Wujun, Tian Yue and Li Na gave up their royal titles and submitted, and Li Sheng recovered Chang'an. Tibet had taken all of Hexi except the isolated city of Shazhou.","labe":{"4":"Uyghurs","86":"Lingnan (Guang Command)","38":"Zhu Ci (Qin · Han)","39":"Li Huaiguang (holding Hezhong)","40":"Li Xilie (Great Chu)"}},{"y":805,"era":"永贞元年","t":"吐蕃极盛·藩镇林立","d":"贞元年间吐蕃攻陷沙州（786）、北庭（790）、西州（792），安西四镇相继失陷，唐失西域；回鹘与吐蕃反复争夺天山北路。794 年南诏异牟寻在点苍山与唐会盟，归唐抗蕃，西川节度使韦皋大破吐蕃。内地则河朔三镇、淄青李师古（十二州）、淮西吴少诚擅立，朝廷姑息。805 年顺宗即位行“永贞革新”，旋即失败。","z":{"2":[[10096,4615,-24,2,-71,-19,-45,-48,-38,-32,-1,-8,14,-24,0,-40,-14,-64,-2,-152,-20,-40,-4,-40,-11,-13,-32,-13,-32,-20,-40,-11,-144,36,-24,1,-24,-6,-48,-32,-24,-9,-104,-2,-56,-15,-216,2,-8,10,5,72,11,19,16,8,88,3,72,24,64,32,28,26,10,16,10,40,-2,8,-14,10,-24,8,-40,5,-64,-4,-16,-4,-40,5,-48,-8,-176,0,-40,8,-144,0,-16,-2,-46,-18,-6,-16,0,-56,12,-50,20,-30,20,-20,8,-5,48,-14,40,-27,8,-14,-5,-8,-99,-104,-34,-24,-22,-27,-40,-29,-16,-20,-16,-12,-8,0,-24,18,-40,20,-56,40,-24,8,-16,-5,-22,-41,-76,-104,-46,-93,-4,-19,-1,-88,-11,-11,-48,-1,-16,6,-5,46,-10,40,-7,16,-18,20,-40,28,-72,108,-50,36,-15,16,0,16,7,8,74,53,17,27,-8,80,-42,80,-4,40,-11,20,-64,-1,-168,-33,-42,-18,-38,-47,-8,-4,-48,0,-56,18,-96,-12,-24,-6,-32,-2,-40,-8,-11,-11,-4,-40,-33,-38,-19,-34,21,-56,4,-32,13,-40,5,-40,-8,-9,-56,-17,-160,-37,-40,-20,-2,-5,0,-240,2,-5,32,-13,72,-21,72,19,64,-1,24,-9,48,-30,32,-32,86,-68,58,-42,40,-20,32,-23,80,-95,112,-110,48,-23,104,-30,24,-10,40,-4,24,-6,56,-4,30,-25,82,-58,48,-23,40,-10,40,-2,48,-9,168,-68,56,-2,40,8,176,0,40,8,72,-1,11,-11,5,-26,30,-30,34,-11,40,-1,32,10,  prefectures of Qinzhou, Yuanzhou and Anle Zhou and the Seven Passes in 849; in 848 Zhang Yichao of Shazhou rose and drove out the Tibetans, and in 851 he sent envoys to present the maps and household registers of eleven prefectures to the court. The Tang set up the Guiyi Jun with Zhang Yichao as military governor. In the Huichang era Liu Zhen of Zelu was put down (844), while the three Hebei fanzhen remained hereditary and independent.","labe":{"86":"Lingnan (Guang Command)","129":"Pinglu","130":"Yanhai"}},{"y":881,"era":"中和元年","t":"黄巢入长安","d":"乾符元年至二年（874–875）王仙芝、黄巢先后起事，黄巢转战江淮、岭南，879 年攻破广州，880 年十二月攻入长安，即位称帝，国号大齐。僖宗出奔成都。徐州时溥、蔡州秦宗权等乘乱自立；沙陀李克用父子于 880 年为唐军所败，北走鞑靼。归义军张议潮收复凉州（861）；西州回鹘仆固俊据高昌、北庭（866）。南诏屡寇安南（862–866）、西川（869–870），国力亦衰。","z":{"3":[[8928,4095,-8,-1,-12,-8,-100,-104,-34,-24,-22,-27,-40,-29,-16,-20,-16,-12,-8,0,-24,18,-40,20,-56,40,-24,8,-16,-5,-22,-41,-76,-104,-46,-93,-4,-19,-1,-88,-11,-11,-112,-1,-40,-8,-192,0,-32,7,-104,1,-32,7,-48,2,-32,10,-48,23,-30,26,-26,16,-40,-4,-104,0,-15,4,-10,16,-6,24,-7,16,-38,40,-20,30,-8,2,-168,-39,-40,-20,-4,-21,2,-224,2,-5,32,-13,72,-21,72,19,64,-1,24,-9,48,-30,32,-32,86,-68,58,-42,40,-20,32,-23,80,-95,112,-110,48,-23,104,-30,24,-10,40,-4,24,-6,56,-4,30,-25,82,-58,48,-23,40,-10,40,-2,48,-9,144,-60,32,-9,56,0,32,7,176,0,40,8,72,-1,11,-11,5,-26,30,-30,34,-11,40,-1,19,4,53,28,17,20,4,32,11,11,40,3,72,24,32,-15,40,-10,40,-8,40,0,64,21,32,3,32,9,50,34,38,34,104,37,70,57,34,22,30,50,27,32,0,24,-36,72,2,16,9,9,48,18,152,1,24,-2,64,-21,48,2,9,9,10,24,-5,16,-28,48,-2,8,4,8,22,8,38,33,32,11,16,12,9,16,1,8,-4,8,-22,14,-35,42,-5,8,2,8,54,76,120,1,9,3,4,8,4,48,-17,20,-27,20,-21,32,-19,16,-21,43,-8,8,-16,-2,-40,-26,-48,-25,-64,-25,-128,49,-56,28,-88,32,-136,40,-96,17,-24,2,-48,14,-80,10,-176,38,-24,0,-48,-14,-88,-10,-24,-6,-56,-2,-32,-7,-48,1,-17,11,-14,56,-34,56,-8,40,-15,10,-72,24,-64,3,-16,4],[9079,3582,17,-5,40,-1,5,-2,4,-8,-49,-2,-37,10,-4,8,24,0]],"5":[[9528,5497,-576,1,-28,-4,3,-64,26,-32,21,-48,-4,-16,-11,-16,-3,-16,15,-80,2,-40,9,- ao enters Chang'an","de":"In Qianfu 1–2 (874–875) Wang Xianzhi and then Huang Chao rose; Huang Chao fought his way through the Jiang–Huai region and Lingnan, took Guangzhou in 879, entered Chang'an in the 12th month of 880, and took the throne as emperor with the dynastic name Great Qi. Emperor Xizong fled to Chengdu. Shi Pu of Xuzhou, Qin Zongquan of Caizhou and others set themselves up amid the chaos; Li Keyong and his father of the Shatuo were defeated by a Tang army in 880 and fled north to the Tatars. Zhang Yichao of the Guiyi Jun recovered Liangzhou (861), and Pugu Jun of the Xizhou Uyghurs took Qocho and Beiting (866). Nanzhao repeatedly raided Annan (862–866) and Xichuan (869–870), and its own strength declined too.","labe":{"86":"Lingnan (Guang Command)","129":"Pinglu","130":"Yanhai","41":"Huang Chao (Great Qi)","132":"Fengguo (Qin Zongquan)","121":"Wuning (Shi Pu)"}},{"y":895,"era":"乾宁二年","t":"藩镇混战","d":"黄巢败死（884）后，唐朝号令不出关中。朱全忠据汴州，并吞河南；李克用据河东、昭义，与之世仇；李茂贞据凤翔、山南西道，与邠宁王行瑜、华州韩建合兵挟制朝廷；王建取西川，杨行密据淮南、宣歙，钱镠据杭州，董昌在越州称帝（大越罗平国），王潮据福建，马殷、刘建锋取湖南。魏博、成德与幽州刘仁恭依违于朱、李之间。","z":{"3":[[8928,4095,-8,-1,-12,-8,-100,-104,-34,-24,-22,-27,-40,-29,-16,-20,-16,-12,-8,0,-24,18,-40,20,-56,40,-24,8,-16,-5,-22,-41,-76,-104,-46,-93,-4,-19,-1,-88,-11,-11,-112,-1,-40,-8,-192,0,-32,7,-104,1,-32,7,-48,2,-32,10,-48,23,-30,26,-26,16,-40,-4,-104,0,-15,4,-10,16,-6,24,-7,16,-38,40,-20,30,-8,2,-168,-39,-40,-20,-4,-21,2,-224,2,-5,32,-13,72,-21,72,19,64,-1,24,-9,48,-30,32,-32,86,-68,58,-42,40,-20,32,-23,80,-95,112,-110,48,-23,104,-30,24,-10,40,-4,24,-6,56,-4,30,-25,82,-58,48,-23,40,-10,40,-2,48,-9,144,-60,32,-9,56,0,32,7,176,0,40,8,72,-1,11,-11,5,-26,30,-30,34,-11,40,-1,19,4,53,28,17,20,4,32,11,11,40,3,72,24,32,-15,40,-10,40,-8,40,0,64,21,32,3,32,9,50,34,38,34,104,37,70,57,34,22,30,50,27,32,0,24,-36,72,2,16,9,9,48,18,152,1,24,-2,64,-21,48,2,9,9,10,24,-5,16,-28,48,-2,8,4,8,22,8,38,33,32,11,16,12,9,16,1,8,-4,8,-22,14,-35,42,-5,8,2,8,54,76,120,1,9,3,4,8,4,48,-17,20,-27,20,-21,32,-19,16,-21,43,-8,8,-16,-2 de":"In 936 Shi Jingtang, military governor of Hedong, colluded with the Khitans and borrowed their troops to destroy Later Tang, calling himself their \"son emperor\"; he ceded the Sixteen Prefectures of Yan and Yun to the Khitans (formally handed over in 938) and paid 300,000 bolts of silk a year. From then on the Central Plains lost the barrier of the Great Wall in the north. In the same period Meng Zhixiang proclaimed himself emperor in 934 and founded Later Shu, Xu Zhigao (Li Bian) replaced Wu with Southern Tang in 937, Duan Siping of the Dali Kingdom destroyed Dayining (937), Wang Geon of Goryeo united the Korean peninsula (936), and in Giao Châu Ngô Quyền crushed Southern Han at the Bạch Đằng River in 938; Vietnam moved toward independence.","labe":{"36":"Dingnan (Li Yiyin)","60":"Jingnan (Gao Jichang)","114":"Jinghai (Ngô Quyền)"}},{"y":947,"era":"天福十二年","t":"契丹灭晋","d":"后晋出帝石重贵对契丹称孙不称臣，引发战争；946 年杜重威在中渡桥率十万大军降契丹，947 年正月耶律德光入开封，后晋亡，二月改国号大辽。辽军四出“打草谷”，中原各地反抗，三月德光北返，四月死于途中。河东节度使刘知远二月在太原称帝（后汉），六月入开封。南方：南唐 945 年灭闽，福州李仁达投吴越，秦、成、阶三州降后蜀。","z":{"3":[[8928,4095,-8,-1,-12,-8,-100,-104,-34,-24,-22,-27,-40,-29,-16,-20,-16,-12,-8,0,-24,18,-40,20,-56,40,-24,8,-16,-5,-22,-41,-76,-104,-46,-93,-4,-19,-1,-88,-11,-11,-112,-1,-40,-8,-192,0,-32,7,-104,1,-32,7,-48,2,-32,10,-48,23,-30,26,-26,16,-40,-4,-104,0,-15,4,-10,16,-6,24,-7,16,-38,40,-20,30,-8,2,-168,-39,-40,-20,-4,-21,2,-224,2,-5,32,-13,72,-21,72,19,64,-1,24,-9,48,-30,32,-32,86,-68,58,-42,40,-20,32,-23,80,-95,112,-110,48,-23,104,-30,24,-10,40,-4,24,-6,56,-4,30,-25,82,-58,48,-23,40,-10,40,-2,48,-9,144,-60,32,-9,56,0,32,7,176,0,40,8,72,-1,11,-11,5,-26,30,-30,34,-11,40,-1,19,4,53,28,17,20,4,32,11,11,40,3,72,24,32,-15,40,-10,40,-8,40,0,64,21,32,3,32,9,50,34,38,34,104,37,70,57,34,22,30,50,27,32,0,24,-36,72,2,16,9,9,48,18,152,1,24,-2,64,-21,48,2,9,9,10,24,-5,16,-28,48,-2,8,4,8,22,8,38,33,32,11,16,12,9,16,1,8,-4,8,-22,14,-35,42,-5,8,2,8,54,76,120,1,9,3,4,8,4,48,-17,20,-27,20,-21,32,-19,16,-21,43,-8,8,-16,-2,-40,-26,-48,-25,-64,-25,-1 The Later Jin emperor Shi Chonggui (Emperor Chu) called himself the Khitans' grandson but not their subject, which led to war; in 946 Du Chongwei surrendered to the Khitans with an army of 100,000 at the Zhongdu Bridge, and in the 1st month of 947 Yelü Deguang entered Kaifeng and Later Jin fell; in the 2nd month he changed the dynastic name to Great Liao. Liao troops went out in all directions plundering for supplies (\"gathering grass and grain\"), resistance broke out across the Central Plains, and in the 3rd month Yelü Deguang went back north; he died on the way in the 4th month. Liu Zhiyuan, military governor of Hedong, proclaimed himself emperor at Taiyuan in the 2nd month (Later Han) and entered Kaifeng in the 6th month. In the south, Southern Tang destroyed Min in 945, Li Renda of Fuzhou went over to Wuyue, and the three prefectures of Qinzhou, Chengzhou and Jiezhou surrendered to Later Shu.","labe":{"36":"Dingnan (Li Yiyin)","60":"Jingnan (Gao Jichang)","114":"Ngô (usurped by Dương Tam Kha)","13":"Liao"}},{"y":951,"era":"广顺元年","t":"后周建立·南唐灭楚","d":"950 年后汉隐帝谋杀重臣，郭威自邺都起兵入开封，951 年正月称帝建后周；刘知远之弟刘崇在太原称帝（北汉），依附辽。南方楚国马氏兄弟内讧，951 年南唐乘机灭楚，南汉夺取楚的岭南诸州与郴、连；泉州留从效据泉、漳二州（清源军）。后蜀已得秦、凤、成、阶四州。","z":{"3":[[8928,4095,-8,-1,-12,-8,-100,-104,-34,-24,-22,-27,-40,-29,-16,-20,-16,-12,-8,0,-24,18,-40,20,-56,40,-24,8,-16,-5,-22,-41,-76,-104,-46,-93,-4,-19,-1,-88,-11,-11,-112,-1,-40,-8,-192,0,-32,7,-104,1,-32,7,-48,2,-32,10,-48,23,-30,26,-26,16,-40,-4,-104,0,-15,4,-10,16,-6,24,-7,16,-38,40,-20,30,-8,2,-168,-39,-40,-20,-4,-21,2,-224,2,-5,32,-13,72,-21,72,19,64,-1,24,-9,48,-30,32,-32,86,-68,58,-42,40,-20,32,-23,80,-95,112,-110,48,-23,104,-30,24,-10,40,-4,24,-6,56,-4,30,-25,82,-58,48,-23,40,-10,40,-2,48,-9,144,-60,32,-9,56,0,32,7,176,0,40,8,72,-1,11,-11,5,-26,30,-30,34,-11,40,-1,19,4,53,28,17,20,4,32,11,11,40,3,72,24,32,-15,40,-10,40,-8,40,0,64,21,32,3,32,9,50,34,38,34,104,37,70,57,34,22,30,50,27,32,0,24,-36,72,2,16,9,9,48,18,152,1,24,-2,64,-21,48,2,9,9,10,24,-5,16,-28,48,-2,8,4,8,22,8,38,3
