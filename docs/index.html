ll is 16 km around."}},{"c":"capital","old":"东京龙原府","mod":"吉林珲春八连城","lon":130.33,"lat":42.9,"st":11,"yrs":[[785,794]],"note":"渤海一度迁都东京（785–794）。","at":408,"i":209,"e":{"old":"Longyuan Fu (Eastern Capital)","mod":"Baliancheng, Hunchun, Jilin","note":"Balhae moved its capital to the Eastern Capital for a time (785–794)."}},{"c":"capital","old":"中京显德府","mod":"吉林和龙西古城","lon":129.02,"lat":42.78,"st":11,"yrs":[[742,756]],"note":"渤海前期都城。","at":407,"i":210,"e":{"old":"Xiande Fu (Central Capital)","mod":"Xigucheng, Helong, Jilin","note":"Balhae's capital in its early period."}},{"c":"capital","old":"忽汗城（天福城）","mod":"黑龙江宁安","lon":129.23,"lat":43.9,"st":12,"yrs":[[926,928]],"note":"契丹灭渤海后改忽汗城为天福城，作为东丹国都。","at":406,"i":211,"e":{"old":"Huhan City (Tianfu City)","mod":"Ning'an, Heilongjiang","note":"After destroying Balhae, the Khitans renamed Huhan City Tianfu City and made it the capital of Dongdan."}},{"c":"capital","old":"东平（辽阳）","mod":"辽宁辽阳","lon":123.17,"lat":41.27,"st":12,"yrs":[[928,938]],"note":"928 年东丹南迁辽东，以东平为南京。","at":404,"i":212,"e":{"old":"Dongping (Liaoyang)","mod":"Liaoyang, Liaoning","note":"In 928 Dongdan moved south to Liaodong and made Dongping its Southern Capital."}},{"c":"capital","old":"潢水牙帐 · 上京","mod":"内蒙古巴林左旗","lon":119.39,"lat":43.97,"st":13,"yrs":[[700,9999]],"note":"契丹牙帐所在；918 年阿保机建皇都，938 年改称上京临潢府。","at":398,"i":213,"e":{"old":"Huang River camp · Supreme Capital","mod":"Bairin Left Banner, Inner Mongolia","note":"Site of the Khitan khagan's camp. In 918 Yelü Abaoji built Huangdu, which was renamed the Supreme Capital, Linhuang Fu, in 938."}},{"c":"capital","old":"奚王牙帐","mod":"内蒙古宁城","lon":119.18,"lat":41.6,"st":14,"yrs":[[700,911]],"note":"奚王牙帐，辽中京大定府后建于此。","at":400,"i":214,"e":{"old":"Xi king's camp","mod":"Ningcheng, Inner Mongolia","note":"The Xi king's camp; the Liao Central Capital, Dading Fu, was later built here."}},{"c":"capital","old":"金城","mod":"韩国庆州","lon":129.22,"lat":35.83,"st":19,"yrs":[[668,935]],"note":"新罗王都，佛国寺、石窟庵建于 8 世纪中叶。","at":432,"i":215,"e":{"old":"Geumseong","mod":"Gyeongju, South Korea","note":"Royal capital of Silla; the Bulguksa temple and the Seokguram grotto were built in the mid-8th century."}},{"c":"capital","old":"完山州","mod":"韩国全州","lon":127.15,"lat":35.82,"st":20,"yrs":[[900,936]],"note":"甄萱后百济都城。","at":427,"i":216,"e":{"old":"Wansanju","mod":"Jeonju, South Korea","note":"Capital of Gyeon Hwon's Later Baekje."}},{"c":"capital","old":"铁圆","mod":"韩国铁原","lon":127.3,"lat":38.25,"st":21,"yrs":[[905,918]],"note":"弓裔泰封都城。","at":422,"i":217,"e":{"old":"Cheorwon","mod":"Cheorwon, South Korea","note":"Capital of Gung Ye's Taebong."}},{"c":"capital","old":"开京（松岳）","mod":"朝鲜开城","lon":126.55,"lat":37.97,"st":22,"yrs":[[919,9999]],"note":"高丽都城。","at":421,"i":218,"e":{"old":"Gaegyeong (Songak)","mod":"Kaesong, North Korea","note":"Capital of Goryeo."}},{"c":"capital","old":"平安京","mod":"日本京都","lon":135.76,"lat":35.01,"st":23,"yrs":[[794,9999]],"note":"桓武天皇 794 年迁都，仿唐长安城规划。","at":435,"i":219,"e":{"old":"Heian-kyō","mod":"Kyoto, Japan","note":"Emperor Kanmu moved the capital here in 794, laying it out on the model of Tang Chang'an."}},{"c":"capital","old":"高昌","mod":"新疆吐鲁番","lon":89.53,"lat":42.85,"st":31,"yrs":[[866,9999]],"note":"高昌回鹘冬都，夏居北庭。","at":218,"i":220,"e":{"old":"Qocho","mod":"Turpan, Xinjiang","note":"Winter capital of the Qocho Uyghurs, who spent the summer at Beiting."}},{"c":"capital","old":"甘州","mod":"甘肃张掖","lon":100.45,"lat":38.93,"st":32,"yrs":[[894,9999]],"note":"甘州回鹘牙帐。","at":212,"i":221,"e":{"old":"Ganzhou","mod":"Zhangye, Gansu","note":"Camp of the Ganzhou Uyghur khagan."}},{"c":"capital","old":"于阗","mod":"新疆和田","lon":79.92,"lat":37.08,"st":29,"yrs":[[851,9999]],"note":"于阗都城西城。","at":224,"i":222,"e":{"old":"Khotan","mod":"Hotan, Xinjiang","note":"The Western City, the capital of Khotan."}},{"c":"capital","old":"八剌沙衮","mod":"吉尔吉斯斯坦托克马克","lon":75.2,"lat":42.8,"st":33,"yrs":[[940,9999]],"note":"喀喇汗大汗驻地，与副汗所驻的喀什噶尔并为两都。","at":226,"i":223,"e":{"old":"Balasagun","mod":"Tokmok, Kyrgyzstan","note":"Seat of the Kara-Khanid great khagan; with Kashgar, the seat of the junior khagan, it was one of the khanate's two capitals."}},{"c":"capital","old":"沙州","mod":"甘肃敦煌","lon":94.67,"lat":40.12,"st":34,"yrs":[[848,9999]],"note":"归义军节度使治所。","at":215,"i":224,"e":{"old":"Shazhou","mod":"Dunhuang, Gansu","note":"Seat of the military governor of Guiyi Jun."}},{"c":"capital","old":"夏州","mod":"陕西靖边统万城","lon":108.85,"lat":37.99,"st":36,"yrs":[[883,9999]],"note":"定难军治所，十六国大夏统万城旧址。","at":20,"i":225,"e":{"old":"Xiazhou","mod":"Tongwan City, Jingbian, Shaanxi","note":"Seat of Dingnan Jun, on the site of Tongwan City of the Great Xia of the Sixteen Kingdoms."}},{"c":"capital","old":"古螺","mod":"越南河内东英","lon":105.87,"lat":21.13,"st":114,"yrs":[[939,965]],"note":"吴权 939 年称王，都古螺。","at":null,"i":226,"e":{"old":"Cổ Loa","mod":"Đông Anh, Hanoi, Vietnam","note":"Ngô Quyền proclaimed himself king in 939, with his capital at Cổ Loa."}},{"c":"capital","old":"华闾","mod":"越南宁平","lon":105.9,"lat":20.28,"st":114,"yrs":[[968,9999]],"note":"丁部领大瞿越国都城。","at":328,"i":227,"e":{"old":"Hoa Lư","mod":"Ninh Bình, Vietnam","note":"Capital of Đinh Bộ Lĩnh's Đại Cồ Việt."}},{"c":"capital","old":"因陀罗补罗","mod":"越南岘港东阳（原广南省）","lon":108.38,"lat":15.67,"st":27,"yrs":[[875,9999]],"note":"占城都城。","at":278,"i":228,"e":{"old":"Indrapura","mod":"Đồng Dương, Da Nang (formerly Quảng Nam province), Vietnam","note":"Capital of Champa."}},{"c":"capital","old":"蒲甘","mod":"缅甸蒲甘","lon":94.86,"lat":21.17,"st":25,"yrs":[[849,9999]],"note":"蒲甘王朝都城。","at":274,"i":229,"e":{"old":"Pagan","mod":"Bagan, Myanmar","note":"Capital of the Pagan Kingdom."}},{"c":"capital","old":"室利差呾罗","mod":"缅甸卑谬","lon":95.3,"lat":18.8,"st":24,"yrs":[[600,832]],"note":"骠国都城。","at":273,"i":230,"e":{"old":"Sri Ksetra","mod":"Pyay (Prome), Myanmar","note":"Capital of the Pyu."}},{"c":"battle","old":"常山之战","mod":"河北正定","lon":114.62,"lat":38.1,"y":756,"yt":"756 年正月","sides":"燕 胜 唐","cmd":"史思明 vs 颜杲卿","note":"常山太守颜杲卿与从弟平原太守颜真卿起兵，河北十七郡响应，切断安禄山归路；史思明回师攻破常山，颜杲卿被押至洛阳，骂贼而死（文天祥《正气歌》“为颜常山舌”）。","i":231,"e":{"old":"Battle of Changshan","mod":"Zhengding, Hebei","note":"Yan Gaoqing, governor of Changshan Commandery, rose with his younger cousin Yan Zhenqing, governor of Pingyuan; seventeen commanderies of Hebei answered them, cutting An Lushan's line of retreat. Shi Siming turned back and took Changshan; Yan Gaoqing was taken to Luoyang and died cursing the rebels (Wen Tianxiang's \"Song of the Righteous Spirit\": \"the tongue of Yan of Changshan\").","yt":"1st month, 756","sides":"Yan defeated Tang","cmd":"Shi Siming vs. Yan Gaoqing"}},{"c":"battle","old":"潼关之战","mod":"陕西潼关","lon":110.3,"lat":34.55,"y":756,"yt":"756 年六月","sides":"燕 胜 唐","cmd":"崔乾祐 vs 哥舒翰","note":"玄宗与杨国忠逼哥舒翰出关决战，二十万唐军在灵宝西原中伏溃败，哥舒翰被部下劫持降燕，潼关失守。玄宗弃长安出奔，途中发生马嵬驿之变。","i":232,"e":{"old":"Battle of Tong Pass","mod":"Tongguan, Shaanxi","note":"Emperor Xuanzong and Yang Guozhong pressed Geshu Han to leave the pass and fight a decisive battle; 200,000 Tang troops were ambushed and routed on the Xiyuan plain at Lingbao, Geshu Han was seized by his own officers and handed over to Yan, and Tong Pass fell. Xuanzong abandoned Chang'an and fled, and on the way came the Mawei Station incident.","yt":"6th month, 756","sides":"Yan defeated Tang","cmd":"Cui Qianyou vs. Geshu Han"}},{"c":"battle","old":"睢阳之战","mod":"河南商丘","lon":115.62,"lat":34.38,"y":757,"yt":"757 年正—十月","sides":"燕 胜 唐（城破）","cmd":"尹子奇 vs 张巡、许远","note":"张巡先守雍丘，后与许远以不足万人死守睢阳十个月，抵挡燕军十余万，粮尽城破被杀。睢阳屏障江淮，保全了唐朝的财赋来源，城破后十天唐军即收复洛阳。","i":233,"e":{"old":"Siege of Suiyang","mod":"Shangqiu, Henan","note":"Zhang Xun first held Yongqiu, then with Xu Yuan held Suiyang to the death for ten months with fewer than 10,000 men against more than 100,000 Yan troops, until the food ran out, the city fell and they were killed. Suiyang shielded the Jiang–Huai region and so saved the Tang's source of revenue; ten days after it fell the Tang army recovered Luoyang.","yt":"1st–10th month, 757","sides":"Yan defeated Tang (city fell)","cmd":"Yin Ziqi vs. Zhang Xun and Xu Yuan"}},{"c":"battle","old":"太原之战","mod":"山西太原","lon":112.52,"lat":37.78,"y":757,"yt":"757 年正—二月","sides":"唐 胜 燕","cmd":"李光弼 vs 史思明、蔡希德","note":"李光弼以不满万人守太原，掘壕、挖地道、造发石车，坚守五十余日，斩燕军七万余人，史思明退走。","i":234,"e":{"old":"Battle of Taiyuan (757)","mod":"Taiyuan, Shanxi","note":"Li Guangbi held Taiyuan with fewer than 10,000 men, digging trenches and tunnels and building trebuchets; he held out for more than fifty days and killed over 70,000 Yan troops, and Shi Siming withdrew.","yt":"1st–2nd month, 757","sides":"Tang defeated Yan","cmd":"Li Guangbi vs. Shi Siming and Cai Xide"}},{"c":"battle","old":"香积寺之战","mod":"陕西西安长安区","lon":108.9,"lat":34.15,"y":757,"yt":"757 年九月","sides":"唐·回纥 胜 燕","cmd":"李俶、郭子仪、回纥叶护 vs 安守忠、李归仁","note":"十五万唐军与四千回纥骑兵在长安城南香积寺北决战，回纥绕袭燕军之后，燕军大溃，斩首六万，次日收复长安。","i":235,"e":{"old":"Battle of Xiangji Temple","mod":"Chang'an District, Xi'an, Shaanxi","note":"150,000 Tang troops and 4,000 Uyghur horsemen fought the decisive battle north of Xiangji Temple, south of Chang'an. The Uyghurs circled round to strike the Yan rear, the Yan army collapsed and 60,000 were beheaded; Chang'an was recovered the next day.","yt":"9th month, 757","sides":"Tang and the Uyghurs defeated Yan","cmd":"Li Chu, Guo Ziyi and the Uyghur yabghu vs. An Shouzhong and Li Guiren"}},{"c":"battle","old":"新店之战","mod":"河南三门峡陕州区","lon":111.28,"lat":34.73,"y":757,"yt":"757 年十月","sides":"唐·回纥 胜 燕","cmd":"郭子仪 vs 严庄","note":"回纥骑兵从南山背后夹击，燕军大败，安庆绪弃洛阳北走邺城，唐收复东都。","i":236,"e":{"old":"Battle of Xindian","mod":"Shanzhou District, Sanmenxia, Henan","note":"Uyghur horsemen came from behind the southern hills to catch the Yan army in a pincer; the Yan army was routed, An Qingxu abandoned Luoyang and fled north to Yecheng, and the Tang recovered the Eastern Capital.","yt":"10th month, 757","sides":"Tang and the Uyghurs defeated Yan","cmd":"Guo Ziyi vs. Yan Zhuang"}},{"c":"battle","old":"邺城之战","mod":"河南安阳","lon":114.4,"lat":36.13,"y":759,"yt":"758 年冬—759 年三月","sides":"燕 胜 唐","cmd":"九节度使（郭子仪、李光弼等）vs 史思明、安庆绪","note":"肃宗不设元帅，以宦官鱼朝恩为观军容使，六十万唐军围邺城半年不下；史思明来援，两军交战时狂风大作，唐军溃散。史思明随即杀安庆绪，自称大燕皇帝。杜甫“三吏三别”即写此役前后的征兵。","i":237,"e":{"old":"Battle of Yecheng","mod":"Anyang, Henan","note":"Emperor Suzong appointed no supreme commander and made the eunuch Yu Chao'en army supervisor instead; 600,000 Tang troops besieged Yecheng for half a year without taking it. Shi Siming came to the rescue; while the armies were fighting a violent storm blew up and the Tang army scattered. Shi Siming then killed An Qingxu and proclaimed himself emperor of Great Yan. Du Fu's \"Three Officers\" and \"Three Partings\" describe the conscription around this campaign.","yt":"winter 758 – 3rd month, 759","sides":"Yan defeated Tang","cmd":"nine military governors (Guo Ziyi, Li Guangbi and others) vs. Shi Siming and An Qingxu"}},{"c":"battle","old":"邙山之战","mod":"河南洛阳北","lon":112.52,"lat":34.76,"y":761,"yt":"761 年二月","sides":"燕 胜 唐","cmd":"史思明 vs 李光弼、仆固怀恩","note":"鱼朝恩催促出战，唐军在邙山大败，河阳、怀州复失。同年史思明为其子史朝义所杀。","i":238,"e":{"old":"Battle of Mount Mang","mod":"north of Luoyang, Henan","note":"Pressed by Yu Chao'en to give battle, the Tang army was badly beaten at Mount Mang, and Heyang and Huaizhou were lost again. In the same year Shi Siming was killed by his son Shi Chaoyi.","yt":"2nd month, 761","sides":"Yan defeated Tang","cmd":"Shi Siming vs. Li Guangbi and Pugu Huai'en"}},{"c":"battle","old":"吐蕃陷长安","mod":"陕西西安","lon":109.05,"lat":34.2,"y":763,"yt":"763 年十月","sides":"吐蕃 攻陷","cmd":"吐蕃 vs 唐代宗","note":"吐蕃二十万众东进，代宗出奔陕州，吐蕃入长安，立广武王李承宏为帝，十五日后郭子仪收复。","i":239,"e":{"old":"Tibetan capture of Chang'an","mod":"Xi'an, Shaanxi","note":"200,000 Tibetans advanced east; Emperor Daizong fled to Shanzhou, and the Tibetans entered Chang'an and set up Li Chenghong, Prince of Guangwu, as emperor. Fifteen days later Guo Ziyi recovered the city.","yt":"10th month, 763","sides":"Tibet took the city","cmd":"Tibet vs. Emperor Daizong of Tang"}},{"c":"battle","old":"泾阳之盟","mod":"陕西泾阳","lon":108.84,"lat":34.53,"y":765,"yt":"765 年十月","sides":"唐·回纥 胜 吐蕃","cmd":"郭子仪","note":"仆固怀恩叛唐，引吐蕃、回纥等三十万入寇，途中病死；郭子仪免胄单骑入回纥营，重申旧好，与回纥合击吐蕃于灵台西原，关中解围。","i":240,"e":{"old":"Treaty of Jingyang","mod":"Jingyang, Shaanxi","note":"Pugu Huai'en rebelled against the Tang and led 300,000 Tibetans, Uyghurs and others in an invasion, but died of illness on the way. Guo Ziyi took off his helmet and rode alone into the Uyghur camp to renew the old friendship; together with the Uyghurs he attacked the Tibetans on the Xiyuan plain at Lingtai, and Guanzhong was relieved.","yt":"10th month, 765","sides":"Tang and the Uyghurs defeated Tibet","cmd":"Guo Ziyi"}},{"c":"battle","old":"洹水之战","mod":"河北魏县","lon":115.0,"lat":36.33,"y":782,"yt":"782 年正月","sides":"唐 胜 魏博","cmd":"马燧、李抱真、李芃 vs 田悦","note":"建中削藩战争中唐军在洹水大破田悦，围魏州；随后朱滔、王武俊倒戈，四镇连兵称王，战局逆转。","i":241,"e":{"old":"Battle of the Huan River","mod":"Wei County, Hebei","note":"In the Jianzhong war to curb the fanzhen the Tang army routed Tian Yue on the Huan River and besieged Weizhou; then Zhu Tao and Wang Wujun changed sides, four fanzhen joined forces and their leaders proclaimed themselves kings, and the war turned.","yt":"1st month, 782","sides":"Tang defeated Weibo","cmd":"Ma Sui, Li Baozhen and Li Peng vs. Tian Yue"}},{"c":"battle","old":"奉天之围","mod":"陕西乾县","lon":108.24,"lat":34.5,"y":783,"yt":"783 年十—十一月","sides":"唐 守城","cmd":"德宗、浑瑊 vs 朱泚","note":"泾原兵变后德宗逃到奉天，朱泚亲率大军围城一个多月，浑瑊死守，李怀光自河北赶回解围。陆贽为德宗起草《奉天改元大赦制》，即“罪己诏”。","i":242,"e":{"old":"Siege of Fengtian","mod":"Qian County, Shaanxi","note":"After the Jingyuan mutiny Emperor Dezong fled to Fengtian; Zhu Ci led a great army in person and besieged the city for more than a month. Hun Jian held it to the end, and Li Huaiguang hurried back from Hebei to break the siege. Lu Zhi drafted for Dezong the \"Great Amnesty on Changing the Reign Title at Fengtian\", the \"edict of self-reproach\".","yt":"10th–11th month, 783","sides":"Tang held the city","cmd":"Emperor Dezong of Tang and Hun Jian vs. Zhu Ci"}},{"c":"battle","old":"李晟收复长安","mod":"陕西西安东渭桥","lon":109.1,"lat":34.42,"y":784,"yt":"784 年五月","sides":"唐 胜 朱泚","cmd":"李晟 vs 朱泚","note":"李晟以孤军屯东渭桥，不受李怀光吞并，五月自光泰门攻入长安，朱泚西逃被杀。","i":243,"e":{"old":"Li Sheng retakes Chang'an","mod":"East Wei Bridge, Xi'an, Shaanxi","note":"Li Sheng camped with an isolated army at the East Wei Bridge and refused to be absorbed by Li Huaiguang; in the 5th month he broke into Chang'an through the Guangtai Gate, and Zhu Ci fled west and was killed.","yt":"5th month, 784","sides":"Tang defeated Zhu Ci","cmd":"Li Sheng vs. Zhu Ci"}},{"c":"battle","old":"平凉劫盟","mod":"甘肃平凉","lon":106.62,"lat":35.48,"y":787,"yt":"787 年闰五月","sides":"吐蕃 劫 唐","cmd":"尚结赞 vs 浑瑊","note":"吐蕃大相尚结赞假意会盟，伏兵劫杀唐使团，浑瑊仅以身免，副使崔汉衡等六十余人被俘。","i":244,"e":{"old":"Ambush at the Pingliang treaty","mod":"Pingliang, Gansu","note":"The Tibetan chief minister Shang Jiezan pretended to make a treaty and had hidden troops seize and kill the Tang envoys; Hun Jian barely escaped with his life, and the deputy envoy Cui Hanheng and more than sixty others were captured.","yt":"intercalary 5th month, 787","sides":"Tibet ambushed Tang","cmd":"Shang Jiezan vs. Hun Jian"}},{"c":"battle","old":"北庭之战","mod":"新疆吉木萨尔","lon":89.25,"lat":44.02,"y":790,"yt":"790 年","sides":"吐蕃 胜 唐·回鹘","cmd":"吐蕃、葛逻禄 vs 杨袭古、颉干迦斯","note":"吐蕃联合葛逻禄、白服突厥攻北庭，回鹘大相颉干迦斯救援失败，北庭陷落，节度使杨袭古奔西州，后被回鹘所杀。","i":245,"e":{"old":"Battle of Beiting","mod":"Jimsar, Xinjiang","note":"Tibet, joined by the Karluks and the White-Clad Turks, attacked Beiting; the Uyghur chief minister Jiegan Jiasi failed to relieve it, Beiting fell, and its military governor Yang Xigu fled to Xizhou and was later killed by the Uyghurs.","yt":"790","sides":"Tibet defeated Tang and the Uyghurs","cmd":"Tibet and the Karluks vs. Yang Xigu and Jiegan Jiasi"}},{"c":"battle","old":"维州之战","mod":"四川理县","lon":103.42,"lat":31.45,"y":801,"yt":"801 年","sides":"唐 胜 吐蕃","cmd":"韦皋 vs 论莽热","note":"韦皋联合南诏、东蛮分兵九路出击，在雅州、维州一带大破吐蕃，擒吐蕃内大相论莽热，吐蕃由此转衰。","i":246,"e":{"old":"Battle of Weizhou","mod":"Li County, Sichuan","note":"Wei Gao, allied with Nanzhao and the Eastern tribes, attacked in nine columns and routed the Tibetans around Yazhou and Weizhou, capturing the Tibetan inner chief minister Lun Mangre. From then on Tibet declined.","yt":"801","sides":"Tang defeated Tibet","cmd":"Wei Gao vs. Lun Mangre"}},{"c":"battle","old":"鹿头关之战","mod":"四川德阳北","lon":104.4,"lat":31.25,"y":806,"yt":"806 年","sides":"唐 胜 西川","cmd":"高崇文 vs 刘辟","note":"宪宗即位后第一次用兵，高崇文八战八胜，破鹿头关，攻入成都，擒刘辟。","i":247,"e":{"old":"Battle of Lutou Pass","mod":"north of Deyang, Sichuan","note":"The first campaign after Emperor Xianzong's accession: Gao Chongwen won eight battles out of eight, broke through Lutou Pass, took Chengdu and captured Liu Pi.","yt":"806","sides":"Tang defeated Xichuan","cmd":"Gao Chongwen vs. Liu Pi"}},{"c":"battle","old":"蔡州之战","mod":"河南汝南","lon":114.4,"lat":32.96,"y":817,"yt":"817 年十月","sides":"唐 胜 淮西","cmd":"李愬 vs 吴元济","note":"淮西战事已持续三年，李愬厚待降将李祐，于风雪夜急行七十里奇袭蔡州，生擒吴元济，割据三十余年的淮西平定，河北诸镇震恐。","i":248,"e":{"old":"Battle of Caizhou","mod":"Runan, Henan","note":"The war in Huaixi had dragged on for three years. Li Su treated the surrendered officer Li You generously, then on a snowy night made a forced march of seventy li to surprise Caizhou and captured Wu Yuanji alive. Huaixi, held independently for more than thirty years, was pacified, and the Hebei fanzhen were struck with fear.","yt":"10th month, 817","sides":"Tang defeated Huaixi","cmd":"Li Su vs. Wu Yuanji"}},{"c":"battle","old":"平淄青","mod":"山东东平","lon":116.3,"lat":36.02,"y":819,"yt":"818—819 年","sides":"唐 胜 淄青","cmd":"田弘正、李光颜等 vs 李师道","note":"诸道兵合讨，淄青都知兵马使刘悟回军斩李师道父子，十二州平定，分为三镇。","i":249,"e":{"old":"Pacification of Ziqing","mod":"Dongping, Shandong","note":"Troops from many fanzhen joined the attack; Liu Wu, Ziqing's chief commander of troops, turned his army back and beheaded Li Shidao and his son. The twelve prefectures were pacified and divided into three fanzhen.","yt":"818–819","sides":"Tang defeated Ziqing","cmd":"Tian Hongzheng, Li Guangyan and others vs. Li Shidao"}},{"c":"battle","old":"杀胡山之战","mod":"内蒙古和林格尔一带","lon":111.5,"lat":40.62,"y":843,"yt":"843 年正月","sides":"唐 胜 回鹘","cmd":"刘沔、石雄 vs 乌介可汗","note":"回鹘汗国破灭后，乌介可汗挟和亲的太和公主南下寇边；石雄夜袭牙帐，迎回太和公主，乌介远遁。","i":250,"e":{"old":"Battle of Mount Shahu","mod":"around Horinger, Inner Mongolia","note":"After the fall of the Uyghur Khaganate, Wujie Khagan came south to raid the frontier, holding Princess Taihe, given to the Uyghurs in a marriage alliance; Shi Xiong raided his camp by night and brought Princess Taihe back, and Wujie fled far away.","yt":"1st month, 843","sides":"Tang defeated the Uyghurs","cmd":"Liu Mian and Shi Xiong vs. Wujie Khagan"}},{"c":"battle","old":"泽潞之役","mod":"山西长治","lon":113.15,"lat":36.25,"y":844,"yt":"843—844 年","sides":"唐 胜 昭义","cmd":"李德裕主持 vs 刘稹","note":"昭义刘稹拒绝朝命自立，宰相李德裕力主讨伐，令成德、魏博两镇出兵，844 年刘稹被部将郭谊所杀，昭义平定。","i":251,"e":{"old":"Zelu campaign","mod":"Changzhi, Shanxi","note":"Liu Zhen of Zhaoyi defied the court and set himself up; the chief minister Li Deyu insisted on a punitive campaign and had Chengde and Weibo send troops. In 844 Liu Zhen was killed by his officer Guo Yi, and Zhaoyi was pacified.","yt":"843–844","sides":"Tang defeated Zhaoyi","cmd":"Li Deyu (directing) vs. Liu Zhen"}},{"c":"battle","old":"沙州起义","mod":"甘肃敦煌","lon":94.7,"lat":40.08,"y":848,"yt":"848 年","sides":"张议潮 胜 吐蕃","cmd":"张议潮","note":"张议潮率汉、蕃民众起事，驱逐吐蕃守将，收复沙、瓜，随后转战河西，851 年遣使奉十一州图籍归唐。","i":252,"e":{"old":"Shazhou uprising","mod":"Dunhuang, Gansu","note":"Zhang Yichao led Chinese and Tibetan inhabitants in a rising, drove out the Tibetan commanders and recovered Shazhou and Guazhou, then fought his way across Hexi; in 851 he sent envoys with the maps and registers of eleven prefectures to submit to the Tang.","yt":"848","sides":"Zhang Yichao defeated Tibet","cmd":"Zhang Yichao"}},{"c":"battle","old":"交趾之战","mod":"越南河内","lon":105.88,"lat":20.98,"y":866,"yt":"863—866 年","sides":"唐 胜 南诏","cmd":"高骈 vs 南诏杨思缙","note":"南诏两陷交趾（863 年再陷），前后杀掠近十五万人；高骈 864 年起率军反攻，866 年收复交趾，筑大罗城，安南改置静海军。","i":253,"e":{"old":"Battle of Jiaozhi","mod":"Hanoi, Vietnam","note":"Nanzhao took Jiaozhi twice (the second time in 863), killing or carrying off nearly 150,000 people in all. Gao Pian counterattacked from 864, recovered Jiaozhi in 866 and built the citadel of Đại La; Annan was reorganized as the Jinghai Jun.","yt":"863–866","sides":"Tang defeated Nanzhao","cmd":"Gao Pian vs. Yang Sijin of Nanzhao"}},{"c":"battle","old":"庞勋之乱","mod":"安徽宿州西","lon":116.8,"lat":33.6,"y":869,"yt":"868—869 年","sides":"唐 胜 庞勋","cmd":"康承训、沙陀朱邪赤心 vs 庞勋","note":"戍守桂州的徐州兵八百人擅自北归，攻占徐州，众至二十万；唐借沙陀骑兵镇压，朱邪赤心因功赐名李国昌。史称“唐亡于黄巢，而祸基于桂林”。","i":254,"e":{"old":"Pang Xun rebellion","mod":"west of Suzhou, Anhui","note":"Eight hundred Xuzhou soldiers garrisoning Guizhou marched home north without orders, seized Xuzhou and grew to 200,000 men; the Tang put them down with the help of Shatuo cavalry, and Zhuye Chixin was rewarded with the name Li Guochang. As historians put it, \"The Tang fell to Huang Chao, but the root of the disaster lay in Guilin.\"","yt":"868–869","sides":"Tang defeated Pang Xun","cmd":"Kang Chengxun and Zhuye Chixin of the Shatuo vs. Pang Xun"}},{"c":"battle","old":"成都之围","mod":"四川成都","lon":104.1,"lat":30.62,"y":870,"yt":"869—870 年","sides":"唐 守城","cmd":"颜庆复等 vs 南诏世隆","note":"南诏大举入寇西川，围攻成都，城中军民坚守，援军至而南诏退兵。875 年高骈到任，筑成都罗城。","i":255,"e":{"old":"Siege of Chengdu","mod":"Chengdu, Sichuan","note":"Nanzhao invaded Xichuan in force and besieged Chengdu; the soldiers and people in the city held out until relief arrived and Nanzhao withdrew. Gao Pian took up his post in 875 and built Chengdu's outer wall.","yt":"869–870","sides":"Tang held the city","cmd":"Yan Qingfu and others vs. Shilong of Nanzhao"}},{"c":"battle","old":"黄巢陷广州","mod":"广东广州","lon":113.3,"lat":23.1,"y":879,"yt":"879 年九月","sides":"黄巢 攻陷","cmd":"黄巢","note":"黄巢南下攻破广州，据阿拉伯史料杀戮外商甚众；岭南疫病流行，黄巢旋即北上。","i":256,"e":{"old":"Huang Chao takes Guangzhou","mod":"Guangzhou, Guangdong","note":"Huang Chao came south and took Guangzhou; according to Arabic sources he killed great numbers of foreign merchants. Epidemics were raging in Lingnan, and Huang Chao soon turned north.","yt":"9th month, 879","sides":"Huang Chao took the city","cmd":"Huang Chao"}},{"c":"battle","old":"黄巢破潼关","mod":"陕西潼关","lon":110.38,"lat":34.6,"y":880,"yt":"880 年十二月","sides":"黄巢 胜 唐","cmd":"黄巢 vs 张承范","note":"黄巢六十万众攻破潼关，僖宗逃往成都，黄巢入长安。","i":257,"e":{"old":"Huang Chao breaks through Tong Pass","mod":"Tongguan, Shaanxi","note":"Huang Chao's 600,000 men broke through Tong Pass; Emperor Xizong fled to Chengdu and Huang Chao entered Chang'an.","yt":"12th month, 880","sides":"Huang Chao defeated Tang","cmd":"Huang Chao vs. Zhang Chengfan"}},{"c":"battle","old":"梁田陂之战","mod":"陕西渭南华州区西","lon":109.6,"lat":34.55,"y":883,"yt":"883 年二月","sides":"唐（沙陀）胜 大齐","cmd":"李克用 vs 尚让","note":"李克用率沙陀“鸦儿军”大破黄巢军十五万，四月收复长安。时年二十八岁，名震天下。","i":258,"e":{"old":"Battle of Liangtianpo","mod":"west of Huazhou District, Weinan, Shaanxi","note":"Li Keyong with his Shatuo \"Raven Army\" routed 150,000 of Huang Chao's troops, and in the 4th month recovered Chang'an. He was twenty-eight, and his name was known throughout the land.","yt":"2nd month, 883","sides":"Tang (Shatuo) defeated Great Qi","cmd":"Li Keyong vs. Shang Rang"}},{"c":"battle","old":"狼虎谷","mod":"山东济南莱芜区","lon":117.65,"lat":36.22,"y":884,"yt":"884 年六月","sides":"唐 胜 黄巢","cmd":"时溥 vs 黄巢","note":"黄巢在泰山狼虎谷兵败，为外甥林言所杀（一说自杀），历时十年的起义结束。","i":259,"e":{"old":"Langhu Valley","mod":"Laiwu District, Jinan, Shandong","note":"Defeated in Langhu Valley on Mount Tai, Huang Chao was killed by his nephew Lin Yan (one account says he killed himself), ending a rising that had lasted ten years.","yt":"6th month, 884","sides":"Tang defeated Huang Chao","cmd":"Shi Pu vs. Huang Chao"}},{"c":"battle","old":"上源驿之变","mod":"河南开封","lon":114.4,"lat":34.84,"y":884,"yt":"884 年五月","sides":"朱全忠 袭 李克用","cmd":"朱全忠 vs 李克用","note":"李克用追击黄巢后途经汴州，朱全忠在上源驿设宴，夜间纵兵围攻，李克用缒城逃脱。朱、李从此结为世仇，左右此后四十年的北方战局。","i":260,"e":{"old":"Shangyuan Post Station incident","mod":"Kaifeng, Henan","note":"Returning from the pursuit of Huang Chao, Li Keyong passed through Bianzhou; Zhu Quanzhong gave a banquet for him at the Shangyuan Post Station, then at night sent troops to attack him, and Li Keyong escaped by letting himself down the city wall on a rope. From then on Zhu and Li were sworn enemies, and their feud shaped the wars of the north for the next forty years.","yt":"5th month, 884","sides":"Zhu Quanzhong ambushed Li Keyong","cmd":"Zhu Quanzhong vs. Li Keyong"}},{"c":"battle","old":"清口之战","mod":"江苏淮安西南","lon":118.95,"lat":33.55,"y":897,"yt":"897 年十一月","sides":"淮南 胜 宣武","cmd":"杨行密、朱瑾 vs 庞师古","note":"朱全忠分两路伐淮南，杨行密决淮水灌庞师古营，斩庞师古，汴军大败，另一路葛从周闻讯退走。南北分立之势由此确定。","i":261,"e":{"old":"Battle of Qingkou","mod":"southwest of Huai'an, Jiangsu","note":"Zhu Quanzhong attacked Huainan in two columns; Yang Xingmi broke the Huai dikes to flood Pang Shigu's camp and killed Pang Shigu, and the Bianzhou army was routed; the other column under Ge Congzhou withdrew on hearing the news. This settled the division between north and south.","yt":"11th month, 897","sides":"Huainan defeated Xuanwu","cmd":"Yang Xingmi and Zhu Jin vs. Pang Shigu"}},{"c":"battle","old":"凤翔之围","mod":"陕西凤翔","lon":107.42,"lat":34.48,"y":903,"yt":"902—903 年","sides":"宣武 胜 岐","cmd":"朱全忠 vs 李茂贞","note":"宦官韩全诲挟昭宗投奔李茂贞，朱全忠围凤翔一年，城中人相食，李茂贞杀宦官交出昭宗，朱全忠从此控制朝廷。","i":262,"e":{"old":"Siege of Fengxiang","mod":"Fengxiang District, Baoji, Shaanxi","note":"The eunuch Han Quanhui carried Emperor Zhaozong off to Li Maozhen. Zhu Quanzhong besieged Fengxiang for a year, until people in the city were eating one another and Li Maozhen killed the eunuchs and handed over Zhaozong. From then on Zhu Quanzhong controlled the court.","yt":"902–903","sides":"Xuanwu defeated Qi","cmd":"Zhu Quanzhong vs. Li Maozhen"}},{"c":"battle","old":"潞州之战","mod":"山西长治","lon":113.08,"lat":36.28,"y":908,"yt":"908 年五月","sides":"晋 胜 后梁","cmd":"李存勖 vs 符道昭","note":"梁军筑夹寨围潞州一年；李克用刚去世，李存勖借大雾自三垂冈突袭夹寨，大破梁军。朱全忠叹“生子当如李亚子”。","i":263,"e":{"old":"Battle of Luzhou","mod":"Changzhi, Shanxi","note":"The Liang army built a double-walled siege camp and besieged Luzhou for a year. Li Keyong had just died; Li Cunxu used a thick fog to strike the siege camp from Sanchui Ridge and routed the Liang army. Zhu Quanzhong sighed, \"A son should be like Li Yazi.\"","yt":"5th month, 908","sides":"Jin defeated Later Liang","cmd":"Li Cunxu vs. Fu Daozhao"}},{"c":"battle","old":"柏乡之战","mod":"河北柏乡","lon":114.7,"lat":37.48,"y":911,"yt":"911 年正月","sides":"晋·赵 胜 后梁","cmd":"李存勖、周德威 vs 王景仁","note":"晋军以骑兵扰敌、待其疲惫后反击，梁军精锐几乎全军覆没，河北诸镇倒向晋。","i":264,"e":{"old":"Battle of Baixiang","mod":"Baixiang, Hebei","note":"The Jin army harassed the enemy with cavalry and counterattacked once the enemy was worn out; Liang's best troops were almost entirely destroyed, and the Hebei fanzhen went over to Jin.","yt":"1st month, 911","sides":"Jin and Zhao defeated Later Liang","cmd":"Li Cunxu and Zhou Dewei vs. Wang Jingren"}},{"c":"battle","old":"幽州之围","mod":"北京","lon":116.45,"lat":39.95,"y":917,"yt":"917 年三—八月","sides":"晋 守城","cmd":"周德威 vs 耶律阿保机","note":"契丹号称三十万围幽州二百余日，李嗣源、李存审率步骑七万解围。","i":265,"e":{"old":"Siege of Youzhou","mod":"Beijing","note":"The Khitans, said to number 300,000, besieged Youzhou for more than two hundred days; Li Siyuan and Li Cunshen relieved it with 70,000 foot and horse.","yt":"3rd–8th month, 917","sides":"Jin held the city","cmd":"Zhou Dewei vs. Yelü Abaoji"}},{"c":"battle","old":"胡柳陂之战","mod":"山东鄄城西","lon":115.35,"lat":35.65,"y":918,"yt":"918 年十二月","sides":"晋 惨胜 后梁","cmd":"李存勖 vs 贺瑰","note":"两军在胡柳陂反复冲杀，双方死伤各数万，晋大将周德威父子战死。","i":266,"e":{"old":"Battle of Huliupo","mod":"west of Juancheng, Shandong","note":"The two armies charged back and forth at Huliupo, each losing tens of thousands; the Jin general Zhou Dewei and his son were killed in battle.","yt":"12th month, 918","sides":"Jin won a costly victory over Later Liang","cmd":"Li Cunxu vs. He Gui"}},{"c":"battle","old":"中都之战","mod":"山东汶上","lon":116.5,"lat":35.73,"y":923,"yt":"923 年十月","sides":"后唐 胜 后梁","cmd":"李存勖 vs 王彦章","note":"李存勖擒梁将王彦章，李嗣源长驱奔袭开封，梁末帝自杀，后梁亡。","i":267,"e":{"old":"Battle of Zhongdu","mod":"Wenshang, Shandong","note":"Li Cunxu captured the Liang general Wang Yanzhang; Li Siyuan made a long dash to strike Kaifeng, the last Liang emperor killed himself, and the Later Liang fell.","yt":"10th month, 923","sides":"Later Tang defeated Later Liang","cmd":"Li Cunxu vs. Wang Yanzhang"}},{"c":"battle","old":"灭前蜀之役","mod":"四川剑阁","lon":105.55,"lat":32.18,"y":925,"yt":"925 年九—十一月","sides":"后唐 胜 前蜀","cmd":"郭崇韬、李继岌 vs 王衍","note":"后唐六万兵自凤州入蜀，七十日入成都，王衍出降。郭崇韬旋即被宦官诬陷所杀。","i":268,"e":{"old":"Conquest of Former Shu","mod":"Jiange, Sichuan","note":"60,000 Later Tang troops entered Shu from Fengzhou and reached Chengdu in seventy days, and Wang Yan surrendered. Soon afterwards Guo Chongtao was falsely accused by eunuchs and killed.","yt":"9th–11th month, 925","sides":"Later Tang defeated Former Shu","cmd":"Guo Chongtao and Li Jiji vs. Wang Yan"}},{"c":"battle","old":"忽汗城之战","mod":"黑龙江宁安","lon":129.2,"lat":43.85,"y":926,"yt":"925 年十二月—926 年正月","sides":"契丹 胜 渤海","cmd":"耶律阿保机 vs 大諲譔","note":"契丹先破扶余府，再围忽汗城，渤海王大諲譔出降，立国二百二十九年的渤海灭亡。","i":269,"e":{"old":"Battle of Huhan City","mod":"Ning'an, Heilongjiang","note":"The Khitans first took Fuyu Fu, then besieged Huhan City; the Balhae king Dae Inseon surrendered, and Balhae, which had lasted 229 years, came to an end.","yt":"12th month, 925 – 1st month, 926","sides":"Khitan defeated Balhae","cmd":"Yelü Abaoji vs. Dae Inseon"}},{"c":"battle","old":"晋阳之战","mod":"山西太原南","lon":112.45,"lat":37.55,"y":936,"yt":"936 年九—闰十一月","sides":"契丹·石敬瑭 胜 后唐","cmd":"耶律德光 vs 张敬达","note":"石敬瑭据太原叛，契丹五万骑来援，大败后唐军并围晋安寨，张敬达被部将杀死，全军降契丹；石敬瑭称帝南下，后唐亡。","i":270,"e":{"old":"Battle of Jinyang","mod":"south of Taiyuan, Shanxi","note":"Shi Jingtang rebelled at Taiyuan; 50,000 Khitan horsemen came to his aid, routed the Later Tang army and besieged it at Jin'an Fort. Zhang Jingda was killed by his own officers and the whole army surrendered to the Khitans; Shi Jingtang proclaimed himself emperor and marched south, and the Later Tang fell.","yt":"9th – intercalary 11th month, 936","sides":"Khitan and Shi Jingtang defeated Later Tang","cmd":"Yelü Deguang vs. Zhang Jingda"}},{"c":"battle","old":"白藤江之战","mod":"越南海防","lon":106.75,"lat":20.92,"y":938,"yt":"938 年冬","sides":"静海 胜 南汉","cmd":"吴权 vs 刘弘操","note":"吴权在白藤江口暗植铁头木桩，趁涨潮诱南汉水军入江，潮落时船只被桩困住，南汉大败，汉主之子交王刘弘操战死。次年吴权称王，越南脱离中原王朝统治。","i":271,"e":{"old":"Battle of Bạch Đằng (938)","mod":"Haiphong, Vietnam","note":"Ngô Quyền secretly planted iron-tipped stakes in the mouth of the Bạch Đằng River and lured the Southern Han fleet into the river at high tide; when the tide fell the ships were caught on the stakes. Southern Han was badly defeated, and Liu Hongcao, son of the Southern Han ruler and Prince of Jiao, was killed. The next year Ngô Quyền proclaimed himself king, and Vietnam broke free of rule by the dynasties of the Central Plains.","yt":"winter 938","sides":"Jinghai defeated Southern Han","cmd":"Ngô Quyền vs. Liu Hongcao"}},{"c":"battle","old":"阳城之战","mod":"河北保定清苑一带","lon":115.4,"lat":38.8,"y":945,"yt":"945 年三月","sides":"后晋 胜 契丹","cmd":"杜重威、符彦卿 vs 耶律德光","note":"晋军在白团卫村被围缺水，符彦卿等乘大风出击，契丹大败，德光乘骆驼逃走。","i":272,"e":{"old":"Battle of Yangcheng","mod":"around Qingyuan District, Baoding, Hebei","note":"Surrounded and short of water at Baituanwei Village, the Jin army broke out in a strong wind under Fu Yanqing and others; the Khitans were badly beaten and Yelü Deguang fled on a camel.","yt":"3rd month, 945","sides":"Later Jin defeated Khitan","cmd":"Du Chongwei and Fu Yanqing vs. Yelü Deguang"}},{"c":"battle","old":"建州之役","mod":"福建建瓯","lon":118.35,"lat":27.0,"y":945,"yt":"944—945 年","sides":"南唐 胜 闽（殷）","cmd":"查文徽 vs 王延政","note":"闽国王氏兄弟内战，南唐乘机出兵，945 年八月攻破建州，王延政出降，闽亡。","i":273,"e":{"old":"Jianzhou campaign","mod":"Jian'ou, Fujian","note":"The Wang brothers of Min were fighting a civil war; Southern Tang seized the chance to send troops and took Jianzhou in the 8th month of 945. Wang Yanzheng surrendered, and Min fell.","yt":"944–945","sides":"Southern Tang defeated Min (Yin)","cmd":"Zha Wenhui vs. Wang Yanzheng"}},{"c":"battle","old":"中渡桥之降","mod":"河北正定南","lon":114.62,"lat":38.08,"y":946,"yt":"946 年十二月","sides":"契丹 胜 后晋","cmd":"耶律德光 vs 杜重威","note":"杜重威率后晋主力十万在滹沱河中渡桥被围，降契丹，晋军精锐尽失，同月契丹前锋张彦泽攻入开封。","i":274,"e":{"old":"Surrender at Zhongdu Bridge","mod":"south of Zhengding, Hebei","note":"Du Chongwei, leading the 100,000-strong main army of Later Jin, was surrounded at the Zhongdu Bridge over the Hutuo River and surrendered to the Khitans; Jin lost its best troops, and the same month the Khitan vanguard under Zhang Yanze broke into Kaifeng.","yt":"12th month, 946","sides":"Khitan defeated Later Jin","cmd":"Yelü Deguang vs. Du Chongwei"}},{"c":"battle","old":"南唐灭楚","mod":"湖南长沙","lon":113.02,"lat":28.17,"y":951,"yt":"951 年十月","sides":"南唐 胜 楚","cmd":"边镐 vs 马希崇","note":"楚国马氏诸子相争，南唐边镐入长沙，马氏举族东迁金陵，楚亡；次年刘言、王逵逐走南唐军。","i":275,"e":{"old":"Southern Tang conquers Chu","mod":"Changsha, Hunan","note":"As the sons of the Ma family of Chu fought one another, the Southern Tang general Bian Hao entered Changsha; the whole Ma clan was moved east to Jinling, and Chu fell. The next year Liu Yan and Wang Kui drove out the Southern Tang army.","yt":"10th month, 951","sides":"Southern Tang defeated Chu","cmd":"Bian Hao vs. Ma Xichong"}},{"c":"battle","old":"高平之战","mod":"山西高平","lon":112.92,"lat":35.8,"y":954,"yt":"954 年三月","sides":"后周 胜 北汉·辽","cmd":"柴荣、赵匡胤 vs 刘崇、杨衮","note":"周世宗即位不久，北汉联辽来攻；右军樊爱能临阵溃逃，世宗亲冒矢石督战，赵匡胤等奋击，大败汉辽联军。战后斩樊爱能等七十余将，整顿禁军。","i":276,"e":{"old":"Battle of Gaoping","mod":"Gaoping, Shanxi","note":"Soon after Emperor Shizong of Later Zhou came to the throne, Northern Han attacked together with Liao. When Fan Aineng's right wing fled from the field, Shizong braved arrows and stones to lead the fight in person, Zhao Kuangyin and others charged, and the Han–Liao army was routed. Afterwards Fan Aineng and more than seventy other officers were executed and the Palace Army was reorganized.","yt":"3rd month, 954","sides":"Later Zhou defeated Northern Han and Liao","cmd":"Chai Rong and Zhao Kuangyin vs. Liu Chong and Yang Gun"}},{"c":"battle","old":"紫金山之战","mod":"安徽寿县","lon":116.8,"lat":32.62,"y":957,"yt":"956—957 年","sides":"后周 胜 南唐","cmd":"柴荣 vs 刘仁赡、朱元","note":"寿州守将刘仁赡坚守一年多；957 年世宗亲征，在紫金山大破南唐援军，寿州降。958 年南唐献江北十四州。","i":277,"e":{"old":"Battle of Mount Zijin","mod":"Shou County, Anhui","note":"Liu Renshan, the commander at Shouzhou, held out for more than a year; in 957 Emperor Shizong of Later Zhou led the army himself and routed the Southern Tang relief army at Mount Zijin, and Shouzhou surrendered. In 958 Southern Tang ceded its fourteen prefectures north of the Yangtze.","yt":"956–957","sides":"Later Zhou defeated Southern Tang","cmd":"Chai Rong vs. Liu Renshan and Zhu Yuan"}},{"c":"battle","old":"收复三关","mod":"河北雄县","lon":116.12,"lat":39.02,"y":959,"yt":"959 年四—五月","sides":"后周 胜 辽","cmd":"柴荣 vs 辽","note":"世宗北伐，四十二日内不战而取宁州、益津关、瓦桥关、淤口关与莫、瀛二州，正欲进取幽州时病重回师。","i":278,"e":{"old":"Recovery of the Three Passes","mod":"Xiong County, Hebei","note":"On his northern campaign Emperor Shizong of Later Zhou took Ningzhou, Yijin Pass, Waqiao Pass, Yukou Pass and the prefectures of Mozhou and Yingzhou in forty-two days without a battle; just as he was about to advance on Youzhou he fell seriously ill and turned back.","yt":"4th–5th month, 959","sides":"Later Zhou defeated Liao","cmd":"Chai Rong vs. Liao"}},{"c":"battle","old":"宋灭后蜀","mod":"四川广元","lon":105.8,"lat":32.38,"y":965,"yt":"964 年十一月—965 年正月","sides":"宋 胜 后蜀","cmd":"王全斌、刘光义 vs 孟昶","note":"宋军分两路自凤州、归州入蜀，六十六日平蜀，孟昶出降。","i":279,"e":{"old":"Song conquers Later Shu","mod":"Guangyuan, Sichuan","note":"The Song army entered Shu in two columns, from Fengzhou and Guizhou, conquered it in sixty-six days, and Meng Chang surrendered.","yt":"11th month, 964 – 1st month, 965","sides":"Song defeated Later Shu","cmd":"Wang Quanbin and Liu Guangyi vs. Meng Chang"}},{"c":"battle","old":"韶州之战","mod":"广东韶关","lon":113.62,"lat":24.76,"y":971,"yt":"970—971 年","sides":"宋 胜 南汉","cmd":"潘美 vs 李承渥","note":"潘美攻贺州、韶州，南汉以象阵迎战，宋军以强弩射象，象阵反冲己方，南汉大败；971 年二月宋军入广州，刘鋹出降。","i":280,"e":{"old":"Battle of Shaozhou","mod":"Shaoguan, Guangdong","note":"Pan Mei attacked Hezhou and Shaozhou. Southern Han met him with war elephants; the Song troops shot the elephants with crossbows, the elephants turned and charged their own side, and Southern Han was badly beaten. In the 2nd month of 971 the Song army entered Guangzhou and Liu Chang surrendered.","yt":"970–971","sides":"Song defeated Southern Han","cmd":"Pan Mei vs. Li Chengwo"}},{"c":"battle","old":"采石渡江","mod":"安徽马鞍山采石矶","lon":118.45,"lat":31.65,"y":975,"yt":"974 年十月—975 年十一月","sides":"宋 胜 南唐","cmd":"曹彬、潘美 vs 李煜","note":"宋军依樊若水所测江面宽度，在采石矶架设浮桥渡江，围金陵近一年，975 年十一月城破，李煜出降。","i":281,"e":{"old":"Crossing at Caishi","mod":"Caishiji, Ma'anshan, Anhui","note":"Using Fan Ruoshui's measurements of the width of the river, the Song army built a pontoon bridge at Caishiji and crossed the Yangtze; it besieged Jinling for nearly a year, the city fell in the 11th month of 975, and Li Yu surrendered.","yt":"10th month, 974 – 11th month, 975","sides":"Song defeated Southern Tang","cmd":"Cao Bin and Pan Mei vs. Li Yu"}},{"c":"battle","old":"太原之战","mod":"山西太原","lon":112.55,"lat":37.82,"y":979,"yt":"979 年二—五月","sides":"宋 胜 北汉","cmd":"宋太宗 vs 刘继元","note":"宋军先在石岭关击退辽援军，太宗亲临城下督攻，刘继元出降。太宗下令焚毁晋阳古城。","i":282,"e":{"old":"Battle of Taiyuan (979)","mod":"Taiyuan, Shanxi","note":"The Song army first drove back a Liao relief army at Shiling Pass; Emperor Taizong of Song came to the walls himself to direct the assault, and Liu Jiyuan surrendered. Taizong ordered the old city of Jinyang burned.","yt":"2nd–5th month, 979","sides":"Song defeated Northern Han","cmd":"Emperor Taizong of Song vs. Liu Jiyuan"}},{"c":"battle","old":"高梁河之战","mod":"北京西直门外","lon":116.3,"lat":39.96,"y":979,"yt":"979 年七月","sides":"辽 胜 宋","cmd":"耶律休哥、耶律斜轸 vs 宋太宗","note":"宋军灭北汉后乘胜攻幽州，久攻不下，辽军援至，宋军在高梁河大败，太宗中箭乘驴车南逃。此后宋辽长期对峙。","i":283,"e":{"old":"Battle of the Gaoliang River","mod":"outside Xizhimen, Beijing","note":"After destroying Northern Han the Song army pressed on to attack Youzhou but could not take it; when Liao reinforcements arrived it was badly beaten at the Gaoliang River, and Emperor Taizong of Song, wounded by an arrow, fled south in a donkey cart. From then on Song and Liao faced each other for a long time.","yt":"7th month, 979","sides":"Liao defeated Song","cmd":"Yelü Xiuge and Yelü Xiezhen vs. Emperor Taizong of Song"}},{"c":"pass","old":"潼关","mod":"陕西潼关港口","lon":110.33,"lat":34.6,"note":"关中东大门，安史之乱、黄巢之乱两度失守，长安随之陷落。","i":284,"e":{"old":"Tong Pass","mod":"Gangkou, Tongguan, Shaanxi","note":"The eastern gate of Guanzhong. It fell twice, in the An Lushan Rebellion and in Huang Chao's rebellion, and each time Chang'an fell with it."}},{"c":"pass","old":"蒲津关","mod":"山西永济蒲州","lon":110.38,"lat":34.82,"note":"黄河渡口，唐开元年间铸铁牛系浮桥，连通关中与河东。","i":285,"e":{"old":"Pujin Pass","mod":"Puzhou, Yongji, Shanxi","note":"A Yellow River crossing joining Guanzhong and Hedong; in the Kaiyuan era the Tang cast iron oxen to anchor its pontoon bridge."}},{"c":"pass","old":"武关","mod":"陕西丹凤武关镇","lon":110.65,"lat":33.68,"note":"长安东南门户，经商州通往襄、邓。","i":286,"e":{"old":"Wu Pass","mod":"Wuguan, Danfeng, Shaanxi","note":"The southeastern gate of Chang'an, leading through Shangzhou to Xiangzhou and Dengzhou."}},{"c":"pass","old":"大散关","mod":"陕西宝鸡南","lon":107.0,"lat":34.25,"note":"秦岭北口，扼陈仓道（嘉陵道）入汉中、蜀中。","i":287,"e":{"old":"Dasan Pass","mod":"south of Baoji, Shaanxi","note":"The northern entrance of the Qinling, commanding the Chencang road (Jialing road) into Hanzhong and Shu."}},{"c":"pass","old":"陇关","mod":"陕西陇县西","lon":106.55,"lat":34.88,"note":"又名大震关，翻越陇山的要道；吐蕃据陇右后成为唐蕃边关。","i":288,"e":{"old":"Long Pass","mod":"west of Long County, Shaanxi","note":"Also called Dazhen Pass, the main road over the Long Mountains; after Tibet took Longyou it became a Tang–Tibetan frontier pass."}},{"c":"pass","old":"萧关","mod":"宁夏固原东南","lon":106.4,"lat":35.9,"note":"关中西北门户，与原州七关同为边防要地。","i":289,"e":{"old":"Xiao Pass","mod":"southeast of Guyuan, Ningxia","note":"The northwestern gate of Guanzhong; with the Seven Passes of Yuanzhou, a key point of the frontier defense."}},{"c":"pass","old":"六盘关","mod":"宁夏固原南","lon":106.25,"lat":35.7,"note":"原州“七关”之一（石门、驿藏、制胜、六盘、石峡、木靖、木峡），849 年随原州一并收复。","i":290,"e":{"old":"Liupan Pass","mod":"south of Guyuan, Ningxia","note":"One of the \"Seven Passes\" of Yuanzhou (Shimen, Yizang, Zhisheng, Liupan, Shixia, Mujing and Muxia), recovered together with Yuanzhou in 849."}},{"c":"pass","old":"剑门关","mod":"四川剑阁","lon":105.55,"lat":32.22,"note":"金牛道上的天险，“一夫当关，万夫莫开”。","i":291,"e":{"old":"Jianmen Pass","mod":"Jiange, Sichuan","note":"A natural fortress on the Jinniu road: \"one man holding the pass can stop ten thousand\"."}},{"c":"pass","old":"瞿塘关","mod":"重庆奉节白帝城","lon":109.55,"lat":31.03,"note":"长江三峡西口，蜀东门户。","i":292,"e":{"old":"Qutang Pass","mod":"Baidicheng, Fengjie, Chongqing","note":"The western mouth of the Three Gorges, the eastern gate of Shu."}},{"c":"pass","old":"虎牢关","mod":"河南荥阳汜水","lon":113.22,"lat":34.85,"note":"洛阳东门户，扼汴洛之间的大道。","i":293,"e":{"old":"Hulao Pass","mod":"Sishui, Xingyang, Henan","note":"The eastern gate of Luoyang, commanding the main road between Bianzhou and Luoyang."}},{"c":"pass","old":"天井关","mod":"山西晋城南","lon":112.85,"lat":35.38,"note":"太行陉上的关隘，连接泽潞与河阳。","i":294,"e":{"old":"Tianjing Pass","mod":"south of Jincheng, Shanxi","note":"A pass on the Taihang Xing, linking Zelu and Heyang."}},{"c":"pass","old":"井陉口","mod":"河北井陉","lon":114.15,"lat":38.05,"note":"又称土门关，太行八陉之一，连接河东与河北（成德）。","i":295,"e":{"old":"Jingxing Pass","mod":"Jingxing, Hebei","note":"Also called Tumen Pass, one of the Eight Passes of the Taihang, linking Hedong and Hebei (Chengde)."}},{"c":"pass","old":"飞狐口","mod":"河北涞源北","lon":114.68,"lat":39.55,"note":"太行八陉之一，蔚州通往易定的孔道。","i":296,"e":{"old":"Feihu Pass","mod":"north of Laiyuan, Hebei","note":"One of the Eight Passes of the Taihang, the route from Yuzhou to Yizhou and Dingzhou."}},{"c":"pass","old":"雁门关","mod":"山西代县","lon":112.9,"lat":39.18,"note":"唐称西陉关，河东北面屏障，后为宋辽分界处。","i":297,"e":{"old":"Yanmen Pass","mod":"Dai County, Shanxi","note":"Called Xixing Pass under the Tang; the northern barrier of Hedong, and later on the Song–Liao border."}},{"c":"pass","old":"居庸关","mod":"北京昌平","lon":116.07,"lat":40.3,"note":"太行八陉之军都陉，幽州北门。","i":298,"e":{"old":"Juyong Pass","mod":"Changping, Beijing","note":"The Jundu Xing of the Eight Passes of the Taihang; the northern gate of Youzhou."}},{"c":"pass","old":"古北口","mod":"北京密云","lon":117.15,"lat":40.7,"note":"幽州东北通往奚、契丹的要道。","i":299,"e":{"old":"Gubeikou","mod":"Miyun, Beijing","note":"The main road northeast from Youzhou to the Xi and the Khitans."}},{"c":"pass","old":"松亭关","mod":"河北宽城喜峰口","lon":118.4,"lat":40.42,"note":"卢龙塞所在，平州通往奚地的要道。","i":300,"e":{"old":"Songting Pass","mod":"Xifengkou, Kuancheng, Hebei","note":"Site of the Lulong Fortress, the main road from Pingzhou into the Xi lands."}},{"c":"pass","old":"渝关","mod":"河北抚宁东","lon":119.3,"lat":39.95,"note":"又作榆关、临渝关，辽西走廊西端，五代初周德威镇幽州时失于契丹。","i":301,"e":{"old":"Yu Pass","mod":"east of Funing, Hebei","note":"Also called Linyu Pass (the Yu is also written with a different character); at the western end of the Liaoxi Corridor, lost to the Khitans early in the Five Dynasties, while Zhou Dewei governed Youzhou."}},{"c":"pass","old":"瓦桥关","mod":"河北雄县","lon":116.1,"lat":38.96,"note":"959 年周世宗收复，置雄州；与益津、淤口合称“三关”，为宋辽边界要塞。","i":302,"e":{"old":"Waqiao Pass","mod":"Xiong County, Hebei","note":"Recovered by Emperor Shizong of Later Zhou in 959, who set up Xiongzhou here; with Yijin and Yukou it formed the \"Three Passes\", key fortresses on the Song–Liao border."}},{"c":"pass","old":"益津关","mod":"河北霸州","lon":116.4,"lat":39.1,"note":"959 年收复，置霸州。","i":303,"e":{"old":"Yijin Pass","mod":"Bazhou, Hebei","note":"Recovered in 959; Bazhou was set up here."}},{"c":"pass","old":"淤口关","mod":"河北霸州信安镇","lon":116.62,"lat":38.95,"note":"三关之一。","i":304,"e":{"old":"Yukou Pass","mod":"Xin'an, Bazhou, Hebei","note":"One of the Three Passes."}},{"c":"pass","old":"大庾岭","mod":"江西大余—广东南雄","lon":114.42,"lat":25.36,"note":"五岭之一，开元年间张九龄开凿梅岭道，为岭南与中原最重要的通道。","i":305,"e":{"old":"Dayu Pass","mod":"Dayu, Jiangxi – Nanxiong, Guangdong","note":"One of the Five Ridges. In the Kaiyuan era Zhang Jiuling opened the Meiling road, the most important route between Lingnan and the Central Plains."}},{"c":"pass","old":"玉门关","mod":"甘肃瓜州东","lon":96.0,"lat":40.5,"note":"唐玉门关在瓜州晋昌城东，玄奘西行即由此出关。","i":306,"e":{"old":"Yumen Pass","mod":"east of Guazhou, Gansu","note":"The Tang Yumen Pass lay east of Jinchang City in Guazhou; Xuanzang left through it on his journey west."}},{"c":"pass","old":"阳关","mod":"甘肃敦煌西南","lon":94.07,"lat":39.93,"note":"沙州西南出西域南道之关，“西出阳关无故人”。","i":307,"e":{"old":"Yang Pass","mod":"southwest of Dunhuang, Gansu","note":"The pass southwest of Shazhou onto the Southern Route of the Western Regions: \"west of Yang Pass you will meet no old friends\"."}},{"c":"pass","old":"铁门关","mod":"新疆库尔勒北","lon":86.07,"lat":41.88,"note":"焉耆通往龟兹道上的峡谷关隘。","i":308,"e":{"old":"Tiemen Pass","mod":"north of Korla, Xinjiang","note":"A gorge pass on the road from Karasahr to Kucha."}},{"c":"pass","old":"石堡城","mod":"青海湟源西南","lon":101.1,"lat":36.55,"note":"唐蕃反复争夺的要塞，749 年哥舒翰以数万人伤亡攻拔，后复失。","i":309,"e":{"old":"Shibao Fortress","mod":"southwest of Huangyuan, Qinghai","note":"A fortress fought over again and again by Tang and Tibet. Geshu Han took it in 749 at a cost of tens of thousands of casualties; it was later lost again."}},{"c":"event","old":"范阳起兵","mod":"北京","lon":116.3,"lat":39.95,"y":755,"yt":"755 年十一月","note":"安禄山以“诛杨国忠”为名，率所部及同罗、奚、契丹、室韦兵十五万（号二十万）自范阳南下，安史之乱爆发。","i":310,"e":{"old":"Rising at Fanyang","mod":"Beijing","note":"Under the pretext of \"punishing Yang Guozhong\", An Lushan marched south from Fanyang with 150,000 men (claimed as 200,000) from his own troops and Tongra, Xi, Khitan and Shiwei soldiers. The An Lushan Rebellion had begun.","yt":"11th month, 755"}},{"c":"event","old":"马嵬驿之变","mod":"陕西兴平马嵬","lon":108.33,"lat":34.3,"y":756,"yt":"756 年六月","note":"玄宗西逃至马嵬驿，禁军哗变杀杨国忠，迫玄宗缢杀杨贵妃。太子李亨北上，玄宗入蜀。","i":311,"e":{"old":"Mawei Station incident","mod":"Mawei, Xingping, Shaanxi","note":"Fleeing west, Emperor Xuanzong reached Mawei Station, where the Palace Army mutinied, killed Yang Guozhong and forced Xuanzong to have Yang Guifei strangled. The crown prince Li Heng went north, while Xuanzong went on to Shu.","yt":"6th month, 756"}},{"c":"event","old":"灵武即位","mod":"宁夏灵武","lon":106.33,"lat":38.1,"y":756,"yt":"756 年七月","note":"太子李亨在灵武即位（肃宗），尊玄宗为太上皇，依靠朔方军平叛。","i":312,"e":{"old":"Accession at Lingwu","mod":"Lingwu, Ningxia","note":"The crown prince Li Heng took the throne at Lingwu (Emperor Suzong), honored Xuanzong as Retired Emperor, and relied on the Shuofang army to put down the rebellion.","yt":"7th month, 756"}},{"c":"event","old":"杜甫草堂","mod":"四川成都","lon":104.03,"lat":30.67,"y":759,"yt":"759—765 年","note":"杜甫流寓成都，在浣花溪畔筑草堂，写下《茅屋为秋风所破歌》《春夜喜雨》等。","y1":765,"i":313,"e":{"old":"Du Fu's Thatched Cottage","mod":"Chengdu, Sichuan","note":"Living as a refugee in Chengdu, Du Fu built a thatched cottage by the Huanhua Stream, where he wrote \"My Thatched Hut Torn by the Autumn Wind\", \"Good Rain on a Spring Night\" and other poems.","yt":"759–765"}},{"c":"event","old":"陆羽著《茶经》","mod":"浙江湖州","lon":120.0,"lat":30.9,"y":780,"yt":"约 780 年","note":"陆羽隐居湖州苕溪写成《茶经》，饮茶之风普及全国；793 年唐开始征收茶税。","i":314,"e":{"old":"Lu Yu writes The Classic of Tea","mod":"Huzhou, Zhejiang","note":"Living as a recluse by the Tiao Stream in Huzhou, Lu Yu wrote The Classic of Tea, and tea drinking spread across the country; in 793 the Tang began to tax tea.","yt":"c. 780"}},{"c":"event","old":"两税法","mod":"陕西西安","lon":108.85,"lat":34.32,"y":780,"yt":"780 年","note":"宰相杨炎推行两税法，按户等与田亩夏秋两季征税，取代租庸调制，是中国赋税制度的重大转折。","i":315,"e":{"old":"Two-Tax Law","mod":"Xi'an, Shaanxi","note":"The chief minister Yang Yan introduced the Two-Tax Law, levied in summer and autumn according to household grade and landholding, in place of the zu-yong-diao system: a major turning point in China's tax system.","yt":"780"}},{"c":"event","old":"景教碑","mod":"陕西西安","lon":108.98,"lat":34.24,"y":781,"yt":"781 年","note":"《大秦景教流行中国碑》立于长安义宁坊大秦寺，记述景教（基督教聂斯托利派）入华一百五十年的历史。","i":316,"e":{"old":"Nestorian Stele","mod":"Xi'an, Shaanxi","note":"The Stele of the Propagation of the Luminous Religion of Daqin in China stood at the Daqin Monastery in the Yining Ward of Chang'an. It records 150 years of the Luminous Religion (Nestorian Christianity) in China.","yt":"781"}},{"c":"event","old":"点苍山会盟","mod":"云南大理","lon":100.1,"lat":25.75,"y":794,"yt":"794 年正月","note":"唐使崔佐时与南诏王异牟寻盟于点苍山神祠，南诏与吐蕃决裂，重新归唐。","i":317,"e":{"old":"Treaty of Diancang","mod":"Dali, Yunnan","note":"The Tang envoy Cui Zuoshi and the Nanzhao king Yimouxun swore a covenant at the shrine on the Diancang Mountains; Nanzhao broke with Tibet and returned to Tang allegiance.","yt":"1st month, 794"}},{"c":"event","old":"永州八记","mod":"湖南永州","lon":111.62,"lat":26.4,"y":805,"yt":"805—815 年","note":"柳宗元在永贞革新失败后贬永州司马十年，写成《永州八记》《捕蛇者说》。","y1":815,"i":318,"e":{"old":"Eight Records of Yongzhou","mod":"Yongzhou, Hunan","note":"After the failure of the Yongzhen Reform, Liu Zongyuan spent ten years banished as adjutant of Yongzhou, where he wrote the Eight Records of Yongzhou and \"The Snake Catcher\".","yt":"805–815"}},{"c":"event","old":"江州司马","mod":"江西九江","lon":116.02,"lat":29.68,"y":815,"yt":"815—818 年","note":"白居易贬江州司马，作《琵琶行》，并在庐山筑草堂。","y1":818,"i":319,"e":{"old":"Adjutant of Jiangzhou","mod":"Jiujiang, Jiangxi","note":"Banished as adjutant of Jiangzhou, Bai Juyi wrote \"Song of the Pipa\" and built a thatched hall on Mount Lu.","yt":"815–818"}},{"c":"event","old":"韩愈贬潮州","mod":"广东潮州","lon":116.64,"lat":23.7,"y":819,"yt":"819 年","note":"宪宗迎法门寺佛骨入宫，韩愈上《论佛骨表》，贬潮州刺史，兴学驱鳄，当地山水后皆以“韩”为名。","i":320,"e":{"old":"Han Yu banished to Chaozhou","mod":"Chaozhou, Guangdong","note":"When Emperor Xianzong had the Buddha's bone from Famen Temple brought into the palace, Han Yu submitted his \"Memorial on the Buddha's Bone\" and was demoted to prefect of Chaozhou, where he founded schools and drove off the crocodiles; the local hills and rivers were later all named \"Han\" after him.","yt":"819"}},{"c":"event","old":"唐蕃会盟碑","mod":"西藏拉萨","lon":91.15,"lat":29.62,"y":821,"yt":"821—823 年","note":"唐与吐蕃先后在长安、逻些会盟（长庆会盟），约定“各守本境，互不侵犯”，盟文以汉、藏两种文字刻于大昭寺前。","y1":823,"i":321,"e":{"old":"Tang–Tibet Treaty Pillar","mod":"Lhasa, Tibet","note":"Tang and Tibet swore treaties first at Chang'an and then at Rasa (the Treaty of Changqing), agreeing that \"each shall keep to its own territory and neither shall invade the other\"; the text was carved in Chinese and Tibetan in front of the Jokhang Temple.","yt":"821–823"}},{"c":"event","old":"清海镇","mod":"韩国莞岛","lon":126.75,"lat":34.33,"y":828,"yt":"828 年","note":"新罗人张保皋在莞岛设清海镇，掌控黄海商路，往来于登州、楚州与日本博多。","i":322,"e":{"old":"Cheonghae Garrison","mod":"Wando, South Korea","note":"The Silla man Jang Bogo set up the Cheonghae Garrison on Wando, controlling the Yellow Sea trade route and sailing between Dengzhou, Chuzhou and Hakata in Japan.","yt":"828"}},{"c":"event","old":"维州受降","mod":"四川理县","lon":103.3,"lat":31.58,"y":831,"yt":"831 年","note":"吐蕃维州副使悉怛谋以城降西川节度使李德裕，宰相牛僧孺以盟约为由令其归还，悉怛谋等被吐蕃杀害，成为牛李党争的著名公案。","i":323,"e":{"old":"Surrender of Weizhou","mod":"Li County, Sichuan","note":"Xidamou, the Tibetan deputy commander at Weizhou, surrendered the city to Li Deyu, military governor of Xichuan; the chief minister Niu Sengru ordered it returned on the grounds of the treaty, and Xidamou and his men were killed by the Tibetans. It became a famous case in the factional struggle between Niu and Li.","yt":"831"}},{"c":"event","old":"甘露之变","mod":"陕西西安","lon":108.9,"lat":34.2,"y":835,"yt":"835 年十一月","note":"文宗与李训、郑注谋诛宦官，以观“甘露”为名诱仇士良，事泄，宦官率神策军屠杀朝官、吏卒及百姓一千余人，此后宦官更加专横。","i":324,"e":{"old":"Sweet Dew Incident","mod":"Xi'an, Shaanxi","note":"Emperor Wenzong plotted with Li Xun and Zheng Zhu to kill the eunuchs, luring Qiu Shiliang with the pretext of viewing \"sweet dew\"; the plot leaked, and the eunuchs led the Shence Army in slaughtering more than a thousand court officials, clerks, guards and townspeople. After this the eunuchs were more overbearing than ever.","yt":"11th month, 835"}},{"c":"event","old":"圆仁入唐","mod":"江苏淮安","lon":119.22,"lat":33.45,"y":838,"yt":"838—847 年","note":"日本僧圆仁随最后一次遣唐使入唐，巡礼五台山、长安，亲历会昌灭佛，借楚州、登州新罗侨民之助归国，著《入唐求法巡礼行记》。","y1":847,"i":325,"e":{"old":"Ennin in Tang China","mod":"Huai'an, Jiangsu","note":"The Japanese monk Ennin came to Tang China with the last Japanese embassy to the Tang, made pilgrimages to Mount Wutai and Chang'an, lived through the Huichang persecution of Buddhism, and returned home with the help of the Silla communities in Chuzhou and Dengzhou. He wrote the Record of a Pilgrimage to China in Search of the Law.","yt":"838–847"}},{"c":"event","old":"会昌灭佛","mod":"山西五台山","lon":113.58,"lat":39.03,"y":845,"yt":"845 年","note":"武宗下令拆毁寺院四千六百余所，还俗僧尼二十六万余人。五台山为当时佛教圣地，圆仁五年前曾来此巡礼。","i":326,"e":{"old":"Huichang persecution of Buddhism","mod":"Mount Wutai, Shanxi","note":"Emperor Wuzong ordered more than 4,600 monasteries destroyed and more than 260,000 monks and nuns returned to lay life. Mount Wutai was then a holy place of Buddhism; Ennin had made a pilgrimage there five years earlier.","yt":"845"}},{"c":"event","old":"裘甫起事","mod":"浙江嵊州","lon":120.82,"lat":29.6,"y":859,"yt":"859—860 年","note":"浙东裘甫起事，众至三万，为王式所平，揭开唐末民变序幕。","y1":860,"i":327,"e":{"old":"Qiu Fu rising","mod":"Shengzhou, Zhejiang","note":"Qiu Fu rose in Zhedong with up to 30,000 followers and was put down by Wang Shi; it was the prelude to the popular risings of the late Tang.","yt":"859–860"}},{"c":"event","old":"《金刚经》刻本","mod":"甘肃敦煌莫高窟","lon":94.8,"lat":40.04,"y":868,"yt":"868 年","note":"敦煌藏经洞所出咸通九年刻本《金刚经》，是现存最早有确切纪年的雕版印刷品。藏经洞约于 11 世纪初封闭，1900 年发现，出土文书五万余件。","i":328,"e":{"old":"Printed Diamond Sutra","mod":"Mogao Caves, Dunhuang, Gansu","note":"The Diamond Sutra printed in Xiantong 9 (868), found in the Dunhuang Library Cave, is the earliest surviving woodblock print with a precise date. The cave was sealed around the early 11th century and discovered in 1900; it yielded more than 50,000 documents.","yt":"868"}},{"c":"event","old":"法门寺地宫","mod":"陕西扶风","lon":107.9,"lat":34.43,"y":874,"yt":"874 年","note":"懿宗迎奉佛指舍利后，僖宗于 874 年封闭地宫；1987 年发掘出唐代宫廷金银器、秘色瓷等珍品。","i":329,"e":{"old":"Famen Temple crypt","mod":"Fufeng, Shaanxi","note":"After Emperor Yizong had the Buddha's finger relic brought to the court, Emperor Xizong sealed the crypt in 874; its excavation in 1987 uncovered Tang palace gold and silver ware, \"secret-color\" porcelain and other treasures.","yt":"874"}},{"c":"event","old":"黄巢起事","mod":"山东菏泽西南（冤句）","lon":115.4,"lat":35.22,"y":874,"yt":"874—875 年","note":"王仙芝在长垣、黄巢在冤句起事，饥民响应，转战山东、河南、淮南。","y1":875,"i":330,"e":{"old":"Huang Chao rises","mod":"southwest of Heze, Shandong (Yuanqu)","note":"Wang Xianzhi rose at Changyuan and Huang Chao at Yuanqu; starving people joined them, and they fought their way across Shandong, Henan and Huainan.","yt":"874–875"}},{"c":"event","old":"长沙窑","mod":"湖南长沙铜官","lon":112.85,"lat":28.43,"y":800,"yt":"9 世纪","note":"长沙窑首创釉下彩，产品经扬州、广州远销西亚与东南亚，“黑石号”沉船出水五万余件。","y1":900,"i":331,"e":{"old":"Changsha kilns","mod":"Tongguan, Changsha, Hunan","note":"The Changsha kilns pioneered underglaze painting; their wares were shipped through Yangzhou and Guangzhou to West Asia and Southeast Asia, and more than 50,000 pieces were recovered from the Batu Hitam (Belitung) shipwreck.","yt":"9th century"}},{"c":"event","old":"越窑秘色瓷","mod":"浙江慈溪上林湖","lon":121.18,"lat":30.15,"y":800,"yt":"9—10 世纪","note":"越窑青瓷“类玉类冰”，晚唐称“秘色”，吴越钱氏用以进贡；法门寺地宫出土十四件。","y1":978,"i":332,"e":{"old":"Yue ware “secret-color” porcelain","mod":"Shanglin Lake, Cixi, Zhejiang","note":"Yue ware celadon was \"like jade, like ice\"; in the late Tang it was called \"secret color\", and the Qian family of Wuyue sent it as tribute. Fourteen pieces were found in the crypt of Famen Temple.","yt":"9th–10th centuries"}},{"c":"event","old":"邢窑白瓷","mod":"河北内丘","lon":114.52,"lat":37.28,"y":755,"yt":"唐","note":"邢窑白瓷“类银类雪”，与越窑并称“南青北白”。","y1":907,"i":333,"e":{"old":"Xing ware white porcelain","mod":"Neiqiu, Hebei","note":"Xing ware white porcelain was \"like silver, like snow\"; together with Yue ware it made up \"celadon in the south, white in the north\".","yt":"Tang"}},{"c":"event","old":"长安毁城","mod":"陕西西安","lon":109.0,"lat":34.33,"y":904,"yt":"904 年正月","note":"朱全忠逼昭宗迁都洛阳，拆毁长安宫室民宅，木料顺渭水、黄河漂往洛阳，长安自此不复为都。","i":334,"e":{"old":"Destruction of Chang'an","mod":"Xi'an, Shaanxi","note":"Zhu Quanzhong forced Emperor Zhaozong to move the capital to Luoyang and pulled down the palaces and houses of Chang'an, floating the timber down the Wei and Yellow rivers to Luoyang. Chang'an was never a capital again.","yt":"1st month, 904"}},{"c":"event","old":"白马驿之祸","mod":"河南滑县","lon":114.62,"lat":35.62,"y":905,"yt":"905 年六月","note":"朱全忠在白马驿杀裴枢等朝官三十余人，投尸黄河，以示“清流”变“浊流”。","i":335,"e":{"old":"Baima Station massacre","mod":"Hua County, Henan","note":"At Baima Station Zhu Quanzhong killed Pei Shu and more than thirty other court officials and threw their bodies into the Yellow River, to turn the \"pure stream\" into a \"muddy stream\".","yt":"6th month, 905"}},{"c":"event","old":"捍海石塘","mod":"浙江杭州","lon":120.2,"lat":30.2,"y":910,"yt":"910 年","note":"钱镠以竹笼装石筑捍海塘，保护杭州城与农田（“钱王射潮”传说）。","i":336,"e":{"old":"Stone seawall","mod":"Hangzhou, Zhejiang","note":"Qian Liu built a seawall of stones packed in bamboo cages to protect the city of Hangzhou and its farmland (the legend of \"King Qian shooting the tide\").","yt":"910"}},{"c":"event","old":"契丹大字","mod":"内蒙古巴林左旗","lon":119.42,"lat":44.0,"y":920,"yt":"920 年","note":"耶律阿保机命人参照汉字创制契丹大字，稍后耶律迭剌创契丹小字。","i":337,"e":{"old":"Khitan large script","mod":"Bairin Left Banner, Inner Mongolia","note":"Yelü Abaoji had the Khitan large script created on the model of Chinese characters; a little later Yelü Diela created the Khitan small script.","yt":"920"}},{"c":"event","old":"冯道刻九经","mod":"河南洛阳","lon":112.48,"lat":34.65,"y":932,"yt":"932—953 年","note":"后唐宰相冯道奏请依唐开成石经刻印《九经》，历四朝二十二年完成，开儒家经典大规模雕版印刷之先。","y1":953,"i":338,"e":{"old":"Feng Dao prints the Nine Classics","mod":"Luoyang, Henan","note":"Feng Dao, chief minister of Later Tang, asked for the Nine Classics to be printed from the text of the Tang Kaicheng Stone Classics; the work took twenty-two years under four dynasties and began the large-scale woodblock printing of the Confucian classics.","yt":"932–953"}},{"c":"event","old":"《花间集》","mod":"四川成都","lon":104.09,"lat":30.69,"y":940,"yt":"940 年","note":"后蜀赵崇祚编成《花间集》，为最早的文人词总集；后蜀宰相毋昭裔出资刻印《九经》等书。","i":339,"e":{"old":"Among the Flowers","mod":"Chengdu, Sichuan","note":"Zhao Chongzuo of Later Shu compiled Among the Flowers, the earliest anthology of ci lyrics by literati; the Later Shu chief minister Wu Zhaoyi paid to have the Nine Classics and other books printed.","yt":"940"}},{"c":"event","old":"梁山泊","mod":"山东梁山","lon":116.1,"lat":35.8,"y":944,"yt":"944 年","note":"黄河在滑州决口，漫流汴、曹、单、濮、郓五州，环梁山汇成大泽，即梁山泊。","i":340,"e":{"old":"Liangshan Marsh","mod":"Liangshan, Shandong","note":"The Yellow River broke its banks at Huazhou and flooded the five prefectures of Kaifeng, Caozhou, Shanzhou, Puzhou and Yunzhou, gathering around Mount Liang into a great marsh: Liangshan Marsh.","yt":"944"}},{"c":"event","old":"陈桥兵变","mod":"河南封丘陈桥","lon":114.42,"lat":34.97,"y":960,"yt":"960 年正月","note":"赵匡胤奉命北御辽与北汉，行至陈桥驿，部下以黄袍加身，回师开封，后周恭帝禅位，宋朝建立。","i":341,"e":{"old":"Chenqiao mutiny","mod":"Chenqiao, Fengqiu, Henan","note":"Sent north to resist Liao and Northern Han, Zhao Kuangyin reached Chenqiao Station, where his men draped a yellow robe on him; he led the army back to Kaifeng, Emperor Gong of Later Zhou abdicated in his favor, and the Song dynasty was founded.","yt":"1st month, 960"}},{"c":"people","old":"沙陀","mod":"","lon":89.6,"lat":44.7,"y0":755,"y1":808,"note":"西突厥别部，原居北庭金满州一带，808 年率众东迁投唐。","i":342,"e":{"old":"Shatuo","note":"A branch of the Western Turks, originally living around Jinman Zhou near Beiting; in 808 they led their people east and submitted to the Tang."}},{"c":"people","old":"沙陀","mod":"","lon":112.6,"lat":39.75,"y0":808,"y1":950,"note":"808 年东迁后安置于盐州，后迁代北（今山西北部神武川一带）。首领朱邪赤心赐名李国昌，其子李克用建河东霸业；后唐、后晋、后汉皆出自沙陀。","i":343,"e":{"old":"Shatuo","note":"After moving east in 808 they were settled at Yanzhou, then moved to Daibei (around Shenwuchuan in today's northern Shanxi). Their chief Zhuye Chixin was given the name Li Guochang; his son Li Keyong built up his dominance in Hedong. The Later Tang, Later Jin and Later Han all came from the Shatuo."}},{"c":"people","old":"党项","mod":"","lon":108.3,"lat":38.4,"y0":755,"y1":979,"note":"原居青海、川西北的羌人部族，受吐蕃挤压内迁庆州、夏州、银州一带，分为平夏部、东山部等。平夏部拓跋氏后建西夏。","i":344,"e":{"old":"Tanguts","note":"A Qiang people originally living in Qinghai and northwestern Sichuan. Pressed by Tibet, they moved into the area of Qingzhou, Xiazhou and Yinzhou and divided into the Pingxia, Dongshan and other groups. The Tuoba clan of the Pingxia group later founded Western Xia."}},{"c":"people","old":"退浑","mod":"","lon":112.7,"lat":40.55,"y0":800,"y1":979,"note":"即吐谷浑。663 年亡国后部众内迁，晚唐散居代北、河东，与沙陀、鞑靼杂处。","i":345,"e":{"old":"Tuihun","note":"That is, the Tuyuhun. After their state fell in 663 their people moved into Tang territory; in the late Tang they lived scattered across Daibei and Hedong, mixed with the Shatuo and the Tatars."}},{"c":"people","old":"吐谷浑","mod":"","lon":98.2,"lat":36.0,"y0":755,"y1":842,"note":"663 年后吐谷浑故地为吐蕃所并，部众成为吐蕃属部。","i":346,"e":{"old":"Tuyuhun","note":"After 663 the Tuyuhun lands were annexed by Tibet, and their people became Tibetan subjects."}},{"c":"people","old":"鞑靼","mod":"","lon":110.8,"lat":42.0,"y0":840,"y1":979,"note":"原为突厥、回鹘统治下的室韦—鞑靼诸部，回鹘亡后南下阴山一带。880 年李克用兵败曾投奔鞑靼。","i":347,"e":{"old":"Tatars","note":"Originally the Shiwei–Tatar tribes under Turkic and Uyghur rule; after the fall of the Uyghurs they moved south into the Yin Mountains. Li Keyong took refuge with the Tatars after his defeat in 880."}},{"c":"people","old":"嗢末","mod":"","lon":102.9,"lat":37.45,"y0":861,"y1":910,"note":"吐蕃统治河陇时的奴部，吐蕃崩溃后于 861 年前后起事，聚居凉州一带。","i":348,"e":{"old":"Wamo","note":"The bonded tribes of the Tibetans during their rule of Hexi and Longyou. After Tibet collapsed they rose around 861 and gathered around Liangzhou."}},{"c":"people","old":"仲云","mod":"","lon":90.3,"lat":39.6,"y0":880,"y1":979,"note":"南山（阿尔金山）一带部族，自称小月氏遗种，与归义军时战时和。","i":349,"e":{"old":"Zhongyun","note":"A tribe of the Southern Mountains (Altyn-Tagh) who called themselves descendants of the Lesser Yuezhi; they fought and made peace with Guiyi Jun by turns."}},{"c":"people","old":"蒙兀室韦","mod":"","lon":120.3,"lat":51.2,"y0":755,"y1":979,"note":"居望建河（额尔古纳河）东，蒙古部的先祖。","i":350,"e":{"old":"Mengwu Shiwei","note":"Lived east of the Wangjian River (Argun); ancestors of the Mongols."}},{"c":"people","old":"骨利干","mod":"","lon":106.5,"lat":52.6,"y0":755,"y1":979,"note":"居北海（贝加尔湖）北，产良马，以“昼长夜短”闻名。","i":351,"e":{"old":"Quriqan","note":"Lived north of the Northern Sea (Lake Baikal); they bred fine horses and were known for their \"long days and short nights\"."}},{"c":"people","old":"东女国","mod":"","lon":101.8,"lat":30.9,"y0":755,"y1":800,"note":"川西高原以女王为首的部族，793 年附唐。","i":352,"e":{"old":"Eastern Women's Kingdom","note":"A people of the western Sichuan plateau ruled by a queen; they submitted to the Tang in 793."}},{"c":"people","old":"两林蛮","mod":"","lon":102.8,"lat":28.85,"y0":755,"y1":979,"note":"大渡河以南的部族（东蛮），依违于唐、南诏之间。","i":353,"e":{"old":"Lianglin tribes","note":"A people south of the Dadu River (the Eastern tribes) who wavered between Tang and Nanzhao."}},{"c":"people","old":"牂牁蛮","mod":"","lon":106.9,"lat":26.6,"y0":755,"y1":979,"note":"今贵州中部部族，唐设羁縻州，常遣使朝贡。","i":354,"e":{"old":"Zangke tribes","note":"A people of today's central Guizhou; the Tang set up loose-rein prefectures for them, and they often sent tribute missions."}},{"c":"people","old":"溪洞诸蛮","mod":"","lon":109.4,"lat":28.55,"y0":755,"y1":979,"note":"五溪地区（今湘西、黔东）的部族。五代时溪州彭氏崛起，939—940 年与楚战于溪州，940 年立铜柱为盟。","i":355,"e":{"old":"Xidong tribes","note":"The peoples of the Five Streams region (today's western Hunan and eastern Guizhou). In the Five Dynasties the Peng family of Xizhou rose to power; it fought Chu at Xizhou in 939–940, and in 940 a bronze pillar was set up to seal the peace."}},{"c":"people","old":"黄洞蛮","mod":"","lon":107.2,"lat":22.4,"y0":755,"y1":979,"note":"邕州西南黄氏、侬氏等部，唐后期屡次起事，宋代侬智高即出于此。","i":356,"e":{"old":"Huangdong tribes","note":"The Huang, Nong and other clans southwest of Yongzhou, who rose repeatedly in the later Tang; Nong Zhigao of the Song came from them."}},{"c":"people","old":"黎","mod":"","lon":109.6,"lat":19.05,"y0":755,"y1":979,"note":"海南岛中部的俚、黎部族。","i":357,"e":{"old":"Li people","note":"The Li peoples (俚 and 黎) of central Hainan."}},{"c":"people","old":"乌蛮","mod":"","lon":104.4,"lat":26.5,"y0":755,"y1":979,"note":"南诏东境的乌蛮诸部（今滇东北、黔西）。","i":358,"e":{"old":"Wuman","note":"The Wuman tribes on the eastern border of Nanzhao (today's northeastern Yunnan and western Guizhou)."}},{"c":"people","old":"样磨","mod":"","lon":79.5,"lat":41.4,"y0":840,"y1":979,"note":"喀喇汗王朝的组成部族之一。","i":359,"e":{"old":"Yaghma","note":"One of the tribes that made up the Kara-Khanid Khanate."}},{"c":"region","old":"燕云十六州","mod":"今北京、天津北部、河北北部、山西北部","note":"936 年河东节度使石敬瑭起兵反后唐，向契丹求援，许以“割卢龙一道及雁门关以北诸州”，并称臣、称儿皇帝；938 年（后晋天福三年）正式交割。\n山前七州（太行山北支东南）：幽（今北京）、蓟（天津蓟州）、瀛（河北河间）、莫（河北任丘）、涿（河北涿州）、檀（北京密云）、顺（北京顺义）。\n山后九州（山之西北）：新（河北涿鹿）、妫（河北怀来）、儒（北京延庆）、武（河北张家口宣化）、云（山西大同）、应（山西应县）、寰（山西朔州东）、朔（山西朔州）、蔚（河北蔚县）。\n中原由此失去燕山、长城与雁门一线的屏障，契丹骑兵可直下华北平原。辽以幽州为南京幽都府（938），后又以云州为西京（1044）。\n959 年周世宗北伐，收复瀛、莫二州及瓦桥、益津、淤口三关，置雄州、霸州；979 年宋太宗高梁河之战失利，终北宋之世未能真正收复其余诸州（1123 年曾自金赎回燕京等地，1125 年复失）。\n寰州为后唐天成元年（926）所置，治寰清县，入辽后撤销。","y0":938,"members":[170,172,166,167,171,173,174,177,175,176,178,192,193,191,190,194],"anc":[114.88,40.86],"lab":[114.88,40.86,14.03,1.   /* ---------------- 渲染 ---------------- */
  const tip = document.getElementById("tip");
  function render() {

      const prev = capAt.get(key);

    }
    const capSeed = new Set();
    for (const { it, act } of capAt.values()) if (act && it.at != null) capSeed.add(it.at);
    const seatSeed = new Map();
    for (const [u, s] of Object.entries(sn.seat)) if (!capSeed.has(s)) seatSeed.set(s, +u);

    const pts = [];
    if (layerOn.pref) for (let s = 0; s < SEEDS.length; s++) {
      const S = SEEDS[s];

      const k = keyOf("s", s);

    }
    for (const it of ITEMS) {
      if (it.lon == null || !["capital", "battle", "pass", "event"].includes(it.c)) continue;
      if (!layerOn[it.c]) continue;
      const k = keyOf("i", it.i);
      if (!match(k)) continue;
      if (it.c === "capital") {
        const c = capAt.get(it.lon + "," + it.lat);
        if (!c || c.it !== it) { if (!isOn(k)) continue; pts.push({ kind: "capital", k, xy: it.xy, ord: 1, it, act: false, u: it.st, fut: true }); continue; }
        pts.push({ kind: "capital", k, xy: it.xy, ord: c.act ? 6 : 1, it, act: c.act, u: it.st }); continue;
      }

      `${YY} · ${np} state${np === 1 ? "" : "s"}${nz ? " · " + nz + " fanzhen" : ""} · ${nShown} in view`);
  }

  /* ---------------- 比例尺 ---------------- */
  function inv(px, py) {

  }

  /* ---------------- 索引图 ---------------- */
