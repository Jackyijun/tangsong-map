 Later Zhou in 959"}]}],"ext":[72.0,136.0,15.5,55.0],"first":820};
  const DATA = {"units":[{"k":"唐","n":"唐","kind":"state","note":"李唐王朝（618–907）。都长安（上都/西京），以洛阳为东都，太原为北都；安史之乱中肃宗以凤翔为西京、成都为南京（757–760）。\n中晚唐的主线：安史之乱（755–763）后河朔三镇割据，吐蕃夺取河陇；德宗削藩引发建中之乱（781–786）；宪宗“元和中兴”（806–820）一度令藩镇尽遵朝命；穆宗以后河朔复叛，宦官专权、牛李党争；宣宗大中年间收复河湟（849–851）。\n懿宗、僖宗时庞勋、王仙芝、黄巢相继起事，880 年黄巢入长安；此后朝廷号令不出关中，朱全忠、李克用、李茂贞、杨行密等割据称雄。\n天祐四年（907）哀帝禅位于朱全忠，唐亡。","ne":"Tang","notee":"The Li family's Tang dynasty (618–907). Its capital was Chang'an (the Upper Capital, or Western Capital), with Luoyang as the Eastern Capital and Taiyuan as the Northern Capital; during the An Lushan Rebellion Emperor Suzong made Fengxiang the Western Capital and Chengdu the Southern Capital (757–760).\nThe main thread of the mid and late Tang: after the An Lushan Rebellion (755–763) the three Hebei fanzhen became autonomous and Tibet seized Hexi and Longyou; Emperor Dezong's attempt to curb the fanzhen set off the Jianzhong rebellions (781–786); Emperor Xianzong's \"Yuanhe Restoration\" (806–820) for a time brought every fanzhen to obey the court; from Emperor Muzong on, Hebei rebelled again, eunuchs dominated the court and the Niu–Li factions fought; in the Dazhong era Emperor Xuanzong recovered Hehuang (849–851).\nUnder Emperors Yizong and Xizong, Pang Xun, Wang Xianzhi and Huang Chao rose one after another, and in 880 Huang Chao entered Chang'an; from then on the court's orders did not reach beyond Guanzhong, while Zhu Quanzhong, Li Keyong, Li Maozhen, Yang Xingmi and others carved out territories of their own.\nIn Tianyou 4 (907) Emperor Ai abdicated in favor of Zhu Quanzhong, and the Tang came to an end."},{"k":"燕·安史","n":"燕（安史）","kind":"state","note":"安禄山 755 年十一月以“讨杨国忠”为名自范阳起兵，756 年正月在洛阳称大燕皇帝，六月破潼关、入长安。757 年正月安庆绪弑父；同年唐军借回纥兵收复两京，庆绪退守相州（邺）。759 年史思明杀安庆绪，复称大燕皇帝，再陷洛阳；761 年史朝义弑父；763 年正月史朝义兵败自缢，安史之乱八年而平。","ne":"Yan (An Lushan and Shi Siming)","se":"Yan","notee":"In the 11th month of 755 An Lushan rose at Fanyang, ostensibly \"to punish Yang Guozhong\"; in the 1st month of 756 he proclaimed himself emperor of Great Yan at Luoyang, and in the 6th month he broke through Tong Pass and entered Chang'an. In the 1st month of 757 An Qingxu murdered his father; the same year the Tang army, with Uyghur troops, recovered the two capitals, and An Qingxu fell back to hold Xiangzhou (Ye). In 759 Shi Siming killed An Qingxu, proclaimed himself emperor of Great Yan in turn, and took Luoyang again; in 761 Shi Chaoyi murdered his father; in the 1st month of 763 Shi Chaoyi was defeated and hanged himself, and the An Lushan Rebellion ended after eight years."},{"k":"吐蕃","n":"吐蕃","kind":"state","note":"雅隆悉补野王朝建立的高原帝国，都逻些（拉萨）。8 世纪后半至 9 世纪前期国势极盛：763 年攻入长安，764–786 年尽取河西、陇右，790 年陷北庭，此后据有安西四镇南道，势力东至陇山、南及南诏、西抵葱岭以西。\n赤松德赞（755–797）时兴佛法；821–822 年与唐长庆会盟，823 年立“唐蕃会盟碑”于拉萨大昭寺前。842 年赞普朗达玛遇刺，王室分裂，帝国瓦解。","ne":"Tibetan Empire","se":"Tibet","notee":"The plateau empire founded by the Pugyal dynasty of Yarlung, with its capital at Rasa (Lhasa). It was at its height from the late 8th to the early 9th century: it broke into Chang'an in 763, took all of Hexi and Longyou in 764–786, captured Beiting in 790, and thereafter held the southern route of the Four Garrisons of Anxi; its power reached the Long Mountains in the east, Nanzhao in the south and beyond the Pamirs in the west.\nTrisong Detsen (755–797) promoted Buddhism; in 821–822 Tibet and Tang made the Treaty of Changqing, and in 823 the Tang–Tibet Treaty Pillar was set up in front of the Jokhang Temple in Lhasa. In 842 the tsenpo Langdarma was assassinated, the royal house split, and the empire broke up."},{"k":"吐蕃诸部","n":"吐蕃诸部","kind":"state","note":"842 年后吐蕃王朝分裂，王系分为永丹、欧松两支，各地豪族与边将（论恐热、尚婢婢等）相攻，河陇、青海的吐蕃部众散为众多部落，史称“吐蕃诸部”。其中凉州一带的嗢末、六谷部，青唐（西宁）一带的部落，后来分别形成西凉府折逋氏政权与宋代的唃厮啰政权。","ne":"Tibetan tribes","notee":"After 842 the Tibetan Empire split, the royal line dividing into the Yongdan and Ousong branches, while local magnates and frontier generals (Lun Kongre, Shang Bibi and others) fought one another; the Tibetan population of Hexi, Longyou and Qinghai scattered into many tribes, known to history as the \"Tibetan tribes\". Of these, the Wamo and the Liugu tribes around Liangzhou and the tribes around Qingtang (Xining) later became, respectively, the Zhebu clan's regime at Xiliang Fu and the Gusiluo regime of Song times."},{"k":"回鹘","n":"回鹘","kind":"state","note":"744 年骨力裴罗灭后突厥建立回纥汗国，牙帐设于鄂尔浑河畔的斡耳朵八里（今蒙古哈拉巴拉嘎斯）。757 年出兵助唐收复两京，此后长期与唐和亲、绢马互市。788 年改称“回鹘”。790 年代与吐蕃争夺北庭、西州。\n840 年遭黠戛斯攻破牙帐，汗国崩溃，部众分三支西迁：一支入河西（甘州回鹘），一支入天山东部（西州/高昌回鹘），一支投葛逻禄。","ne":"Uyghur Khaganate","se":"Uyghurs","notee":"In 744 Guli Peiluo destroyed the Second Turkic Khaganate and founded the Uyghur Khaganate, with its royal camp at Ordu-Baliq on the Orkhon River (today's Kharbalgas, Mongolia). In 757 it sent troops to help Tang recover the two capitals, and for a long time afterwards it made marriage alliances with Tang and traded horses for silk. In 788 its Chinese name was changed to Huihu. In the 790s it fought Tibet for Beiting and Xizhou.\nIn 840 the Yenisei Kyrgyz sacked its royal camp and the khaganate collapsed; its people moved west in three branches: one into Hexi (the Ganzhou Uyghurs), one into the eastern Tian Shan (the Xizhou or Qocho Uyghurs), and one to the Karluks."},{"k":"黠戛斯","n":"黠戛斯","kind":"state","note":"居剑河（叶尼塞河上游）的突厥语部族，即汉代坚昆、明清吉尔吉斯人先祖。840 年攻灭回鹘汗国，一度据有漠北，遣使入唐求册封（843）。10 世纪初势力退回叶尼塞河流域，漠北为阻卜（鞑靼）诸部所据。","ne":"Yenisei Kyrgyz","se":"Kyrgyz","notee":"A Turkic-speaking people on the Kem River (the upper Yenisei), the Jiankun of Han times and the ancestors of the Kyrgyz of the Ming and Qing. In 840 they destroyed the Uyghur Khaganate and for a time held the lands north of the Gobi, sending envoys to Tang to seek investiture (843). In the early 10th century their power fell back to the Yenisei basin, and the lands north of the Gobi passed to the Zubu (Tatar) tribes."},{"k":"葛逻禄","n":"葛逻禄","kind":"state","note":"西突厥别部，原居金山（阿尔泰山）西南。751 年怛逻斯之战阵前倒戈，致高仙芝唐军大败。766 年后南迁碎叶、怛逻斯一带，取代突骑施成为七河地区主人；9–10 世纪与样磨等部共同构成喀喇汗王朝的主体。","ne":"Karluks","notee":"A branch of the Western Turks, originally living southwest of the Altai Mountains. At the Battle of Talas in 751 they changed sides in the middle of the fighting, causing Gao Xianzhi's Tang army to be routed. After 766 they moved south to the area of Suyab and Talas and replaced the Türgesh as masters of Semirechye; in the 9th–10th centuries they and the Yaghma and other tribes formed the core of the Kara-Khanid Khanate."},{"k":"突骑施","n":"突骑施","kind":"state","note":"西突厥别部，8 世纪前期雄踞七河地区（碎叶、怛逻斯）。738 年苏禄可汗死后内乱，部众衰散；8 世纪 50–60 年代为葛逻禄取代。","ne":"Türgesh","notee":"A branch of the Western Turks that dominated Semirechye (Suyab, Talas) in the early 8th century. After the death of Suluk Khagan in 738 it fell into civil war and its people dispersed; in the 750s–760s it was replaced by the Karluks."},{"k":"南诏","n":"南诏","kind":"state","note":"蒙舍诏统一洱海六诏后建立（738 年唐册封皮逻阁为云南王），都太和城，779 年迁阳苴咩城（今大理古城）。751、754 年两败唐军（天宝战争），附吐蕃；794 年异牟寻与唐使崔佐时盟于点苍山，归唐抗蕃。\n9 世纪劝丰祐、世隆时国势强盛：829 年攻成都，832 年破骠国，858–866 年数陷安南，869–870 年围成都。902 年权臣郑买嗣篡位，南诏亡。","ne":"Nanzhao","notee":"Founded after the Mengshe zhao united the six zhao around Erhai Lake (Tang invested Piluoge as Prince of Yunnan in 738), with its capital at Taihe City; in 779 it moved to Yangjumie City (the old town of Dali). It defeated Tang armies twice, in 751 and 754 (the Tianbao wars), and became a dependent of Tibet; in 794 Yimouxun made a treaty with the Tang envoy Cui Zuoshi at the Diancang Mountains, returning to Tang allegiance against Tibet.\nIn the 9th century, under Quanfengyou and Shilong, the kingdom was powerful: it attacked Chengdu in 829, crushed Pyu in 832, took Annan several times in 858–866, and besieged Chengdu in 869–870. In 902 the powerful minister Zheng Maisi usurped the throne, and Nanzhao came to an end."},{"k":"大长和","n":"大长和","kind":"state","note":"902 年南诏清平官郑买嗣杀南诏王舜化贞，建大长和国。928 年剑川节度使杨干贞立赵善政为帝，改国号大天兴；929 年杨干贞自立，改大义宁。937 年段思平灭大义宁，建大理国。","ne":"Dachanghe","notee":"In 902 Zheng Maisi, chief minister of Nanzhao, killed the Nanzhao king Shunhuazhen and founded the kingdom of Dachanghe. In 928 Yang Ganzhen, military governor of Jianchuan, made Zhao Shanzheng emperor and renamed the state Datianxing; in 929 Yang Ganzhen took the throne himself and renamed it Dayining. In 937 Duan Siping destroyed Dayining and founded the Dali Kingdom."},{"k":"大理","n":"大理","kind":"state","note":"937 年通海节度使段思平联合东方三十七部灭大义宁，建大理国，都羊苴咩城（今大理古城）。崇佛，相传宋太祖以玉斧划大渡河为界（“宋挥玉斧”），至 1253 年为蒙古所灭。","ne":"Dali Kingdom","se":"Dali","notee":"In 937 Duan Siping, military governor of Tonghai, allied with the thirty-seven eastern tribes, destroyed Dayining and founded the Dali Kingdom, with its capital at Yangjumie City (the old town of Dali). It revered Buddhism; according to tradition, Emperor Taizu of Song drew the border along the Dadu River with a jade axe (\"the Song waves the jade axe\"). It was destroyed by the Mongols in 1253."},{"k":"渤海","n":"渤海","kind":"state","note":"698 年粟末靺鞨首领大祚荣建国（初称震国），713 年唐册封渤海郡王。设五京十五府六十二州，上京龙泉府（今宁安渤海镇）仿长安规划。9 世纪大仁秀、大彝震时称“海东盛国”。926 年为契丹所灭，改为东丹国。","ne":"Balhae","notee":"Founded in 698 by Dae Joyeong, a chief of the Sumo Mohe; it was first called Jin. In 713 Tang invested him as Commandery Prince of Bohai. It had five capitals, fifteen fu and sixty-two prefectures; its Supreme Capital, Longquan Fu (today's Bohai Town, Ning'an), was laid out on the model of Chang'an. In the 9th century, under Dae Insu and Dae Ijin, it was called \"the flourishing land east of the sea\". In 926 it was destroyed by the Khitan and turned into the Dongdan kingdom."},{"k":"东丹","n":"东丹","kind":"state","note":"926 年契丹灭渤海后所建附属国，以太子耶律倍为人皇王，都忽汗城（渤海上京）。928 年迁民于辽东，以东平（辽阳）为南京；930 年耶律倍浮海投后唐。东丹名存实亡，982 年废其中台省。","ne":"Dongdan","notee":"A dependent state set up by the Khitan after they destroyed Balhae in 926, with the crown prince Yelü Bei as Renhuang Wang (King of Men) and its capital at Huhan City (the Balhae Supreme Capital). In 928 its people were moved to Liaodong, with Dongping (Liaoyang) as the Southern Capital; in 930 Yelü Bei crossed the sea and went over to the Later Tang. Dongdan survived in name only, and its Central Secretariat was abolished in 982."},{"k":"契丹","n":"契丹","kind":"state","note":"游牧于潢水（西拉木伦河）、土河（老哈河）流域，唐初（648）设松漠都督府羁縻。遥辇氏八部联盟时期屡与唐、奚、回鹘交战。907 年迭剌部耶律阿保机即可汗位，916 年称帝，918 年建皇都（上京临潢府），924 年西征漠北，926 年灭渤海。\n936 年助石敬瑭灭后唐，938 年得燕云十六州。947 年耶律德光入开封灭后晋，改国号大辽。979 年高梁河之战大败宋军。","ne":"Khitan","notee":"Nomads of the Huang River (Xar Moron) and Tu River (Laoha River) basins; in the early Tang (648) they were held on a loose rein through the Songmo Area Command. In the period of the eight-tribe confederation under the Yaonian clan they repeatedly fought Tang, the Xi and the Uyghurs. In 907 Yelü Abaoji of the Yila tribe became khagan; he proclaimed himself emperor in 916, built Huangdu (the Supreme Capital, Linhuang Fu) in 918, campaigned west across the lands north of the Gobi in 924, and destroyed Balhae in 926.\nIn 936 the Khitan helped Shi Jingtang destroy the Later Tang, and in 938 they acquired the Sixteen Prefectures of Yan and Yun. In 947 Yelü Deguang entered Kaifeng, destroyed the Later Jin and renamed the state Great Liao. In 979 they routed the Song army at the Battle of the Gaoliang River."},{"k":"奚","n":"奚","kind":"state","note":"库莫奚，居契丹西南（今老哈河、滦河上游），唐设饶乐都督府。与契丹并称“两蕃”，常依违于唐、回鹘之间。10 世纪初为耶律阿保机征服，并入契丹，后来辽中京大定府即建于奚王牙帐故地。","ne":"Xi","notee":"The Kumo Xi, living southwest of the Khitan (on the upper Laoha and Luan rivers today); Tang set up the Raole Area Command for them. With the Khitan they were known as \"the two Fan\", and they wavered between Tang and the Uyghurs. In the early 10th century they were conquered by Yelü Abaoji and absorbed into the Khitan state; the later Liao Central Capital, Dading Fu, was built on the site of the Xi king's camp."},{"k":"室韦","n":"室韦","kind":"tribe","note":"分布于大兴安岭东西、嫩江与额尔古纳河流域的众多部落，与契丹同源。唐时分二十余部，其中蒙兀室韦居望建河（额尔古纳河）一带，为蒙古先祖。","ne":"Shiwei","notee":"Many tribes spread east and west of the Greater Khingan and along the Nen and Argun rivers, of the same origin as the Khitan. In Tang times they were divided into more than twenty tribes; among them the Mengwu Shiwei, who lived along the Wangjian River (the Argun), were the ancestors of the Mongols."},{"k":"黑水靺鞨","n":"黑水靺鞨","kind":"tribe","note":"靺鞨七部中最北的一部，居黑水（黑龙江、松花江下游）。唐 726 年设黑水都督府。渤海强盛时多受其节制，10 世纪起称女真。","ne":"Heishui Mohe","notee":"The northernmost of the seven Mohe tribes, living along the Heishui (the Amur and the lower Songhua). Tang set up the Heishui Area Command in 726. When Balhae was strong they were largely under its control; from the 10th century they were called Jurchens."},{"k":"女真","n":"女真","kind":"tribe","note":"黑水靺鞨后裔，10 世纪起见称“女真”（避辽兴宗讳亦作女直）。契丹将其中南迁者编入户籍，称“熟女真”，未入籍者称“生女真”。1115 年完颜阿骨打建金。","ne":"Jurchens","notee":"Descendants of the Heishui Mohe, known from the 10th century as the Jurchens (Nüzhen; also written Nüzhi to avoid the personal name of Emperor Xingzong of Liao). Those whom the Khitan moved south and entered in the household registers were called the Civilized Jurchens, those not registered the Wild Jurchens. In 1115 Wanyan Aguda founded the Jin."},{"k":"阻卜","n":"阻卜（鞑靼）","kind":"tribe","note":"10 世纪起活动于漠北的诸部，宋人称鞑靼，辽人称阻卜，包括后来的克烈、蔑儿乞、塔塔儿等部。924 年后名义上臣服契丹，叛服无常。","ne":"Zubu (Tatars)","se":"Zubu","notee":"The tribes active north of the Gobi from the 10th century, called Tatars by the Song and Zubu by the Liao, including the later Keraites, Merkits and Tatars. From 924 they nominally submitted to the Khitan, rebelling and submitting by turns."},{"k":"新罗","n":"新罗","kind":"state","note":"676 年统一朝鲜半岛大同江以南，都金城（今庆州）。735 年唐正式承认其据有浿江（大同江）以南。9 世纪末王权衰落，地方豪族（“城主”“将军”）割据，进入“后三国”时期，935 年敬顺王降高丽。","ne":"Silla","notee":"In 676 it unified the Korean peninsula south of the Taedong River, with its capital at Geumseong (today's Gyeongju). In 735 Tang formally recognized its possession of the land south of the Paegang (the Taedong River). At the end of the 9th century royal power declined and local magnates (\"castle lords\" and \"generals\") carved out territories of their own, opening the \"Later Three Kingdoms\" period; in 935 King Gyeongsun surrendered to Goryeo."},{"k":"后百济","n":"后百济","kind":"state","note":"新罗将领甄萱 892 年起兵据武珍州（光州），900 年在完山州（全州）称王，国号百济，史称后百济。927 年攻入新罗都城金城。936 年为高丽所灭。","ne":"Later Baekje","notee":"In 892 the Silla general Gyeon Hwon rose in arms and seized Mujinju (Gwangju); in 900 he proclaimed himself king at Wansanju (Jeonju), with the state name Baekje, known to history as Later Baekje. In 927 he broke into the Silla capital, Geumseong. It was destroyed by Goryeo in 936."},{"k":"泰封","n":"泰封","kind":"state","note":"新罗王族弓裔 901 年在松岳称王（国号高丽，史称后高句丽），904 年改国号摩震，905 年迁都铁圆，911 年改泰封。918 年部将王建发动政变，建立高丽。","ne":"Taebong","notee":"Gung Ye, a member of the Silla royal house, proclaimed himself king at Songak in 901 (with the state name Goryeo, known to history as Later Goguryeo); in 904 he renamed the state Majin, in 905 moved the capital to Cheorwon, and in 911 renamed it Taebong. In 918 his general Wang Geon staged a coup and founded Goryeo."},{"k":"高丽","n":"高丽","kind":"state","note":"918 年王建推翻弓裔，建立高丽，919 年定都松岳（开京，今开城）。935 年新罗降，936 年灭后百济，统一朝鲜半岛。以平壤为西京，向北经营至清川江一带。","ne":"Goryeo","notee":"In 918 Wang Geon overthrew Gung Ye and founded Goryeo, settling the capital at Songak (Gaegyeong, today's Kaesong) in 919. Silla surrendered in 935, and in 936 Goryeo destroyed Later Baekje and unified the Korean peninsula. With Pyongyang as its Western Capital, Seogyeong, it extended its rule north to around the Cheongcheon River."},{"k":"日本","n":"日本","kind":"state","note":"奈良时代末期至平安时代（794 年迁都平安京）。遣唐使至 894 年菅原道真奏停。唐、新罗商人往来于博多太宰府与明州、扬州、楚州之间。","ne":"Japan","notee":"From the end of the Nara period into the Heian period (the capital moved to Heian-kyō in 794). Embassies to Tang continued until 894, when Sugawara no Michizane proposed ending them. Tang and Silla merchants traveled between Dazaifu at Hakata and Mingzhou, Yangzhou and Chuzhou."},{"k":"骠国","n":"骠国","kind":"state","note":"骠人（Pyu）城邦国家，都室利差呾罗（今卑谬附近）。802 年遣乐工随南诏使团入长安献乐，白居易作《骠国乐》。832 年为南诏所破。","ne":"Pyu","notee":"A city-state of the Pyu people, with its capital at Sri Ksetra (near today's Pyay). In 802 it sent musicians to Chang'an with a Nanzhao embassy to present their music, and Bai Juyi wrote the poem Piaoguo yue. It was crushed by Nanzhao in 832."},{"k":"蒲甘","n":"蒲甘","kind":"state","note":"缅人在伊洛瓦底江中游建立的王国，传统纪年始于 849 年筑蒲甘城。11 世纪阿奴律陀时统一缅甸。","ne":"Pagan Kingdom","se":"Pagan","notee":"A kingdom founded by the Burmans on the middle Irrawaddy; by traditional reckoning its history begins with the building of the city of Pagan in 849. In the 11th century, under Anawrahta, it unified Burma."},{"k":"文单","n":"文单（陆真腊）","kind":"state","note":"真腊分裂后北部的“陆真腊”，唐人称文单国，约在今老挝万象一带。753 年文单王子率众随唐军征南诏，771 年遣使入唐。","ne":"Wendan (Land Chenla)","notee":"The northern part of Chenla after it split, \"Land Chenla\", which the Tang called the state of Wendan, roughly around today's Vientiane, Laos. In 753 a prince of Wendan led his followers to join the Tang campaign against Nanzhao, and in 771 it sent envoys to Tang."},{"k":"环王","n":"环王（占城）","kind":"state","note":"占族王国，汉称林邑，唐至德（756–758）后称环王，9 世纪后期起称占城。875 年后都因陀罗补罗（今越南岘港东阳）。与安南、真腊时有战事。","ne":"Huanwang (Champa)","notee":"The kingdom of the Cham people, called Linyi in Han times, Huanwang after the Zhide era of Tang (756–758), and Zhancheng (Champa) from the late 9th century. From 875 its capital was Indrapura (today's Đồng Dương, Da Nang, Vietnam). It fought Annan and Chenla from time to time."},{"k":"泥婆罗","n":"泥婆罗","kind":"state","note":"加德满都谷地的李查维王朝，7–8 世纪臣属吐蕃，唐使王玄策曾借其兵。","ne":"Nepal","notee":"The Licchavi dynasty of the Kathmandu Valley, a vassal of Tibet in the 7th–8th centuries; the Tang envoy Wang Xuance once borrowed troops from it."},{"k":"于阗","n":"于阗","kind":"state","note":"塔里木盆地南缘的绿洲王国，尉迟（Viśa）王族世袭。唐时为安西四镇之一（毗沙都督府）；790 年代陷于吐蕃，9 世纪中叶复国。912–966 年在位的李圣天（尉迟娑缚婆）与沙州曹氏联姻，938 年受后晋册封“大宝于阗国王”。10 世纪后期与喀喇汗王朝长期作战，1006 年前后被喀喇汗所灭。","ne":"Kingdom of Khotan","se":"Khotan","notee":"An oasis kingdom on the southern rim of the Tarim Basin, ruled by the hereditary Viśa (Yuchi) royal house. Under Tang it was one of the Four Garrisons of Anxi (the Pisha Area Command); it fell to Tibet in the 790s and regained independence in the mid 9th century. Li Shengtian (Viśa Saṃbhava, r. 912–966) made marriage alliances with the Cao family of Shazhou and in 938 was invested by the Later Jin as \"King of Great Treasure Khotan\". In the late 10th century it fought a long war with the Kara-Khanid Khanate and was destroyed by the Kara-Khanids around 1006."},{"k":"西州回鹘","n":"西州回鹘","kind":"state","note":"840 年回鹘汗国破灭后，庞特勤率部西奔天山东部焉耆、龟兹一带。866 年北庭回鹘仆固俊攻取西州、北庭、轮台，以高昌为都，即高昌回鹘（亦称西州回鹘、天山回鹘），夏都北庭（别失八里）。","ne":"Xizhou Uyghurs","notee":"After the Uyghur Khaganate collapsed in 840, Pang Tegin led his followers west to the area of Karasahr and Kucha in the eastern Tian Shan. In 866 Pugu Jun of the Beiting Uyghurs took Xizhou, Beiting and Luntai and made Qocho his capital: this was the Kingdom of Qocho (also called the Xizhou Uyghurs or the Tian Shan Uyghurs), with Beiting (Beshbaliq) as its summer capital."},{"k":"高昌回鹘","n":"高昌回鹘","kind":"state","note":"866 年仆固俊据西州（高昌）、北庭，建立高昌回鹘王国，冬居高昌、夏居北庭，辖天山东部及焉耆、龟兹。信奉摩尼教与佛教，壁画、文书遗存丰富（柏孜克里克石窟）。1209 年降蒙古。","ne":"Kingdom of Qocho (Uyghurs)","se":"Qocho","notee":"In 866 Pugu Jun seized Xizhou (Qocho) and Beiting and founded the Kingdom of Qocho, wintering at Qocho and summering at Beiting; it ruled the eastern Tian Shan together with Karasahr and Kucha. Its people followed Manichaeism and Buddhism, and it left a wealth of murals and manuscripts (the Bezeklik Caves). It submitted to the Mongols in 1209."},{"k":"甘州回鹘","n":"甘州回鹘","kind":"state","note":"840 年后迁入河西的回鹘部众，9 世纪末（约 894 年）据甘州立牙帐，奉中原王朝为“舅”。控制河西走廊中段，与沙州归义军时战时和。1028 年为西夏所灭。","ne":"Ganzhou Uyghur Kingdom","se":"Ganzhou Uyghurs","notee":"Uyghurs who moved into Hexi after 840. At the end of the 9th century (c. 894) they set up their royal camp at Ganzhou, and they addressed the Central Plains courts as \"maternal uncle\". They controlled the middle of the Hexi Corridor and alternately fought and made peace with the Guiyi Jun at Shazhou. They were destroyed by Western Xia in 1028."},{"k":"喀喇汗","n":"喀喇汗","kind":"state","note":"葛逻禄、样磨等突厥部族在七河与喀什噶尔建立的王朝（约 840 年代–1212），以八剌沙衮、喀什噶尔为两都。萨图克·布格拉汗约 934 年皈依伊斯兰教，为中亚第一个突厥伊斯兰王朝。10 世纪后期起与于阗长期“圣战”。","ne":"Kara-Khanid Khanate","se":"Kara-Khanids","notee":"A dynasty founded by the Karluk, Yaghma and other Turkic tribes in Semirechye and Kashgar (c. 840s–1212), with Balasagun and Kashgar as its two capitals. Satuq Bughra Khan converted to Islam c. 934, making it the first Turkic Muslim dynasty in Central Asia. From the late 10th century it waged a long \"holy war\" against Khotan."},{"k":"归义军","n":"归义军","kind":"state","note":"848 年沙州豪族张议潮率众驱逐吐蕃，收复瓜、沙，继取甘、肃、伊等州；851 年遣兄张议潭奉十一州图籍入朝，唐于沙州置归义军，以张议潮为节度使。861 年收复凉州。\n张氏传至张承奉，910 年建“西汉金山国”，911 年败于甘州回鹘，降为“敦煌国”。914 年曹议金代张氏，恢复归义军称号，曹氏世守瓜、沙至 11 世纪。敦煌藏经洞文书多出于此期。","ne":"Guiyi Jun","notee":"In 848 Zhang Yichao, of a powerful Shazhou family, led a rising that drove out the Tibetans, recovered Guazhou and Shazhou, and went on to take Ganzhou, Suzhou, Yizhou and other prefectures; in 851 he sent his elder brother Zhang Yitan to the court with the maps and registers of eleven prefectures, and Tang set up the Guiyi Jun at Shazhou with Zhang Yichao as military governor. Liangzhou was recovered in 861.\nThe Zhang line passed down to Zhang Chengfeng, who in 910 founded the \"Golden Mountain Kingdom of the Western Han\"; defeated by the Ganzhou Uyghurs in 911, it was reduced to the \"Kingdom of Dunhuang\". In 914 Cao Yijin replaced the Zhang family and restored the name Guiyi Jun, and the Cao family held Guazhou and Shazhou for generations, into the 11th century. Most of the manuscripts of the Dunhuang Library Cave date from this period."},{"k":"凉州蕃部","n":"凉州蕃部","kind":"state","note":"吐蕃王朝崩溃后，凉州一带由嗢末（吐蕃奴部起事者）与六谷吐蕃部落控制，唐末五代时凉州名义上设节度使，实为蕃汉杂处的自治。10 世纪后期折逋氏为首领，宋称“西凉府”，11 世纪 30 年代初为西夏所取。","ne":"Liangzhou Tibetan tribes","notee":"After the Tibetan Empire collapsed, the Liangzhou area was controlled by the Wamo (slave tribes of the Tibetans who had risen in revolt) and the Liugu Tibetan tribes; in the late Tang and Five Dynasties a military governor of Liangzhou existed in name, but in practice it was a self-governing mix of Tibetans and Han Chinese. In the late 10th century the Zhebu clan led it, and the Song called it Xiliang Fu; it was taken by Western Xia in the early 1030s."},{"k":"定难","n":"定难军","kind":"state","note":"党项拓跋部首领拓跋思恭因助唐镇压黄巢，881—882 年任夏州（定难军）节度使，883 年以功受赐国姓李，世据夏、绥、银、宥四州（后加静州）。五代时名义上服从中原，实为世袭割据。982 年李继捧献地入宋，其族弟李继迁出走抗宋，其孙李元昊 1038 年建西夏。","ne":"Dingnan Jun","se":"Dingnan","notee":"Tuoba Sigong, chief of the Tuoba tribe of the Tanguts, helped Tang suppress Huang Chao; in 881–882 he was made military governor of Xiazhou (the Dingnan Jun), and in 883 he was granted the imperial surname Li for his services. His family held the four prefectures of Xiazhou, Suizhou, Yinzhou and Youzhou (later also Jingzhou) for generations. In the Five Dynasties it nominally obeyed the Central Plains courts but was in fact a hereditary, independent regime. In 982 Li Jipeng surrendered its lands to Song; his clansman Li Jiqian fled to resist Song, and Li Jiqian's grandson Li Yuanhao founded Western Xia in 1038."},{"k":"定安国","n":"定安国","kind":"state","note":"渤海遗民在鸭绿江上游建立的政权（约 10 世纪中叶–10 世纪末），970、981 年两次遣使入宋。约 986 年为辽所灭。","ne":"Jeongan (Ding'an)","se":"Jeongan","notee":"A regime founded by Balhae survivors on the upper Yalu River (c. mid-10th century to the end of the 10th century), which sent envoys to Song twice, in 970 and 981. It was destroyed by Liao c. 986."},{"k":"朱泚","n":"朱泚（秦·汉）","kind":"state","note":"783 年十月泾原兵过长安时哗变，拥立原卢龙节度使、太尉朱泚，朱泚称大秦皇帝，围德宗于奉天，次年正月改国号汉。784 年五月李晟收复长安，朱泚西逃，途中为部将所杀。","ne":"Zhu Ci (Qin · Han)","notee":"In the 10th month of 783 the Jingyuan troops mutinied as they passed through Chang'an and acclaimed the Grand Commandant Zhu Ci, former military governor of Lulong; Zhu Ci proclaimed himself emperor of Great Qin and besieged Emperor Dezong at Fengtian, and in the 1st month of the next year renamed the state Han. In the 5th month of 784 Li Sheng recovered Chang'an; Zhu Ci fled west and was killed by his own officers on the way."},{"k":"李怀光","n":"李怀光","kind":"state","note":"朔方节度使李怀光率军解奉天之围，因与宰相卢杞及白志贞等不和，784 年二月联络朱泚反叛，德宗再奔梁州。785 年八月马燧、浑瑊围河中，李怀光自缢。","ne":"Li Huaiguang","notee":"Li Huaiguang, military governor of Shuofang, led his army to lift the siege of Fengtian, but fell out with the chief minister Lu Qi and with Bai Zhizhen; in the 2nd month of 784 he joined Zhu Ci in rebellion, and Emperor Dezong fled again, to Liangzhou. In the 8th month of 785 Ma Sui and Hun Jian besieged Hezhong, and Li Huaiguang hanged himself."},{"k":"大楚","n":"大楚（李希烈）","kind":"state","note":"淮西节度使李希烈受命讨李纳，反与四镇勾结，782 年自称建兴王、天下都元帅；783 年十二月陷汴州，784 年正月称帝，国号大楚。屡攻陈州、襄城不克，退归蔡州，786 年为部将陈仙奇毒死。","ne":"Great Chu (Li Xilie)","notee":"Li Xilie, military governor of Huaixi, was ordered to attack Li Na but instead colluded with four fanzhen; in 782 he styled himself Prince of Jianxing and Generalissimo of All Under Heaven. In the 12th month of 783 he took Bianzhou, and in the 1st month of 784 proclaimed himself emperor of a state called Great Chu. His repeated attacks on Chenzhou and Xiangcheng failed and he fell back to Caizhou; in 786 he was poisoned by his officer Chen Xianqi."},{"k":"大齐","n":"大齐（黄巢）","kind":"state","note":"黄巢 880 年十二月入长安，在含元殿即皇帝位，国号大齐，年号金统。因不能控制关中以外，粮道断绝，883 年四月被李克用沙陀军等逐出长安，884 年六月在泰山狼虎谷败死。","ne":"Great Qi (Huang Chao)","notee":"Huang Chao entered Chang'an in the 12th month of 880 and took the imperial throne in the Hanyuan Hall, with the state name Great Qi and the reign title Jintong. Unable to control anything beyond Guanzhong and with his supply lines cut, he was driven out of Chang'an in the 4th month of 883 by Li Keyong's Shatuo army and others, and in the 6th month of 884 he was defeated and died at Langhu Valley near Mount Tai."},{"k":"罗平","n":"大越罗平","kind":"state","note":"义胜军（浙东）节度使董昌 895 年二月在越州称帝，国号大越罗平。896 年钱镠奉诏攻破越州，董昌被杀，两浙尽归钱镠。","ne":"Great Yue Luoping","notee":"Dong Chang, military governor of the Yisheng Jun (Zhedong), proclaimed himself emperor at Yuezhou in the 2nd month of 895, with the state name Great Yue Luoping. In 896 Qian Liu, acting on an imperial order, took Yuezhou; Dong Chang was killed, and all of Liangzhe passed to Qian Liu."},{"k":"后梁","n":"后梁","kind":"state","note":"907–923。朱全忠（朱温，后改名晃）篡唐建立，都开封（东都），以洛阳为西都。与河东李存勖在河北、河上长期拉锯：908 年潞州夹寨、911 年柏乡两败于晋，915 年魏博降晋。923 年李存勖遣李嗣源奇袭开封，末帝朱友贞自杀，梁亡。","ne":"Later Liang","notee":"907–923. Founded by Zhu Quanzhong (Zhu Wen, later renamed Zhu Huang) when he usurped the Tang throne, with its capital at Kaifeng (the Eastern Capital) and Luoyang as the Western Capital. It waged a long seesaw war with Li Cunxu of Hedong in Hebei and along the Yellow River: it was defeated twice by Jin, at the siege camp of Luzhou in 908 and at Baixiang in 911, and in 915 Weibo surrendered to Jin. In 923 Li Cunxu sent Li Siyuan in a surprise attack on Kaifeng; the last emperor, Zhu Youzhen, killed himself, and the Liang came to an end."},{"k":"晋","n":"晋（河东）","kind":"state","note":"907–923。沙陀李克用（908 年卒）、李存勖父子据河东，不奉梁朔，仍用唐天祐年号，称晋王。908 年李存勖解潞州之围（三垂冈），911 年柏乡大败梁军，913 年灭燕刘守光，915 年得魏博，923 年在魏州称帝（后唐）。","ne":"Jin (Hedong)","notee":"907–923. The Shatuo Li Keyong (d. 908) and his son Li Cunxu held Hedong; refusing to recognize the Liang calendar, they kept the Tang reign title Tianyou and kept the title Prince of Jin. In 908 Li Cunxu relieved the siege of Luzhou (at Sanchui Ridge), in 911 he crushed the Liang army at Baixiang, in 913 he destroyed Liu Shouguang's Yan, in 915 he gained Weibo, and in 923 he proclaimed himself emperor at Weizhou (the Later Tang)."},{"k":"燕·刘","n":"燕（刘氏）","kind":"state","note":"卢龙节度使刘仁恭及其子刘守光。907 年刘守光囚父自代，911 年称大燕皇帝。913 年晋将周德威攻破幽州，刘氏父子被擒杀。","ne":"Yan (Liu family)","notee":"Liu Rengong, military governor of Lulong, and his son Liu Shouguang. In 907 Liu Shouguang imprisoned his father and took his place, and in 911 he proclaimed himself emperor of Great Yan. In 913 the Jin general Zhou Dewei took Youzhou, and father and son were captured and killed."},{"k":"岐","n":"岐","kind":"state","note":"887–924。凤翔节度使李茂贞（宋文通，赐姓李）据凤翔、陇右与山南西道，唐末曾劫持昭宗，902–903 年被朱全忠围困一年。907 年后开岐王府，不称帝，奉唐正朔；地盘逐渐被前蜀、后梁蚕食。924 年向后唐称臣，旋卒。","ne":"Qi","notee":"887–924. Li Maozhen (born Song Wentong, granted the surname Li), military governor of Fengxiang, held Fengxiang, Longyou and Shannan West Circuit; at the end of the Tang he once seized Emperor Zhaozong, and in 902–903 he was besieged for a year by Zhu Quanzhong. After 907 he opened the court of the Prince of Qi, did not proclaim himself emperor, and kept the Tang calendar; his territory was gradually eaten away by the Former Shu and the Later Liang. In 924 he submitted to the Later Tang as a vassal and died soon after."},{"k":"前蜀","n":"前蜀","kind":"state","note":"907–925。王建 891 年入成都，兼并东川、山南西道与峡江诸州，907 年九月称帝，国号蜀，都成都。王衍荒淫，925 年后唐郭崇韬伐蜀，七十日而亡。","ne":"Former Shu","notee":"907–925. Wang Jian entered Chengdu in 891, annexed Dongchuan, Shannan West Circuit and the prefectures along the Yangtze Gorges, and in the 9th month of 907 proclaimed himself emperor of a state called Shu, with its capital at Chengdu. Wang Yan was dissolute, and in 925 the Later Tang sent Guo Chongtao against Shu, which fell in seventy days."},{"k":"后唐","n":"后唐","kind":"state","note":"923–936。李存勖 923 年在魏州称帝，国号唐，同年灭梁，迁都洛阳；925 年灭前蜀。926 年兴教门之变庄宗被杀，李嗣源（明宗）即位，号称小康。934 年孟知祥据蜀称帝；936 年河东石敬瑭引契丹兵南下，末帝李从珂在洛阳自焚。","ne":"Later Tang","notee":"923–936. Li Cunxu proclaimed himself emperor of a state called Tang at Weizhou in 923, destroyed the Liang the same year, and moved the capital to Luoyang; in 925 he destroyed the Former Shu. In the Xingjiao Gate incident of 926 Zhuangzong was killed and Li Siyuan (Mingzong) took the throne, a reign remembered as a time of modest prosperity. In 934 Meng Zhixiang proclaimed himself emperor in Shu; in 936 Shi Jingtang of Hedong brought Khitan troops south, and the last emperor, Li Congke, burned himself to death in Luoyang."},{"k":"后晋","n":"后晋","kind":"state","note":"936–947。石敬瑭以割燕云十六州、称儿皇帝为代价换取契丹援兵建国，938 年定都开封。出帝石重贵对契丹称孙不称臣，引发三次战争：945 年阳城（白团卫村）大捷，946 年杜重威在中渡桥投降，947 年正月契丹入开封，后晋亡。","ne":"Later Jin","notee":"936–947. Shi Jingtang founded the state with Khitan help, at the price of ceding the Sixteen Prefectures of Yan and Yun and calling himself the Khitan emperor's \"son\", and settled the capital at Kaifeng in 938. Emperor Chu (Shi Chonggui) called himself the Khitan emperor's grandson but refused to be his subject, which led to three wars: a great victory at Yangcheng (Baituanwei Village) in 945, Du Chongwei's surrender at Zhongdu Bridge in 946, and in the 1st month of 947 the Khitan entry into Kaifeng and the fall of the Later Jin."},{"k":"后汉","n":"后汉","kind":"state","note":"947–951。河东节度使刘知远（沙陀）947 年二月在太原称帝，六月趁辽军北撤入开封。948 年刘知远卒，隐帝刘承祐年少猜忌，950 年诛杀杨邠、史弘肇等重臣，并欲杀郭威，郭威起兵，隐帝被杀。","ne":"Later Han","notee":"947–951. Liu Zhiyuan (a Shatuo), military governor of Hedong, proclaimed himself emperor at Taiyuan in the 2nd month of 947 and entered Kaifeng in the 6th month as the Liao army withdrew north. Liu Zhiyuan died in 948; the young and suspicious Emperor Yin, Liu Chengyou, put the senior ministers Yang Bin, Shi Hongzhao and others to death in 950 and planned to kill Guo Wei too; Guo Wei rose in arms, and Emperor Yin was killed."},{"k":"后周","n":"后周","kind":"state","note":"951–960。郭威 951 年称帝，都开封，整顿吏治。954 年养子柴荣（世宗）即位，高平之战后整军，西取秦凤，三征南唐得江北，北伐收复瀛莫三关，限佛毁铜铸钱，扩建开封城。959 年世宗卒，960 年赵匡胤陈桥兵变代周。","ne":"Later Zhou","notee":"951–960. Guo Wei proclaimed himself emperor in 951, with his capital at Kaifeng, and reformed the administration. In 954 his adopted son Chai Rong (Shizong) took the throne; after the Battle of Gaoping he reorganized the army, took Qinzhou and Fengzhou in the west, won the land north of the Yangtze in three campaigns against the Southern Tang, recovered Ying, Mo and the Three Passes in a northern campaign, restricted Buddhism and melted down bronze to cast coins, and enlarged the city of Kaifeng. Shizong died in 959, and in 960 Zhao Kuangyin replaced the Zhou in the Chenqiao mutiny."},{"k":"北汉","n":"北汉","kind":"state","note":"951–979。后汉高祖之弟、河东节度使刘崇在太原称帝，依附辽朝，号“侄皇帝”。地狭民贫，仅十二州。979 年宋太宗亲征，刘继元出降，太原城被焚毁，另迁并州至唐明镇（今太原市区）。","ne":"Northern Han","notee":"951–979. Liu Chong, younger brother of the Later Han founder and military governor of Hedong, proclaimed himself emperor at Taiyuan and depended on Liao, calling himself its \"nephew emperor\". With little land and a poor population, it had only twelve prefectures. In 979 Emperor Taizong of Song led a campaign in person; Liu Jiyuan came out to surrender, the city of Taiyuan was burned, and Bingzhou was moved to Tangming Town (today's urban Taiyuan)."},{"k":"宋","n":"宋","kind":"state","note":"960 年赵匡胤代周建宋，都开封（东京）。采取“先南后北”：963 年取荆南、湖南，965 年灭后蜀，971 年灭南汉，975 年灭南唐，978 年吴越、漳泉纳土，979 年灭北汉。同年北伐幽州，高梁河之战大败，此后与辽对峙于白沟河—雁门一线。","ne":"Song","notee":"In 960 Zhao Kuangyin replaced the Zhou and founded the Song, with its capital at Kaifeng (the Eastern Capital). It followed a policy of \"south first, then north\": it took Jingnan and Hunan in 963, destroyed the Later Shu in 965, the Southern Han in 971 and the Southern Tang in 975; Wuyue and the Zhangzhou–Quanzhou regime surrendered their lands in 978, and the Northern Han was destroyed in 979. The same year Song marched north against Youzhou and was badly defeated at the Battle of the Gaoliang River; thereafter it faced Liao across the line of the Baigou River and Yanmen."},{"k":"吴","n":"吴","kind":"state","note":"902–937。淮南节度使杨行密 902 年受唐封吴王，都广陵（扬州）。897 年清口之战大败朱全忠，奠定江淮独立。杨行密死后权臣徐温、徐知诰（养子）父子专政，919 年杨隆演称吴国王，927 年杨溥称帝。937 年徐知诰受禅建齐（南唐）。","ne":"Wu","notee":"902–937. Yang Xingmi, military governor of Huainan, was made Prince of Wu by Tang in 902, with his capital at Guangling (Yangzhou). His great victory over Zhu Quanzhong at the Battle of Qingkou in 897 secured the independence of the Jianghuai region. After Yang Xingmi's death the powerful ministers Xu Wen and his adopted son Xu Zhigao controlled the government; Yang Longyan styled himself King of Wu in 919, and Yang Pu proclaimed himself emperor in 927. In 937 Xu Zhigao received the abdication of Wu and founded Qi (the Southern Tang)."},{"k":"南唐","n":"南唐","kind":"state","note":"937–975。徐知诰受吴禅，国号齐；939 年复姓李，改名昪，改国号唐。都金陵（江宁府）。保境息民，文化昌盛（李璟、李煜词，《韩熙载夜宴图》）。945 年灭闽，951 年灭楚，旋失湖南。956–958 年为后周所败，献江北十四州，去帝号；961 年迁都南昌（南都），旋还金陵。975 年宋军破金陵，李煜出降。","ne":"Southern Tang","notee":"937–975. Xu Zhigao received the abdication of Wu and named the state Qi; in 939 he resumed the surname Li, took the name Li Bian and renamed the state Tang. Its capital was Jinling (Jiangning Fu). It guarded its borders and let its people rest, and its culture flourished (the lyrics of Li Jing and Li Yu, The Night Revels of Han Xizai). It destroyed Min in 945 and Chu in 951, but soon lost Hunan. Defeated by the Later Zhou in 956–958, it surrendered the fourteen prefectures north of the Yangtze and gave up the imperial title; in 961 it moved the capital to Nanchang (the Southern Capital), soon returning to Jinling. In 975 the Song army took Jinling and Li Yu came out to surrender."},{"k":"吴越","n":"吴越","kind":"state","note":"907–978。钱镠据两浙，907 年受梁封吴越王，都杭州（西府），以越州为东府。修筑捍海石塘，兴修太湖水利，奉中原正朔，“保境安民”。947 年得福州。978 年钱俶纳土归宋。","ne":"Wuyue","notee":"907–978. Qian Liu held Liangzhe and was made Prince of Wuyue by the Liang in 907, with his capital at Hangzhou (the Western Seat) and Yuezhou as the Eastern Seat. He built the stone seawall, carried out water-control works around Lake Tai, followed the calendar of the Central Plains courts, and \"guarded the borders and kept the people at peace\". Wuyue gained Fuzhou in 947. In 978 Qian Chu surrendered his lands to Song."},{"k":"闽","n":"闽","kind":"state","note":"909–945。王潮、王审知兄弟由光州入闽，893 年取福州。909 年王审知受封闽王，开甘棠港，招徕海商。933 年王延钧称帝，升福州为长乐府。王氏子弟相残，943 年王延政在建州称殷帝。945 年南唐灭闽，福州李仁达降吴越（947），泉、漳归留从效。","ne":"Min","notee":"909–945. The brothers Wang Chao and Wang Shenzhi came into Fujian from Guangzhou (in today's Henan) and took Fuzhou in 893. In 909 Wang Shenzhi was made Prince of Min; he opened Gantang Harbor and attracted overseas merchants. In 933 Wang Yanjun proclaimed himself emperor and raised Fuzhou to Changle Fu. Members of the Wang family fought one another, and in 943 Wang Yanzheng proclaimed himself emperor of Yin at Jianzhou. In 945 the Southern Tang destroyed Min; at Fuzhou Li Renda surrendered to Wuyue (947), and Quanzhou and Zhangzhou passed to Liu Congxiao."},{"k":"楚","n":"楚","kind":"state","note":"907–951。马殷 896 年据潭州，907 年受封楚王，都长沙。以茶叶贸易与铸铅铁钱致富。马殷诸子争位（“众驹争槽”），951 年南唐乘乱灭楚，南汉取其岭南诸州。","ne":"Chu","notee":"907–951. Ma Yin seized Tanzhou in 896 and was made Prince of Chu in 907, with his capital at Changsha. Chu grew rich on the tea trade and on casting lead and iron coins. Ma Yin's sons fought over the succession (\"many colts fighting over one trough\"), and in 951 the Southern Tang took advantage of the chaos to destroy Chu, while the Southern Han took its prefectures in Lingnan."},{"k":"南汉","n":"南汉","kind":"state","note":"917–971。刘隐据广州（清海军），兄终弟及，刘䶮 917 年称帝，国号大越，次年改汉，都兴王府（广州）。938 年白藤江之战败于吴权，失交州。刑法残酷，宦官专权。971 年宋将潘美攻入广州，刘鋹出降。","ne":"Southern Han","notee":"917–971. Liu Yin held Guangzhou (the Qinghai Jun); the succession passed from brother to brother, and Liu Yan proclaimed himself emperor in 917 with the state name Great Yue, changed to Han the next year; the capital was Xingwang Fu (Guangzhou). Defeated by Ngô Quyền at the Battle of Bạch Đằng in 938, it lost Giao Châu. Its punishments were cruel and eunuchs dominated the government. In 971 the Song general Pan Mei broke into Guangzhou and Liu Chang came out to surrender."},{"k":"南平","n":"荆南（南平）","kind":"state","note":"907–963。高季昌（后改名季兴）907 年任后梁荆南节度使，924 年受后唐封南平王。仅有江陵、归、峡三州，地处南北交通要冲，向四方称臣以获赏赐，人称“高赖子”。963 年宋军借道荆南，高继冲纳土。","ne":"Jingnan (Nanping)","notee":"907–963. Gao Jichang (later renamed Gao Jixing) became military governor of Jingnan under the Later Liang in 907 and was made Prince of Nanping by the Later Tang in 924. It held only the three prefectures of Jiangling, Guizhou and Xiazhou, at a crossroads between north and south; it declared itself a vassal of every neighbor to collect their gifts, earning the nickname \"Gao the Scoundrel\". In 963 the Song army asked for passage through Jingnan, and Gao Jichong surrendered his lands."},{"k":"后蜀","n":"后蜀","kind":"state","note":"934–965。孟知祥 925 年任西川节度使，932 年兼并东川，934 年称帝，国号蜀，都成都。孟昶在位三十一年，蜀中富庶，编《花间集》，刻蜀石经。964 年冬宋军两路伐蜀，965 年正月孟昶出降。","ne":"Later Shu","notee":"934–965. Meng Zhixiang became military governor of Xichuan in 925, annexed Dongchuan in 932, and proclaimed himself emperor in 934 with the state name Shu and his capital at Chengdu. Meng Chang reigned for thirty-one years; Shu was rich, and under him the anthology Among the Flowers was compiled and the Shu Stone Classics were carved. In the winter of 964 Song attacked Shu along two routes, and in the 1st month of 965 Meng Chang came out to surrender."},{"k":"清源","n":"清源·平海","kind":"state","note":"南唐灭闽后，泉州军将留从效 947–949 年据泉、漳二州，南唐授清源军节度使。962 年留从效卒，陈洪进夺权，964 年宋改授平海军节度使。978 年陈洪进献泉、漳二州归宋。","ne":"Qingyuan · Pinghai","notee":"After the Southern Tang destroyed Min, Liu Congxiao, an army officer at Quanzhou, seized Quanzhou and Zhangzhou in 947–949, and the Southern Tang made him military governor of the Qingyuan Jun. Liu Congxiao died in 962 and Chen Hongjin took power; in 964 Song made him military governor of the Pinghai Jun instead. In 978 Chen Hongjin surrendered Quanzhou and Zhangzhou to Song."},{"k":"武平","n":"武平","kind":"state","note":"951 年南唐灭楚后，楚将刘言、王逵、周行逢于 952 年逐走南唐军，据湖南，后周授武平军节度使（治朗州）。956 年起周行逢据湖南。962 年周行逢卒，子保权年幼，衡州张文表叛，宋军借平乱于 963 年收取湖南。","ne":"Wuping","notee":"After the Southern Tang destroyed Chu in 951, the Chu generals Liu Yan, Wang Kui and Zhou Xingfeng drove out the Southern Tang army in 952 and held Hunan, and the Later Zhou granted the title of military governor of the Wuping Jun (seat at Langzhou). From 956 Zhou Xingfeng held Hunan. When Zhou Xingfeng died in 962, his son Zhou Baoquan was young and Zhang Wenbiao rebelled at Hengzhou; the Song army, using the revolt as a pretext, took over Hunan in 963."},{"k":"吴朝","n":"吴朝","kind":"state","note":"938 年吴权在白藤江大破南汉，939 年称王，都古螺，越南史称吴朝。944 年吴权卒，杨三哥篡位，吴昌岌、吴昌文复国。965 年吴昌文战死，各地豪强并起，史称“十二使君之乱”。","ne":"Ngô dynasty","notee":"In 938 Ngô Quyền crushed the Southern Han at the Bạch Đằng River, and in 939 he proclaimed himself king, with his capital at Cổ Loa; Vietnamese history calls this the Ngô dynasty. Ngô Quyền died in 944 and Dương Tam Kha usurped the throne; Ngô Xương Ngập and Ngô Xương Văn restored the dynasty. In 965 Ngô Xương Văn was killed in battle, and local strongmen rose everywhere, a period known as the \"Rebellion of the Twelve Warlords\"."},{"k":"安西","n":"安西","kind":"zhen","note":"安西四镇节度（安西都护府），治龟兹（今库车），统龟兹、于阗、疏勒、焉耆四镇。天宝年间高仙芝、封常清相继为节度使，747 年高仙芝远征小勃律。安史之乱后精兵东调，郭昕等孤守至 9 世纪初，陷于吐蕃、回鹘。","ne":"Anxi","notee":"The Four Garrisons of Anxi military governorship (Anxi Protectorate), with its seat at Kucha (today's Kuqa), controlling the four garrisons of Kucha, Khotan, Kashgar and Karasahr. In the Tianbao era Gao Xianzhi and then Feng Changqing were military governors; in 747 Gao Xianzhi led a distant expedition against Little Balur. After the An Lushan Rebellion its best troops were moved east, and Guo Xin and others held out alone until the early 9th century, when it fell to Tibet and the Uyghurs."},{"k":"北庭","n":"北庭","kind":"zhen","note":"伊西北庭节度，治庭州（北庭都护府，今吉木萨尔北庭故城），统天山北路及伊、西二州。安史乱后与安西相依为命，经回鹘道与长安联络；790 年为吐蕃攻陷，节度使杨袭古出奔西州被回鹘所杀。","ne":"Beiting","notee":"The Yi–Xi–Beiting military governorship, with its seat at Tingzhou (Beiting Protectorate, the Beiting ruins in today's Jimsar), controlling the region north of the Tian Shan and the two prefectures of Yizhou and Xizhou. After the An Lushan Rebellion it and Anxi depended on each other, keeping in touch with Chang'an by the Uyghur Road; in 790 it fell to Tibet, and the military governor Yang Xigu fled to Xizhou and was later killed by the Uyghurs."},{"k":"河西","n":"河西","kind":"zhen","note":"河西节度，治凉州，掌断隔吐蕃与突厥，统赤水、大斗、建康、玉门、豆卢诸军，兵七万余，天宝时哥舒翰兼领。764 年凉州陷，节度使移治甘州、沙州；766 年甘、肃陷，776 年瓜州陷，786 年沙州（阎朝）在坚守十余年后降蕃。","ne":"Hexi","notee":"The Hexi military governorship, with its seat at Liangzhou, charged with keeping Tibet and the Turks apart; it controlled the Chishui, Dadou, Jiankang, Yumen and Doulu armies, over 70,000 men, and in the Tianbao era Geshu Han held it concurrently. Liangzhou fell in 764 and the military governor moved his seat to Ganzhou and then Shazhou; Ganzhou and Suzhou fell in 766 and Guazhou in 776, and in 786 Shazhou (under Yan Chao) surrendered to Tibet after holding out for more than ten years."},{"k":"陇右","n":"陇右","kind":"zhen","note":"陇右节度，治鄯州（今乐都），防吐蕃于青海、河湟，统临洮、河源、积石等军，兵七万余。天宝时哥舒翰为节度使，749 年攻拔石堡城。安史之乱后兵力东调，763 年陇右诸州尽陷吐蕃。","ne":"Longyou","notee":"The Longyou military governorship, with its seat at Shanzhou (today's Ledu), defending against Tibet around Qinghai Lake and in Hehuang; it controlled the Lintao, Heyuan, Jishi and other armies, over 70,000 men. In the Tianbao era Geshu Han was its military governor and in 749 stormed Shibao Fortress. After the An Lushan Rebellion its troops were moved east, and in 763 all the prefectures of Longyou fell to Tibet."},{"k":"朔方","n":"朔方","kind":"zhen","note":"朔方节度，治灵州（今吴忠），统三受降城、丰安、定远等军，防御突厥与回纥。安史之乱中郭子仪、李光弼以朔方军为平叛主力，756 年肃宗在灵武即位。此后辖区逐步析出邠宁、夏绥、振武、天德诸镇，晚唐仅辖灵、盐等州。","ne":"Shuofang","notee":"The Shuofang military governorship, with its seat at Lingzhou (today's Wuzhong), controlling the three Shouxiang Cities and the Feng'an, Dingyuan and other armies, defending against the Turks and the Uyghurs. In the An Lushan Rebellion Guo Ziyi and Li Guangbi made the Shuofang army the mainstay of the suppression, and in 756 Emperor Suzong took the throne at Lingwu. The fanzhen of Binning, Xiasui, Zhenwu and Tiande were later split off from its territory one by one, and in the late Tang it held only Lingzhou, Yanzhou and a few other prefectures."},{"k":"关内","n":"关内道","kind":"zhen","note":"关内采访使道（未设节度的关中北部诸州）。","ne":"Guannei Circuit","notee":"The Guannei investigation commissioner's circuit (the prefectures of northern Guanzhong where no military governor was established)."},{"k":"京畿","n":"京畿","kind":"zhen","note":"京畿道，以京兆府（长安）为中心，直属朝廷。唐末仅余京兆、商州等地，朝廷号令不出关中。","ne":"Capital District","notee":"The Capital District Circuit, centered on Jingzhao Fu (Chang'an) and directly under the court. At the end of the Tang only Jingzhao, Shangzhou and a few other places remained, and the court's orders did not reach beyond Guanzhong."},{"k":"河东","n":"河东","kind":"zhen","note":"河东节度，治太原府（北都），天宝末由安禄山兼领。乱后由辛云京、马燧、王锷、李光颜等名将出镇，是朝廷制衡河朔的重镇。880 年代沙陀李克用据有此镇，与朱全忠争雄，907 年后为晋国。","ne":"Hedong","notee":"The Hedong military governorship, with its seat at Taiyuan Fu (the Northern Capital); at the end of the Tianbao era An Lushan held it concurrently. After the rebellion famous generals such as Xin Yunjing, Ma Sui, Wang E and Li Guangyan governed it, and it was the court's key fanzhen for holding Hebei in check. In the 880s Li Keyong of the Shatuo took this fanzhen and contended with Zhu Quanzhong; after 907 it became the state of Jin."},{"k":"河东道","n":"河东道","kind":"zhen","note":"河东采访使道南部诸州（蒲、晋、绛、泽、潞等），天宝时未置节度。","ne":"Hedong Circuit","notee":"The southern prefectures of the Hedong investigation commissioner's circuit (Puzhou, Jinzhou, Jiangzhou, Zezhou, Luzhou and others), where no military governor was established in the Tianbao era."},{"k":"范阳","n":"范阳","kind":"zhen","note":"范阳节度（幽州节度），治幽州，统经略、威武、清夷等九军，兵九万余，以防奚、契丹。744 年起安禄山兼领，755 年由此起兵。乱后改称卢龙节度。","ne":"Fanyang","notee":"The Fanyang military governorship (Youzhou military governorship), with its seat at Youzhou, controlling nine armies including the Jinglüe, Weiwu and Qingyi armies, over 90,000 men, to guard against the Xi and the Khitans. From 744 An Lushan held it concurrently, and in 755 he rose in rebellion here. After the rebellion it was renamed the Lulong military governorship."},{"k":"河北道","n":"河北道","kind":"zhen","note":"河北采访使道（魏、博、相、卫等州），天宝时由安禄山兼采访使。","ne":"Hebei Circuit","notee":"The Hebei investigation commissioner's circuit (Weizhou, Bozhou, Xiangzhou, Weizhou and other prefectures); in the Tianbao era An Lushan was concurrently its investigation commissioner."},{"k":"平卢","n":"平卢","kind":"zhen","note":"平卢节度，治营州（今朝阳），镇抚室韦、靺鞨，统平卢、卢龙二军及安东都护府。安禄山起家于此。安史乱中平卢兵马使侯希逸等忠于唐，761 年率部众两万渡海南下青州，营州遂为奚、契丹所据。","ne":"Pinglu","notee":"The Pinglu military governorship, with its seat at Yingzhou (today's Chaoyang), keeping the Shiwei and the Mohe in check; it controlled the Pinglu and Lulong armies and the Andong Protectorate. An Lushan rose to power here. During the An Lushan Rebellion the Pinglu army commander Hou Xiyi and others stayed loyal to Tang, and in 761 they led 20,000 followers across the sea south to Qingzhou, after which Yingzhou was taken by the Xi and the Khitans."},{"k":"都畿","n":"都畿","kind":"zhen","note":"都畿采访使道，以河南府（东都洛阳）为中心。","ne":"Eastern Capital District","notee":"The Eastern Capital District investigation commissioner's circuit, centered on Henan Fu (the Eastern Capital, Luoyang)."},{"k":"河南道","n":"河南道","kind":"zhen","note":"河南采访使道，治汴州，包括淮河以北、黄河以南的广大州县。","ne":"Henan Circuit","notee":"The Henan investigation commissioner's circuit, with its seat at Bianzhou, covering the many prefectures and counties north of the Huai River and south of the Yellow River."},{"k":"山南东道","n":"山南东道","kind":"zhen","note":"治襄州。安史乱后先后由来瑱、梁崇义（据镇 763–781）、于頔等镇守；唐末赵德諲、赵匡凝父子割据，905 年为朱全忠所并。","ne":"Shannan East Circuit","notee":"Seat at Xiangzhou. After the An Lushan Rebellion it was governed in turn by Lai Zhen, Liang Chongyi (who held it 763–781), Yu Di and others; at the end of the Tang Zhao Deyin and his son Zhao Kuangning held it as their own, and in 905 Zhu Quanzhong annexed it."},{"k":"山南西道","n":"山南西道","kind":"zhen","note":"治梁州（784 年升兴元府），扼守秦岭蜀道。784 年德宗避朱泚、李怀光之乱至此。唐末为李茂贞所据，903 年后入王建前蜀。","ne":"Shannan West Circuit","notee":"Seat at Liangzhou (raised to Xingyuan Fu in 784), guarding the Shu roads across the Qinling Mountains. In 784 Emperor Dezong took refuge here from the rebellions of Zhu Ci and Li Huaiguang. At the end of the Tang Li Maozhen held it; after 903 it passed to Wang Jian's Former Shu."},{"k":"剑南","n":"剑南","kind":"zhen","note":"剑南节度，治益州（757 年升成都府），西抗吐蕃、南抚蛮獠。756 年玄宗幸蜀。757 年分为西川、东川两节度。","ne":"Jiannan","notee":"The Jiannan military governorship, with its seat at Yizhou (raised to Chengdu Fu in 757), resisting Tibet to the west and keeping the Man and Lao tribes in check to the south. In 756 Emperor Xuanzong took refuge in Shu. In 757 it was divided into the two military governorships of Xichuan and Dongchuan."},{"k":"淮南","n":"淮南","kind":"zhen","note":"淮南节度，治扬州。扬州为江淮漕运与海外贸易中心，“扬一益二”。安史乱后由高适、陈少游、杜佑、李吉甫、李德裕、高骈等相继出镇；887 年高骈被部将所杀，扬州残破，杨行密 892 年据有其地，902 年受封吴王。","ne":"Huainan","notee":"The Huainan military governorship, with its seat at Yangzhou. Yangzhou was the center of grain transport on the Yangtze and Huai and of overseas trade: \"Yangzhou first, Yizhou second.\" After the An Lushan Rebellion Gao Shi, Chen Shaoyou, Du You, Li Jifu, Li Deyu, Gao Pian and others governed it in turn; in 887 Gao Pian was killed by his own officers and Yangzhou was laid waste. Yang Xingmi took the region in 892 and was invested as Prince of Wu in 902."},{"k":"江南东道","n":"江南东道","kind":"zhen","note":"江南东道采访使（治苏州），包括今苏南、浙江、福建。","ne":"Jiangnan East Circuit","notee":"The investigation commissioner of the Jiangnan East Circuit (seat at Suzhou), covering today's southern Jiangsu, Zhejiang and Fujian."},{"k":"江南西道","n":"江南西道","kind":"zhen","note":"江南西道采访使（治洪州），包括今皖南、江西、湖南及鄂东南。","ne":"Jiangnan West Circuit","notee":"The investigation commissioner of the Jiangnan West Circuit (seat at Hongzhou), covering today's southern Anhui, Jiangxi, Hunan and southeastern Hubei."},{"k":"黔中","n":"黔中","kind":"zhen","note":"黔中采访使、黔州观察使，治黔州（今重庆彭水），统辖今黔东北、湘西、渝东南大量羁縻蛮州。","ne":"Qianzhong","notee":"The Qianzhong investigation commissioner and Qianzhou surveillance commissioner, with the seat at Qianzhou (today's Pengshui, Chongqing), controlling many loose-rein tribal prefectures in today's northeastern Guizhou, western Hunan and southeastern Chongqing."},{"k":"岭南","n":"岭南","kind":"zhen","note":"岭南五府经略使（天宝），治广州，统广、桂、容、邕、安南五管。乱后析为岭南东道（广州）与桂、容、邕、安南诸管。广州为海上贸易第一大港，设市舶使。唐末刘隐据此，917 年其弟刘䶮称帝（南汉）。","ne":"Lingnan","notee":"The Lingnan pacification commissioner of the Five Commands (Tianbao era), with the seat at Guangzhou, controlling the Five Commands of Guang, Gui, Rong, Yong and Annan. After the rebellion it was divided into the Lingnan East Circuit (Guangzhou) and the Gui, Rong, Yong and Annan commands. Guangzhou was the greatest port of overseas trade, with a maritime trade commissioner. At the end of the Tang Liu Yin held the region, and in 917 his younger brother Liu Yan proclaimed himself emperor (Southern Han)."},{"k":"卢龙","n":"卢龙","kind":"zhen","note":"范阳更名，治幽州。763 年安史降将李怀仙受节；其后朱希彩、朱泚、朱滔、刘怦—刘济—刘总、张仲武、张允伸等相继自立，“河朔三镇”之一，屡有兵变。895 年李克用以刘仁恭镇之，刘氏旋即背晋自立，907 年后为燕。","ne":"Lulong","notee":"Fanyang renamed, with its seat at Youzhou. In 763 the surrendered rebel general Li Huaixian was appointed military governor; after him Zhu Xicai, Zhu Ci, Zhu Tao, Liu Peng–Liu Ji–Liu Zong, Zhang Zhongwu, Zhang Yunshen and others set themselves up in turn. One of the three Hebei fanzhen, it saw repeated mutinies. In 895 Li Keyong installed Liu Rengong here; the Liu family soon turned against Jin and went its own way, and after 907 it became Yan."},{"k":"成德","n":"成德","kind":"zhen","note":"治恒州（820 年避穆宗讳改镇州，今正定）。安史降将李宝臣（张忠志）始据，王武俊—王士真—王承宗、王廷凑—王元逵—王镕两系相继世袭，成德前后割据近一百六十年，“河朔三镇”之一。907 年后王镕称赵王，921 年被部将张文礼所杀，922 年入晋。","ne":"Chengde","notee":"Seat at Hengzhou (renamed Zhenzhou in 820 to avoid the personal name of Emperor Muzong; today's Zhengding). The surrendered rebel general Li Baochen (Zhang Zhongzhi) first held it; two lines, Wang Wujun–Wang Shizhen–Wang Chengzong and Wang Tingcou–Wang Yuankui–Wang Rong, then held it by inheritance; in all, Chengde was autonomous for nearly 160 years. It was one of the three Hebei fanzhen. After 907 Wang Rong styled himself Prince of Zhao; in 921 he was killed by his officer Zhang Wenli, and in 922 the fanzhen passed to Jin."},{"k":"魏博","n":"魏博","kind":"zhen","note":"治魏州。安史降将田承嗣始据，田氏、史氏、何氏、韩氏、乐氏、罗氏相继，牙兵骄横，“长安天子，魏府牙军”。“河朔三镇”中兵力最强。812–820 年田弘正归附朝廷。906 年罗绍威借朱全忠兵尽诛牙军八千家，此后魏博衰落。","ne":"Weibo","notee":"Seat at Weizhou. The surrendered rebel general Tian Chengsi first held it, followed in turn by the Tian, Shi, He, Han, Yue and Luo families. Its headquarters troops were arrogant and unruly: \"In Chang'an, the Son of Heaven; in Weizhou, the headquarters troops.\" It was the strongest of the three Hebei fanzhen. From 812 to 820, under Tian Hongzheng, Weibo was loyal to the court. In 906 Luo Shaowei borrowed Zhu Quanzhong's troops and wiped out the 8,000 households of the headquarters troops, after which Weibo declined."},{"k":"相卫","n":"相卫（昭义）","kind":"zhen","note":"安史降将薛嵩所领，治相州，时称昭义军。773 年薛嵩死，775 年田承嗣夺取相卫诸州，引发朝廷讨伐。","ne":"Xiangwei (Zhaoyi)","notee":"Held by the surrendered rebel general Xue Song, with its seat at Xiangzhou, and known at the time as the Zhaoyi Jun. Xue Song died in 773, and in 775 Tian Chengsi seized the prefectures of Xiangwei, which brought a punitive campaign from the court."},{"k":"淄青","n":"淄青","kind":"zhen","note":"平卢淄青节度，治青州。761 年平卢军渡海南下，765 年李正己逐侯希逸自立，扩地至十五州，李纳、李师古、李师道四世割据五十余年，据有盐铁之利，屡遣刺客。819 年宪宗讨平李师道，分为天平、平卢、兖海三镇。","ne":"Ziqing","notee":"The Pinglu–Ziqing military governorship, with its seat at Qingzhou. In 761 the Pinglu army crossed the sea southward; in 765 Li Zhengji drove out Hou Xiyi and set himself up, expanding to fifteen prefectures. Li Zhengji, Li Na, Li Shigu and Li Shidao held it in four successions for over fifty years, controlling the profits of salt and iron and repeatedly sending assassins. In 819 Emperor Xianzong put down Li Shidao and divided the fanzhen into the three fanzhen of Tianping, Pinglu and Yanhai."},{"k":"汴宋","n":"汴宋","kind":"zhen","note":"河南节度，治汴州，扼守汴河漕运。田神功、李灵曜相继镇守；776 年李灵曜叛，被讨平，所部诸州为李正己等瓜分。","ne":"Biansong","notee":"The Henan military governorship, with its seat at Bianzhou, commanding grain transport on the Bian River. Tian Shengong and Li Lingyao held it in turn; in 776 Li Lingyao rebelled and was put down, and his prefectures were divided up by Li Zhengji and others."},{"k":"滑亳","n":"滑亳","kind":"zhen","note":"滑亳节度（令狐彰），治滑州，后改称永平军、义成军。","ne":"Huabo","notee":"The Huabo military governorship (Linghu Zhang), with its seat at Huazhou, later renamed the Yongping Jun and then the Yicheng Jun."},{"k":"泽潞","n":"泽潞","kind":"zhen","note":"泽潞节度（李抱玉、李抱真兄弟），治潞州。780 年代与相卫合并为昭义军。","ne":"Zelu","notee":"The Zelu military governorship (the brothers Li Baoyu and Li Baozhen), with its seat at Luzhou. In the 780s it was merged with Xiangwei into the Zhaoyi Jun."},{"k":"东都畿","n":"东都畿","kind":"zhen","note":"东都畿汝都防御使、东都留守，治河南府（洛阳）。","ne":"Eastern Capital District","notee":"The chief defense commissioner of the Eastern Capital District and Ruzhou, and the custodian of the Eastern Capital, with the seat at Henan Fu (Luoyang)."},{"k":"陕虢","n":"陕虢","kind":"zhen","note":"陕虢观察使（保义军），治陕州，扼守潼关以东的漕运要道三门峡。","ne":"Shanguo","notee":"The Shanguo surveillance commissioner (Baoyi Jun), with the seat at Shanzhou, guarding the Sanmen Gorge on the grain-transport route east of Tong Pass."},{"k":"河中","n":"河中","kind":"zhen","note":"河中节度（护国军），治河中府（蒲州），控扼蒲津渡，连接关中与河东。唐末王重荣、王重盈、王珂相继，与李克用通婚，901 年为朱全忠所并。","ne":"Hezhong","notee":"The Hezhong military governorship (Huguo Jun), with its seat at Hezhong Fu (Puzhou), commanding the Pujin Ford and linking Guanzhong with Hedong. At the end of the Tang Wang Chongrong, Wang Chongying and Wang Ke held it in turn and married into Li Keyong's family; in 901 Zhu Quanzhong annexed it."},{"k":"鄜坊","n":"鄜坊","kind":"zhen","note":"鄜坊丹延节度（保大军），治鄜州，屏蔽长安北面。","ne":"Fufang","notee":"The Fu–Fang–Dan–Yan military governorship (Baoda Jun), with its seat at Fuzhou, screening Chang'an to the north."},{"k":"凤翔","n":"凤翔","kind":"zhen","note":"凤翔节度，治凤翔府（岐州），为长安西面门户，757 年肃宗以此为行在。唐末李茂贞据之，即后来的岐国。","ne":"Fengxiang","notee":"The Fengxiang military governorship, with its seat at Fengxiang Fu (Qizhou), the western gateway to Chang'an; in 757 Emperor Suzong made it his temporary capital. At the end of the Tang Li Maozhen held it; it became the later state of Qi."},{"k":"荆南","n":"荆南","kind":"zhen","note":"荆南节度，治江陵府，为长江中游重镇与南北水陆转运枢纽。唐末成汭据之（888–903），907 年高季昌受梁命镇守，即后来的荆南（南平）国。","ne":"Jingnan","notee":"The Jingnan military governorship, with its seat at Jiangling Fu, a key fanzhen on the middle Yangtze and a hub of north–south transport by water and land. At the end of the Tang Cheng Rui held it (888–903); in 907 Gao Jichang took charge of it on the orders of Liang, and it became the later state of Jingnan (Nanping)."},{"k":"西川","n":"西川","kind":"zhen","note":"剑南西川节度，治成都府，防御吐蕃与南诏。韦皋镇蜀二十一年（785–805），联南诏破吐蕃；806 年刘辟叛被讨平。829 年、869–870 年南诏两次兵临成都。891 年王建入成都，907 年称帝（前蜀）。","ne":"Xichuan","notee":"The Jiannan Xichuan military governorship, with its seat at Chengdu Fu, defending against Tibet and Nanzhao. Wei Gao governed Shu for twenty-one years (785–805) and allied with Nanzhao to defeat Tibet; in 806 Liu Pi rebelled and was put down. In 829 and in 869–870 Nanzhao armies twice reached Chengdu. Wang Jian entered Chengdu in 891 and proclaimed himself emperor in 907 (Former Shu)."},{"k":"东川","n":"东川","kind":"zhen","note":"剑南东川节度，治梓州（今三台）。唐末顾彦朗、顾彦晖兄弟据之，897 年为王建所并。","ne":"Dongchuan","notee":"The Jiannan Dongchuan military governorship, with its seat at Zizhou (today's Santai). At the end of the Tang the brothers Gu Yanlang and Gu Yanhui held it; in 897 Wang Jian annexed it."},{"k":"淮西","n":"淮西","kind":"zhen","note":"淮西节度（彰义军），治蔡州。李忠臣、李希烈、陈仙奇、吴少诚、吴少阳、吴元济相继割据三十余年，扼江淮漕路。817 年十月李愬雪夜袭蔡州，擒吴元济，淮西平，诸州分隶邻镇。","ne":"Huaixi","notee":"The Huaixi military governorship (Zhangyi Jun), with its seat at Caizhou. Li Zhongchen, Li Xilie, Chen Xianqi, Wu Shaocheng, Wu Shaoyang and Wu Yuanji held it in turn as their own for over thirty years, astride the grain route of the Yangtze and Huai. In the 10th month of 817 Li Su made a surprise attack on Caizhou on a snowy night and captured Wu Yuanji; Huaixi was pacified and its prefectures were divided among the neighboring fanzhen."},{"k":"鄂岳","n":"鄂岳","kind":"zhen","note":"鄂岳观察使（武昌军），治鄂州。唐末杜洪据之，905 年为杨行密所并。","ne":"Eyue","notee":"The Eyue surveillance commissioner (Wuchang Jun), with the seat at Ezhou. At the end of the Tang Du Hong held it; in 905 Yang Xingmi annexed it."},{"k":"浙西","n":"浙西","kind":"zhen","note":"浙江西道观察使（镇海军），治润州，是唐后期财赋最重要的来源之一。807 年李锜叛被讨平。唐末钱镠为镇海节度使，移治杭州。","ne":"Zhexi","notee":"The surveillance commissioner of the Zhejiang West Circuit (Zhenhai Jun), with the seat at Runzhou; one of the most important sources of revenue for the late Tang. In 807 Li Qi rebelled and was put down. At the end of the Tang Qian Liu became military governor of the Zhenhai Jun and moved the seat to Hangzhou."},{"k":"浙东","n":"浙东","kind":"zhen","note":"浙江东道观察使（义胜军），治越州。859–860 年裘甫起义于此。唐末董昌据之，895 年称帝。","ne":"Zhedong","notee":"The surveillance commissioner of the Zhejiang East Circuit (Yisheng Jun), with the seat at Yuezhou. Qiu Fu's rising took place here in 859–860. At the end of the Tang Dong Chang held it and proclaimed himself emperor in 895."},{"k":"宣歙","n":"宣歙","kind":"zhen","note":"宣歙观察使（宁国军），治宣州。889 年杨行密据宣州，以此为基业。","ne":"Xuanshe","notee":"The Xuanshe surveillance commissioner (Ningguo Jun), with the seat at Xuanzhou. Yang Xingmi took Xuanzhou in 889 and made it his base."},{"k":"江西","n":"江西","kind":"zhen","note":"江南西道观察使（镇南军），治洪州。唐末钟传据洪州（882–906），死后为杨吴所并。","ne":"Jiangxi","notee":"The surveillance commissioner of the Jiangnan West Circuit (Zhennan Jun), with the seat at Hongzhou. At the end of the Tang Zhong Chuan held Hongzhou (882–906); after his death it was annexed by the Yang family's Wu."},{"k":"湖南","n":"湖南","kind":"zhen","note":"湖南观察使（武安军），治潭州。894 年孙儒余部刘建锋、马殷入潭州，896 年马殷继立，即后来的楚国。","ne":"Hunan","notee":"The Hunan surveillance commissioner (Wu'an Jun), with the seat at Tanzhou. In 894 Liu Jianfeng and Ma Yin, leading the remnants of Sun Ru's army, entered Tanzhou; in 896 Ma Yin succeeded, and it became the later state of Chu."},{"k":"福建","n":"福建","kind":"zhen","note":"福建观察使（威武军），治福州。893 年王潮、王审知取福州，907 年后为闽国。","ne":"Fujian","notee":"The Fujian surveillance commissioner (Weiwu Jun), with the seat at Fuzhou. In 893 Wang Chao and Wang Shenzhi took Fuzhou; after 907 it became the state of Min."},{"k":"桂管","n":"桂管","kind":"zhen","note":"桂管经略使（静江军），治桂州。868 年戍守桂州的徐州兵庞勋等哗变北归，引发庞勋之乱。900 年后为马楚所取。","ne":"Gui Command","notee":"The Gui Command pacification commissioner (Jingjiang Jun), with the seat at Guizhou. In 868 Pang Xun and other soldiers from Xuzhou garrisoning Guizhou mutinied and marched north, setting off the Pang Xun rebellion. After 900 it was taken by the Ma family's Chu."},{"k":"容管","n":"容管","kind":"zhen","note":"容管经略使（宁远军），治容州。唐末庞巨昭据之，911 年降南汉。","ne":"Rong Command","notee":"The Rong Command pacification commissioner (Ningyuan Jun), with the seat at Rongzhou. At the end of the Tang Pang Juzhao held it; in 911 he surrendered to Southern Han."},{"k":"邕管","n":"邕管","kind":"zhen","note":"邕管经略使（建武军），治邕州，防御西原蛮与南诏。唐末叶广略据之，911 年为南汉所并。","ne":"Yong Command","notee":"The Yong Command pacification commissioner (Jianwu Jun), with the seat at Yongzhou, defending against the Xiyuan tribes and Nanzhao. At the end of the Tang Ye Guanglüe held it; in 911 Southern Han annexed it."},{"k":"安南","n":"安南","kind":"zhen","note":"安南都护府（866 年改静海军），治交州（宋平，今河内）。858–866 年数为南诏所陷，866 年高骈收复，筑大罗城。905 年土豪曲承裕自称节度使，开启自主时期；931 年杨廷艺、938 年吴权相继逐南汉军；968 年丁部领建大瞿越国，越南独立。","ne":"Annan","notee":"The Annan Protectorate (renamed the Jinghai Jun in 866), with its seat at Giao Châu (Tống Bình, today's Hanoi). Between 858 and 866 Nanzhao took it several times; in 866 Gao Pian recovered it and built the city of Đại La. In 905 the local magnate Khúc Thừa Dụ proclaimed himself military governor, opening a period of self-rule; Dương Đình Nghệ in 931 and Ngô Quyền in 938 drove out Southern Han armies in turn. In 968 Đinh Bộ Lĩnh founded the state of Đại Cồ Việt, and Vietnam became independent."},{"k":"昭义","n":"昭义","kind":"zhen","note":"昭义军（泽潞），治潞州，兼领太行山东的邢、洺、磁三州，是朝廷楔入河朔三镇之间的钉子。843 年刘稹拒命，844 年李德裕主持讨平。唐末为李克用所据，邢洺磁则被朱全忠夺取。","ne":"Zhaoyi","notee":"The Zhaoyi Jun (Zelu), with its seat at Luzhou, also holding the three prefectures of Xingzhou, Mingzhou and Cizhou east of the Taihang Mountains; it was the court's wedge driven between the three Hebei fanzhen. In 843 Liu Zhen defied the court, and in 844 a campaign directed by Li Deyu put him down. At the end of the Tang Li Keyong held it, while Xing, Ming and Ci were taken by Zhu Quanzhong."},{"k":"宣武","n":"宣武","kind":"zhen","note":"宣武军，治汴州（初治宋州），扼汴河漕运咽喉，以兵骄著称。883 年朱全忠（朱温）任宣武节度使，以此为基业并吞河南诸镇，907 年篡唐。","ne":"Xuanwu","notee":"The Xuanwu Jun, with its seat at Bianzhou (at first at Songzhou), holding the choke point of grain transport on the Bian River and notorious for its arrogant troops. In 883 Zhu Quanzhong (Zhu Wen) became military governor of Xuanwu; from this base he swallowed up the fanzhen of Henan, and in 907 he usurped the Tang throne."},{"k":"义成","n":"义成","kind":"zhen","note":"义成军，治滑州，扼守黄河白马津。","ne":"Yicheng","notee":"The Yicheng Jun, with its seat at Huazhou, guarding the Baima Ford on the Yellow River."},{"k":"义武","n":"义武","kind":"zhen","note":"义武军，782 年由成德析出，治定州，张孝忠始任。张茂昭 810 年举族入朝。唐末王处存、王郜、王处直相继，907 年后称北平王，921 年王都囚父自立，929 年后唐讨平。","ne":"Yiwu","notee":"The Yiwu Jun, split off from Chengde in 782, with its seat at Dingzhou; Zhang Xiaozhong was its first military governor. In 810 Zhang Maozhao went to court with his whole clan. At the end of the Tang Wang Chucun, Wang Gao and Wang Chuzhi held it in turn, and after 907 Wang Chuzhi styled himself Prince of Beiping; in 921 Wang Du imprisoned his father and took over, and in 929 Later Tang put him down."},{"k":"邠宁","n":"邠宁","kind":"zhen","note":"邠宁节度（静难军），治邠州，屏蔽长安西北。895 年节度使王行瑜与李茂贞、韩建犯阙，被李克用讨杀。","ne":"Binning","notee":"The Binning military governorship (Jingnan Jun), with its seat at Binzhou, screening Chang'an to the northwest. In 895 its military governor Wang Xingyu marched on the capital with Li Maozhen and Han Jian, and was put down and killed by Li Keyong."},{"k":"横海","n":"横海","kind":"zhen","note":"横海军（沧景），785 年由义武析出，治沧州，程日华、程怀直等世袭。唐末改称义昌军，898 年为刘仁恭所并。","ne":"Henghai","notee":"The Henghai Jun (Cang–Jing), split off from Yiwu in 785, with its seat at Cangzhou; Cheng Rihua, Cheng Huaizhi and others held it by inheritance. At the end of the Tang it was renamed the Yichang Jun, and in 898 Liu Rengong annexed it."},{"k":"武宁","n":"武宁","kind":"zhen","note":"武宁军，治徐州，扼守汴河南段与淮北，以银刀都等骄兵著称。868–869 年庞勋之乱以徐州为中心。唐末时溥据之，893 年为朱全忠所灭。","ne":"Wuning","notee":"The Wuning Jun, with its seat at Xuzhou, guarding the southern stretch of the Bian River and the region north of the Huai, and notorious for unruly units such as the Silver Sabre Corps. The Pang Xun rebellion of 868–869 centered on Xuzhou. At the end of the Tang Shi Pu held it; in 893 Zhu Quanzhong destroyed him."},{"k":"忠武","n":"忠武","kind":"zhen","note":"忠武军（陈许），治许州，以陈许兵善战著称，平淮西之役出力甚多。","ne":"Zhongwu","notee":"The Zhongwu Jun (Chen–Xu), with its seat at Xuzhou; the troops of Chen and Xu were famed as fighters and did much in the campaign to pacify Huaixi."},{"k":"河阳","n":"河阳","kind":"zhen","note":"河阳三城节度，扼守黄河孟津渡口，拱卫东都；843 年置孟州。","ne":"Heyang","notee":"The Three Cities of Heyang military governorship, guarding the Mengjin Ford on the Yellow River and protecting the Eastern Capital; Mengzhou was established in 843."},{"k":"泾原","n":"泾原","kind":"zhen","note":"泾原节度，治泾州，768 年置，防御吐蕃前线。783 年泾原兵过长安哗变，拥立朱泚。","ne":"Jingyuan","notee":"The Jingyuan military governorship, with its seat at Jingzhou, established in 768 on the front line against Tibet. In 783 the Jingyuan troops mutinied while passing through Chang'an and raised Zhu Ci to power."},{"k":"夏绥","n":"夏绥","kind":"zhen","note":"夏绥银宥节度，治夏州（统万城），防御党项与吐蕃。881 年党项拓跋思恭任节度使，旋赐号定难军。","ne":"Xiasui","notee":"The Xia–Sui–Yin–You military governorship, with its seat at Xiazhou (Tongwan City), defending against the Tanguts and Tibet. In 881 Tuoba Sigong of the Tanguts became military governor, and it was soon renamed the Dingnan Jun."},{"k":"振武","n":"振武","kind":"zhen","note":"振武军，治单于都护府（今和林格尔），防御回纥、沙陀与鞑靼。843 年刘沔、石雄自此出兵，在杀胡山大破回鹘乌介可汗。","ne":"Zhenwu","notee":"The Zhenwu Jun, with its seat at the Chanyu Protectorate (today's Horinger), defending against the Uyghurs, the Shatuo and the Tatars. In 843 Liu Mian and Shi Xiong marched out from here and crushed the Uyghur Wujie Khagan at Mount Shahu."},{"k":"天德","n":"天德","kind":"zhen","note":"天德军，治西受降城一带（后移天德旧城），屏蔽河套，是唐与回鹘交通的门户。","ne":"Tiande","notee":"The Tiande Jun, with its seat around the Western Shouxiang City (later moved to the old Tiande city), screening the Ordos Loop; it was the gateway for traffic between Tang and the Uyghurs."},{"k":"天平","n":"天平","kind":"zhen","note":"819 年分淄青置，治郓州。唐末朱瑄据之，897 年为朱全忠所灭。","ne":"Tianping","notee":"Created in 819 from part of Ziqing, with its seat at Yunzhou. At the end of the Tang Zhu Xuan held it; in 897 Zhu Quanzhong destroyed him."},{"k":"平卢·青","n":"平卢（青州）","kind":"zhen","note":"819 年分淄青后的平卢军，治青州，领青、淄、齐、登、莱五州。唐末王师范据之，903 年降朱全忠。","ne":"Pinglu (Qingzhou)","notee":"The Pinglu Jun after the division of Ziqing in 819, with its seat at Qingzhou, holding the five prefectures of Qingzhou, Zizhou, Qizhou, Dengzhou and Laizhou. At the end of the Tang Wang Shifan held it; in 903 he surrendered to Zhu Quanzhong."},{"k":"泰宁","n":"泰宁（兖海）","kind":"zhen","note":"819 年分淄青置兖海观察使，后升泰宁军，治兖州。唐末朱瑾据之，897 年为朱全忠所夺，朱瑾奔淮南杨行密。","ne":"Taining (Yanhai)","notee":"Created in 819 from part of Ziqing as the Yanhai surveillance commissioner, later raised to the Taining Jun, with its seat at Yanzhou. At the end of the Tang Zhu Jin held it; in 897 Zhu Quanzhong seized it, and Zhu Jin fled to Yang Xingmi in Huainan."},{"k":"秦成","n":"秦成（天雄军）","kind":"zhen","note":"849 年收复秦州后所置，治秦州，防御吐蕃诸部，后为天雄军节度。","ne":"Qincheng (Tianxiong Jun)","notee":"Established after Qinzhou was recovered in 849, with its seat at Qinzhou, defending against the Tibetan tribes; it later became the Tianxiong Jun military governorship."},{"k":"奉国","n":"奉国（蔡州）","kind":"zhen","note":"蔡州秦宗权 881 年受任奉国军防御使，883 年降黄巢，黄巢死后自称皇帝，四出屠掠，888 年为部将申丛所执，献于朱全忠，889 年斩于长安。","ne":"Fengguo (Caizhou)","notee":"Qin Zongquan of Caizhou was appointed defense commissioner of the Fengguo Jun in 881. In 883 he surrendered to Huang Chao; after Huang Chao's death he proclaimed himself emperor and massacred and plundered in all directions. In 888 his officer Shen Cong seized him and handed him over to Zhu Quanzhong; he was beheaded at Chang'an in 889."},{"k":"大同","n":"大同","kind":"zhen","note":"大同军防御使，治云州，统云、蔚、朔等州，沙陀李国昌、李克用父子曾在此起事（878）。","ne":"Datong","notee":"The Datong Jun defense commissioner, with the seat at Yunzhou, controlling Yunzhou, Yuzhou, Shuozhou and other prefectures; Li Guochang and his son Li Keyong of the Shatuo once rose here (878)."},{"k":"镇国","n":"镇国（华州）","kind":"zhen","note":"镇国军，治华州，扼守潼关。唐末韩建据之，896–898 年昭宗被迫出居华州。","ne":"Zhenguo (Huazhou)","notee":"The Zhenguo Jun, with its seat at Huazhou, guarding Tong Pass. At the end of the Tang Han Jian held it, and in 896–898 Emperor Zhaozong was forced to live at Huazhou."},{"k":"镇海","n":"镇海（钱镠）","kind":"zhen","note":"唐末钱镠以镇海军节度使据杭州及浙西南部，896 年灭董昌，并有两浙，907 年后为吴越国。","ne":"Zhenhai (Qian Liu)","notee":"At the end of the Tang Qian Liu, as military governor of the Zhenhai Jun, held Hangzhou and southern Zhexi. In 896 he destroyed Dong Chang and held both Zhexi and Zhedong; after 907 it became the state of Wuyue."},{"k":"危全讽","n":"抚信（危全讽）","kind":"zhen","note":"危全讽据抚州、其弟危仔倡据信州（约 882–909），909 年象牙潭之战为杨吴所败。","ne":"Fuxin (Wei Quanfeng)","notee":"Wei Quanfeng held Fuzhou and his younger brother Wei Zichang held Xinzhou (c. 882–909); in 909 the Yang family's Wu defeated them at the Battle of Xiangyatan."},{"k":"虔州","n":"虔州（卢光稠）","kind":"zhen","note":"卢光稠 885 年据虔州，后取韶州，依违于梁、吴、南汉之间；918 年虔州为吴所取。","ne":"Qianzhou (Lu Guangchou)","notee":"Lu Guangchou took Qianzhou in 885 and later Shaozhou, wavering between Liang, Wu and Southern Han; in 918 Qianzhou was taken by Wu."},{"k":"武贞","n":"武贞（雷氏）","kind":"zhen","note":"雷满 881 年据朗州，与荆南成汭为敌；子雷彦恭 908 年为楚所灭。","ne":"Wuzhen (Lei family)","notee":"Lei Man took Langzhou in 881 and was an enemy of Cheng Rui of Jingnan; in 908 his son Lei Yangong was overthrown by Chu."},{"k":"西川·孟","n":"西川（孟知祥）","kind":"zhen","note":"后唐灭前蜀后，925 年以孟知祥为西川节度使，930 年起与东川董璋联兵抗命，932 年并东川，934 年称帝建后蜀。","ne":"Xichuan (Meng Zhixiang)","notee":"After Later Tang destroyed Former Shu, Meng Zhixiang was made military governor of Xichuan in 925. From 930 he joined Dong Zhang of Dongchuan in defying the court; in 932 he annexed Dongchuan, and in 934 he proclaimed himself emperor and founded Later Shu."},{"k":"东川·董","n":"东川（董璋）","kind":"zhen","note":"925 年后唐以董璋为东川节度使，930 年与孟知祥共拒朝命，932 年两川相攻，董璋败死。","ne":"Dongchuan (Dong Zhang)","notee":"In 925 Later Tang made Dong Zhang military governor of Dongchuan. In 930 he and Meng Zhixiang together defied the court; in 932 the two Chuan turned on each other, and Dong Zhang was defeated and died."}],"seeds":[{"id":"京兆府","n":"京兆府","mod":"陕西西安","lon":108.94,"lat":34.27,"t":"z","nm":[[0,"京兆府"],[907,"大安府"],[923,"京兆府"]],"ne":"Jingzhao Fu","nme":["Jingzhao Fu","Da'an Fu","Jingzhao Fu"],"mode":"Xi'an, Shaanxi"},{"id":"华州","n":"华州","mod":"陕西渭南华州区","lon":109.77,"lat":34.51,"t":"z","ne":"Huazhou","mode":"Huazhou District, Weinan, Shaanxi"},{"id":"同州","n":"同州","mod":"陕西大荔","lon":109.94,"lat":34.8,"t":"z","ne":"Tongzhou","mode":"Dali County, Shaanxi"},{"id":"凤翔府","n":"凤翔府","mod":"陕西凤翔","lon":107.39,"lat":34.52,"t":"z","nm":[[0,"岐州"],[757,"凤翔府"]],"ne":"Fengxiang Fu","nme":["Qizhou","Fengxiang Fu"],"mode":"Fengxiang District, Baoji, Shaanxi"},{"id":"陇州","n":"陇州","mod":"陕西陇县","lon":106.85,"lat":34.9,"t":"z","ne":"Longzhou","mode":"Long County, Shaanxi"},{"id":"邠州","n":"邠州","mod":"陕西彬州","lon":108.08,"lat":35.03,"t":"z","ne": g. After the Yellow River broke its banks at Huazhou in 944, it merged with the Wen and Ji rivers to form Liangshan Marsh."}},{"c":"river","sub":"marsh","old":"居延海","mod":"内蒙古额济纳（今居延海）","note":"弱水尾闾，唐置宁寇军。","lon":101.25,"lat":42.25,"rx":0.22,"ry":0.15,"anc":[101.25,42.25],"i":111,"e":{"old":"Juyan Lake","mod":"Ejin Banner, Inner Mongolia (today's Juyan Lake)","note":"The terminal lake of the Ruoshui; the Tang stationed Ningkou Jun here."}},{"c":"river","sub":"marsh","old":"滇池","mod":"滇池","note":"南诏拓东城临滇池。","lon":102.7,"lat":24.85,"rx":0.08,"ry":0.2,"anc":[102.7,24.85],"i":112,"e":{"old":"Lake Dian","mod":"Lake Dian","note":"Nanzhao's Tuodong City stood by Lake Dian."}},{"c":"river","sub":"marsh","old":"洱海","mod":"洱海","note":"古称西洱河，南诏核心地带。","lon":100.2,"lat":25.8,"rx":0.06,"ry":0.2,"anc":[100.2,25.8],"i":113,"e":{"old":"Erhai Lake","mod":"Erhai Lake","note":"Known in antiquity as the Western Er River; the heartland of Nanzhao."}},{"c":"river","sub":"marsh","old":"忽汗海","mod":"镜泊湖","note":"渤海上京附近。","lon":128.95,"lat":43.85,"rx":0.06,"ry":0.15,"anc":[128.95,43.85],"i":114,"e":{"old":"Huhan Lake","mod":"Jingpo Lake","note":"Near the Balhae Supreme Capital."}},{"c":"river","sub":"marsh","old":"白水塘","mod":"江苏洪泽西","note":"","lon":118.75,"lat":33.3,"rx":0.1,"ry":0.07,"anc":[118.75,33.3],"i":115,"e":{"old":"Baishui Reservoir","mod":"west of Hongze, Jiangsu"}},{"c":"canal","old":"通济渠（汴河）","mod":"隋唐大运河通济渠段","note":"隋炀帝开凿，连接黄河与淮河，是唐宋漕运的生命线。汴州、宋州、宿州、泗州依河而兴，五代（后唐除外）、北宋定都开封即因汴河漕运之便。","anc":[116.0478624868343,34.181335945728556],"i":116,"e":{"old":"Tongji Canal (Bian River)","mod":"Tongji Canal section of the Sui–Tang Grand Canal","note":"Dug under Emperor Yang of Sui to link the Yellow River and the Huai, it was the lifeline of grain transport under the Tang and Song. Bianzhou, Songzhou, Suzhou and Sizhou grew up along it, and the Five Dynasties (except the Later Tang) and the Northern Song made Kaifeng their capital because of the easy transport the Bian River offered."}},{"c":"canal","old":"永济渠（御河）","mod":"卫河—南运河","note":"自沁水口北达涿郡（幽州），隋征高丽时开凿；唐代河北诸镇亦借此转运。","anc":[115.91059480175099,37.06059480175099],"i":117,"e":{"old":"Yongji Canal (Yu River)","mod":"Wei River – South Canal","note":"Ran from the mouth of the Qin River north to Zhuo Commandery (Youzhou); dug when the Sui attacked Goguryeo. The Hebei fanzhen of the Tang also used it for transport."}},{"c":"canal","old":"山阳渎（邗沟）","mod":"里运河","note":"扬州至楚州，连接长江与淮河。","anc":[119.38790898338785,32.96627304983647],"i":118,"e":{"old":"Shanyang Canal (Han Canal)","mod":"Liyun Canal","note":"From Yangzhou to Chuzhou, linking the Yangtze and the Huai."}},{"c":"canal","old":"江南河","mod":"江南运河","note":"润州至杭州，江南财赋由此北运。","anc":[120.55241315844047,31.364914308767112],"i":119,"e":{"old":"Jiangnan Canal","mod":"Jiangnan Canal","note":"From Runzhou to Hangzhou; the revenue of Jiangnan was shipped north along it."}},{"c":"canal","old":"漕渠","mod":"陕西西安至潼关（隋广通渠故道，已湮废）","note":"长安至潼关的运渠，与渭水平行。","anc":[109.6122110959217,34.48244221918434],"i":120,"e":{"old":"Cao Canal","mod":"from Xi'an to Tongguan, Shaanxi (course of the Sui Guangtong Canal, long silted up)","note":"A transport canal from Chang'an to Tong Pass, running parallel to the Wei River."}},{"c":"canal","old":"灵渠","mod":"灵渠","note":"秦凿，沟通湘水与漓水；825 年李渤、868 年鱼孟威先后重修。","anc":[110.60189106065297,25.620504282840795],"i":121,"e":{"old":"Lingqu Canal","mod":"Lingqu Canal","note":"Dug under the Qin to link the Xiang and Li rivers; rebuilt by Li Bo in 825 and by Yu Mengwei in 868."}},{"c":"range","old":"终南山（秦岭）","mod":"秦岭","note":"关中的南屏，唐人称南山、终南山，有子午、傥骆、褒斜、陈仓等谷道入汉中。","geo":[[104.5,34.3],[105.5,34.2],[106.5,34.1],[107.5,33.95],[108.5,33.9],[109.3,33.95],[110.0,33.9],[110.8,33.7],[111.5,33.6]],"anc":[108.007,33.925],"major":true,"i":122,"e":{"old":"Zhongnan Mountains (Qinling)","mod":"Qinling Mountains","note":"The southern screen of Guanzhong; the Tang called it the Southern Mountains or Zhongnan Mountains. The Ziwu, Tangluo, Baoxie and Chencang valley roads cross i
